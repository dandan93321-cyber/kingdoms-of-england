<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>UK MONOPOLY · Multiplayer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at top, #26354a 0%, #111722 45%, #090d14 100%);
    color: #fff;
}

body {
    padding: 14px;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.container {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.logo {
    font-weight: 900;
    letter-spacing: 1px;
    font-size: 22px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #b9c4d5;
}

.connection-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
}

.connection.online .connection-dot {
    background: #35d07f;
    box-shadow: 0 0 10px rgba(53,208,127,.7);
}

.connection.error .connection-dot {
    background: #ff4f64;
}

/* =========================================================
   CARD
========================================================= */

.card {
    background: rgba(22, 29, 41, .94);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0,0,0,.28);
}

.panel {
    padding: 18px;
}

/* =========================================================
   LOBBY
========================================================= */

.lobby {
    max-width: 520px;
    margin: 45px auto;
}

.lobby h1 {
    margin: 0 0 6px;
    font-size: 30px;
}

.subtitle {
    color: #9ca9bb;
    font-size: 14px;
    margin-bottom: 24px;
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    font-size: 12px;
    color: #9ca9bb;
    margin-bottom: 7px;
}

.field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid #354154;
    background: #0d131d;
    color: white;
    outline: none;
}

.field input:focus {
    border-color: #668cff;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: 0;
    border-radius: 12px;
    min-height: 46px;
    padding: 0 17px;
    font-weight: 800;
    color: white;
    background: #2a3547;
}

.btn:hover {
    filter: brightness(1.1);
}

.btn-primary {
    background: linear-gradient(135deg, #587cff, #7859e8);
}

.btn-success {
    background: linear-gradient(135deg, #20a66a, #2cc784);
}

.btn-warning {
    background: linear-gradient(135deg, #d99727, #f2b83f);
    color: #161616;
}

.btn-danger {
    background: #9c3143;
}

.btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.room-code {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
    text-align: center;
    padding: 16px;
    border-radius: 14px;
    background: #0b111a;
    margin: 14px 0;
}

/* =========================================================
   GAME LAYOUT
========================================================= */

.game-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px;
}

@media (max-width: 900px) {
    .game-layout {
        grid-template-columns: 1fr;
    }
}

/* =========================================================
   GAME TOP
========================================================= */

.game-top {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    margin-bottom: 14px;
}

.game-info {
    padding: 16px;
}

.game-status {
    font-size: 13px;
    color: #9ca9bb;
}

.current-player {
    margin-top: 4px;
    font-size: 22px;
    font-weight: 900;
}

.turn-number {
    color: #8e9aab;
    font-size: 12px;
    margin-top: 5px;
}

.dice-box {
    min-width: 180px;
    padding: 15px;
    text-align: center;
}

.dice-label {
    color: #9ca9bb;
    font-size: 11px;
    margin-bottom: 7px;
}

.dice {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.die {
    width: 48px;
    height: 48px;
    border-radius: 11px;
    background: white;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: 900;
}

/* =========================================================
   BOARD
========================================================= */

.board-wrap {
    padding: 12px;
}

.board {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    grid-template-rows: repeat(11, 1fr);
    gap: 3px;
    background: #060a10;
    border-radius: 14px;
    padding: 4px;
}

.board-center {
    grid-column: 2 / 11;
    grid-row: 2 / 11;
    border-radius: 12px;
    background:
        radial-gradient(circle, #27344a 0%, #192230 65%, #131a25 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 0;
}

.board-title {
    font-size: clamp(16px, 4vw, 34px);
    font-weight: 1000;
    letter-spacing: 3px;
    transform: rotate(-10deg);
    color: rgba(255,255,255,.8);
}

.space {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #f0eee7;
    color: #111;
    border-radius: 4px;
    border: 1px solid #555;
    padding: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    font-size: clamp(5px, .75vw, 10px);
}

.space-color {
    width: 100%;
    height: 18%;
    min-height: 4px;
    background: #888;
    margin-bottom: 2px;
}

.space-name {
    font-weight: 800;
    line-height: 1.05;
    word-break: break-word;
}

.space-price {
    margin-top: 2px;
    font-size: .8em;
    color: #555;
}

.space-tokens {
    position: absolute;
    left: 2px;
    right: 2px;
    bottom: 2px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px;
}

.token {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,.6);
}

.owner-mark {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid white;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.players-panel,
.action-panel,
.log-panel {
    padding: 16px;
}

.panel-title {
    font-weight: 900;
    font-size: 16px;
    margin-bottom: 12px;
}

.player-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.player {
    border: 1px solid rgba(255,255,255,.07);
    background: #121a26;
    border-radius: 12px;
    padding: 11px;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 9px;
    align-items: center;
}

.player.active {
    border-color: #6d8cff;
    box-shadow: 0 0 0 1px rgba(109,140,255,.25);
}

.player.me {
    background: #17233a;
}

.player-token {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid white;
}

.player-name {
    font-weight: 800;
    font-size: 14px;
}

.player-meta {
    color: #8794a8;
    font-size: 11px;
    margin-top: 2px;
}

.player-money {
    font-weight: 900;
    font-size: 13px;
}

/* =========================================================
   ACTION
========================================================= */

.action-message {
    padding: 11px;
    border-radius: 10px;
    background: #0c121c;
    color: #aab5c5;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.action-buttons .btn:first-child {
    grid-column: 1 / -1;
    min-height: 54px;
    font-size: 17px;
}

.property-info {
    margin-top: 12px;
    padding: 11px;
    background: #101824;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.6;
}

/* =========================================================
   LOG
========================================================= */

.log {
    max-height: 250px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.log-item {
    font-size: 12px;
    line-height: 1.4;
    padding: 8px 9px;
    background: #0e151f;
    border-radius: 8px;
    color: #aeb9c9;
}

.log-item strong {
    color: white;
}

/* =========================================================
   TOAST
========================================================= */

.toast-container {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: min(92vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    background: #161f2d;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    padding: 12px 14px;
    border-radius: 11px;
    font-size: 13px;
    animation: toastIn .2s ease;
}

.toast.error {
    border-color: rgba(255,75,95,.45);
}

.toast.success {
    border-color: rgba(48,205,124,.45);
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    opacity: .6;
    pointer-events: none;
}

.small {
    font-size: 11px;
    color: #7f8b9d;
}

.divider {
    height: 1px;
    background: rgba(255,255,255,.07);
    margin: 14px 0;
}
</style>
</head>

<body>

<div class="toast-container" id="toastContainer"></div>

<div class="container">

    <div class="header">
        <div class="logo">MONOPOLY</div>

        <div class="connection" id="connectionStatus">
            <span class="connection-dot"></span>
            <span id="connectionText">連線中...</span>
        </div>
    </div>

    <!-- =====================================================
         LOBBY
    ====================================================== -->

    <section id="lobbyScreen" class="card lobby panel">

        <h1>UK MONOPOLY</h1>

        <div class="subtitle">
            Supabase Multiplayer Edition
        </div>

        <div class="field">
            <label>你的名字</label>
            <input
                id="nameInput"
                maxlength="20"
                placeholder="例如：Alice"
                autocomplete="off">
        </div>

        <div class="field">
            <label>房間代碼</label>
            <input
                id="roomInput"
                maxlength="12"
                placeholder="例如：ABCD"

            <button

            </button>

            <button
                class="btn btn-success"

            </button>

        </div>

        <div class="divider"></div>

        <div class="small">
            目前版本支援多人房間、Realtime 同步、輪流擲骰、移動及購買地產。
        </div>

    </section>

    <!-- =====================================================
         GAME
    ====================================================== -->

    <section id="gameScreen" class="hidden">

        <div class="game-top">

            <div class="card game-info">

                <div class="game-status">
                    房間：
                    <strong id="roomCodeDisplay">----</strong>
                </div>

                <div

                    id="currentPlayerDisplay">

                </div>

                <div
                    class="turn-number"
                    id="turnNumberDisplay">
                    回合：0
                </div>

            </div>

            <div class="card dice-box">

                <div class="dice-label">
                    最近一次骰子
                </div>

                <div class="dice">

                    <div
                        class="die"
                        id="die1">
                        —
                    </div>

                    <div
                        class="die"
                        id="die2">
                        —
                    </div>

                </div>

            </div>

        </div>

        <div class="game-layout">

            <!-- BOARD -->

            <div class="card board-wrap">

                <div id="board" class="board">

                    <div class="board-center">
                        <div class="board-title">
                            UK<br>MONOPOLY
                        </div>
                    </div>

                </div>

            </div>

            <!-- SIDEBAR -->

            <aside class="sidebar">

                <!-- PLAYERS -->

                <div class="card players-panel">

                    <div class="panel-title">
                        玩家
                    </div>

                    <div
                        id="playerList"
                        class="player-list">
                    </div>

                    <div class="divider"></div>

                    <button
                        id="startGameBtn"
                        class="btn btn-primary"
                        style="width:100%">
                        開始遊戲
                    </button>

                </div>

                <!-- ACTION -->

                <div class="card action-panel">

                    <div class="panel-title">

                    </div>

                    <div

                        等待玩家加入。
                    </div>

                        </button>

                        <button

                            🏠 購買地產
                        </button>

                        <button
                            id="refreshBtn"

                            ↻ 同步

                    </div>

                    <div
                        id="propertyInfo"

                    </div>

                </div>

                <!-- LOG -->

                <div class="card log-panel">

                    </div>

                </div>

            </aside>

        </div>

    </section>

</div>

<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://aeqhrcdlmpqncddridaj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_mpr9262EO73p6B6KHBhc7A_l-TBVzPc";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/*
 * 注意：
 * 這是 publishable key，可以放在前端。
 * 絕對不要把 service_role key 放進 GitHub。
 */


/* =========================================================
   GAME STATE
========================================================= */

let state = {

    room: null,

    game: null,

    players: [],

    board: [],

    events: [],

    me: null,

    realtimeChannel: null,

    lastRolledPosition: null

};


/* =========================================================
   PLAYER TOKEN COLORS
========================================================= */

const TOKEN_COLORS = [
    "#ff4d5e",
    "#4d8dff",
    "#34d58b",
    "#ffc34d",
    "#b56cff",
    "#ff7a3d"
];


/* =========================================================
   BOARD POSITION → CSS GRID
========================================================= */

function positionToGrid(position) {

    /*
     * 40格標準 Monopoly 走法：

     * 0  = 左下 GO
     * 1~10 = 底部 → 右下
     * 11~20 = 右側 → 右上
     * 21~30 = 上方 → 左上
     * 31~39 = 左側 → 左下
     */

    if (position === 0)
        return { row: 11, col: 1 };

    if (position >= 1 && position <= 10)
        return {
            row: 11,
            col: position + 1
        };

    if (position >= 11 && position <= 20)
        return {
            row: 21 - position,
            col: 11
        };

    if (position >= 21 && position <= 30)
        return {
            row: 1,
            col: 31 - position
        };

    return {
        row: position - 29,
        col: 1
    };
}


/* =========================================================
   COLOR GROUP
========================================================= */

function groupColor(group) {

    const colors = {

        brown: "#8d5a35",

        light_blue: "#8dd8f2",

        pink: "#d96ba8",

        orange: "#e98a35",

        red: "#d84444",

        yellow: "#e8c84b",

        green: "#4caf72",

        dark_blue: "#3959bd"

    };

    return colors[group] || "#777";

}


/* =========================================================
   TOAST
========================================================= */

function toast(message, type = "") {

    const container =
        document.getElementById("toastContainer");

    const el =
        document.createElement("div");

    el.className =
        "toast " + type;

    el.textContent = message;

    container.appendChild(el);

    setTimeout(() => {

        el.remove();

    }, 3500);
}


/* =========================================================
   CONNECTION
========================================================= */

function setConnection(status, text) {

    const el =
        document.getElementById("connectionStatus");

    const label =
        document.getElementById("connectionText");

    el.classList.remove(
        "online",
        "error"
    );

    if (status === "online")
        el.classList.add("online");

    if (status === "error")
        el.classList.add("error");

    label.textContent = text;
}


/* =========================================================
   SAVE SESSION
========================================================= */

function saveSession() {

    localStorage.setItem(
        "monopoly_session",
        JSON.stringify({
            roomCode:
                state.room?.room_code || null,

            playerId:
                state.me?.id || null,

            playerName:
                state.me?.name || null
        })
    );
}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom() {

    const name =
        document.getElementById("nameInput")
        .value.trim();

    if (!name) {

        toast("請先輸入你的名字", "error");
        return;

    }

    const roomCode =
        generateRoomCode();

    setLoading(true);

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "create_room",
                {
                    p_room_code: roomCode
                }
            );

        if (error)
            throw error;

        document.getElementById("roomInput")
            .value = roomCode;

        toast(
            "房間建立成功：" + roomCode,
            "success"
        );

        await joinRoom(roomCode, name);

    } catch (error) {

        console.error(error);

        toast(
            "建立房間失敗：" +
            getErrorMessage(error),
            "error"
        );

    } finally {

        setLoading(false);

    }
}


/* =========================================================
   GENERATE ROOM CODE
========================================================= */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 4; i++) {

        result +=
            chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];

    }

    return result;

}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom(
    roomCodeArg = null,
    nameArg = null
) {

    const name =
        nameArg ||
        document.getElementById("nameInput")
            .value.trim();

    const roomCode =
        (
            roomCodeArg ||
            document.getElementById("roomInput")
                .value.trim()
        ).toUpperCase();

    if (!name) {

        toast("請輸入名字", "error");
        return;

    }

    if (!roomCode) {

        toast("請輸入房間代碼", "error");
        return;

    }

    setLoading(true);

    try {

        /*
         * 呼叫：
         * join_room(text,text)
         */

        const { data, error } =
            await supabaseClient.rpc(
                "join_room",
                {
                    p_room_code: roomCode,
                    p_name: name
                }
            );

        if (error)
            throw error;

        if (!data)
            throw new Error("加入房間沒有返回資料");

        /*
         * data:
         * player_id
         * game_id
         * room_id
         * player_number
         * name
         * money
         * position
         */

        state.me = {
            id: data.player_id,
            game_id: data.game_id,
            room_id: data.room_id,
            player_number: data.player_number,
            name: data.name,
            money: data.money,
            position: data.position
        };

        saveSession();

        await loadRoomAndGame();

        showGameScreen();

        await subscribeRealtime();

        await refreshGame();

        toast(
            "成功加入房間 " + roomCode,
            "success"
        );

    } catch (error) {

        console.error(error);

        toast(
            "加入房間失敗：" +
            getErrorMessage(error),
            "error"
        );

    } finally {

        setLoading(false);

    }
}


/* =========================================================
   LOAD ROOM / GAME
========================================================= */

async function loadRoomAndGame() {

    if (!state.me)
        return;

    const { data: room, error: roomError } =
        await supabaseClient
            .from("rooms")
            .select("*")
            .eq("id", state.me.room_id)
            .single();

    if (roomError)
        throw roomError;

    const { data: game, error: gameError } =
        await supabaseClient
            .from("games")
            .select("*")
            .eq("id", state.me.game_id)
            .single();

    if (gameError)
        throw gameError;

    state.room = room;
    state.game = game;

}


/* =========================================================
   REFRESH GAME
========================================================= */

async function refreshGame() {

    if (!state.me)
        return;

    try {

        /*
         * 使用 get_game_state RPC。
         */

        const { data, error } =
            await supabaseClient.rpc(
                "get_game_state",
                {
                    p_game_id: state.me.game_id
                }
            );

        if (error)
            throw error;

        if (!data)
            throw new Error("沒有取得遊戲狀態");

        state.game = data.game;
        state.players = data.players || [];
        state.board = data.board || [];

        /*
         * 找出自己的最新 player row
         */

        state.me =
            state.players.find(
                p => p.id === state.me.id
            ) || state.me;

        renderAll();

    } catch (error) {

        console.error(
            "refreshGame:",
            error
        );

        toast(
            "同步失敗：" +
            getErrorMessage(error),
            "error"
        );

    }

}


/* =========================================================
   REALTIME
========================================================= */

async function subscribeRealtime() {

    if (!state.me)
        return;

    /*
     * 移除舊 channel
     */

    if (state.realtimeChannel) {

        await supabaseClient.removeChannel(
            state.realtimeChannel
        );

        state.realtimeChannel = null;

    }

    const channelName =
        "monopoly-game-" +
        state.me.game_id;

    const channel =
        supabaseClient.channel(
            channelName
        );

    /*
     * games
     */

    channel.on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "games",
            filter:
                "id=eq." +
                state.me.game_id
        },
        async payload => {

            console.log(
                "Realtime games:",
                payload
            );

            await refreshGame();

        }
    );

    /*
     * players
     */

    channel.on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "players",
            filter:
                "game_id=eq." +
                state.me.game_id
        },
        async payload => {

            console.log(
                "Realtime players:",
                payload
            );

            await refreshGame();

        }
    );

    /*
     * events
     */

    channel.on(
        "postgres_changes",
        {
            event: "INSERT",
            schema: "public",
            table: "game_events",
            filter:
                "game_id=eq." +
                state.me.game_id
        },
        async payload => {

            console.log(
                "Realtime event:",
                payload
            );

            addEventToLog(
                payload.new
            );

            await refreshGame();

        }
    );

    state.realtimeChannel =
        channel;

    channel.subscribe(
        status => {

            console.log(
                "Realtime status:",
                status
            );

            if (
                status === "SUBSCRIBED"
            ) {

                setConnection(
                    "online",
                    "Realtime 已連線"
                );

            } else if (
                status === "CHANNEL_ERROR" ||
                status === "TIMED_OUT"
            ) {

                setConnection(
                    "error",
                    "Realtime 連線錯誤"
                );

            } else {

                setConnection(
                    "",
                    "連線中..."
                );

            }

        }
    );

}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    if (!state.me)
        return;

    /*
     * 目前 SQL 的 start_game(uuid)
     * 不限制只有房主可以開始。
     *
     * 所以這裡任何玩家都能按。
     */

    setActionLoading(true);

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "start_game",
                {
                    p_game_id:
                        state.me.game_id
                }
            );

        if (error)
            throw error;

        await refreshGame();

        toast(
            "遊戲開始！",
            "success"
        );

    } catch (error) {

        console.error(error);

        toast(
            "開始遊戲失敗：" +
            getErrorMessage(error),
            "error"
        );

    } finally {

        setActionLoading(false);

    }

}


/* =========================================================
   ROLL DICE
========================================================= */

async function rollDice() {

    if (!state.me || !state.game)
        return;

    /*
     * 最重要的判斷：
     *
     * 不看「我是第一個玩家」。
     * 不看 localStorage。
     * 不看 player_number。
     *
     * 唯一判斷：
     *
     * games.current_player_id === me.id
     *
     * 這樣第二台手機拿到相同 DB 狀態後，
     * 就可以正常成為下一位。
     */

    if (
        state.game.current_player_id !==
        state.me.id
    ) {

        const current =
            getPlayer(
                state.game.current_player_id
            );

        toast(
            "現在輪到 " +
            (current?.name || "其他玩家") +
            "，不是你的回合。",
            "error"
        );

        return;

    }

    if (
        state.game.status !==
        "playing"
    ) {

        toast(
            "遊戲尚未開始。",
            "error"
        );

        return;

    }

    setActionLoading(true);

    try {

        /*
         * Server-side dice:
         *
         * roll_dice(uuid,uuid)
         */

        const { data, error } =
            await supabaseClient.rpc(
                "roll_dice",
                {
                    p_game_id:
                        state.me.game_id,

                    p_player_id:
                        state.me.id
                }
            );

        if (error)
            throw error;

        console.log(
            "ROLL RESULT:",
            data
        );

        if (data) {

            showDice(
                data.dice1,
                data.dice2
            );

            state.lastRolledPosition =
                data.new_position;

            toast(
                "你擲出了 " +
                data.dice1 +
                " + " +
                data.dice2 +
                " = " +
                data.total,
                "success"
            );

            /*
             * 如果落在地產：
             * 顯示購買按鈕。
             */

            if (
                data.space_type ===
                "property"
            ) {

                state.lastRolledPosition =
                    data.new_position;

            }

        }

        /*
         * 等待 DB / Realtime 狀態
         */

        await refreshGame();

    } catch (error) {

        console.error(
            "rollDice:",
            error
        );

        toast(
            "擲骰失敗：" +
            getErrorMessage(error),
            "error"
        );

    } finally {

        setActionLoading(false);

    }

}


/* =========================================================
   BUY PROPERTY
========================================================= */

async function buyProperty() {

    if (!state.me || !state.game)
        return;

    if (
        state.game.current_player_id !==
        state.me.id
    ) {

        toast(
            "現在不是你的回合。",
            "error"
        );

        return;

    }

    setActionLoading(true);

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "buy_property",
                {
                    p_game_id:
                        state.me.game_id,

                    p_player_id:
                        state.me.id
                }
            );

        if (error)
            throw error;

        console.log(
            "BUY RESULT:",
            data
        );

        toast(
            "成功購買 " +
            data.property +
            "！",
            "success"
        );

        await refreshGame();

    } catch (error) {

        console.error(
            "buyProperty:",
            error
        );

        toast(
            "購買失敗：" +
            getErrorMessage(error),
            "error"
        );

    } finally {

        setActionLoading(false);

    }

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

    renderHeader();

    renderPlayers();

    renderBoard();

    renderActions();

}


/* =========================================================
   HEADER
========================================================= */

function renderHeader() {

    document.getElementById(
        "roomCodeDisplay"
    ).textContent =
        state.room?.room_code || "----";

    const current =
        getPlayer(
            state.game?.current_player_id
        );

    document.getElementById(
        "currentPlayerDisplay"
    ).textContent =
        current
            ? "🎲 " + current.name + " 的回合"
            : "等待遊戲開始";

    document.getElementById(
        "turnNumberDisplay"
    ).textContent =
        "回合：" +
        (state.game?.turn_number || 0);

    if (state.game) {

        document.getElementById(
            "die1"
        ).textContent =
            state.game.dice_1 || "—";

        document.getElementById(
            "die2"
        ).textContent =
            state.game.dice_2 || "—";

    }

}


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers() {

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML = "";

    const players =
        [...state.players]
            .sort(
                (a,b) =>
                    a.player_number -
                    b.player_number
            );

    players.forEach(player => {

        const el =
            document.createElement("div");

        const isMe =
            player.id === state.me?.id;

        const isCurrent =
            player.id ===
            state.game?.current_player_id;

        el.className =
            "player" +
            (isCurrent
                ? " active"
                : "") +
            (isMe
                ? " me"
                : "");

        const color =
            TOKEN_COLORS[
                (player.player_number - 1) %
                TOKEN_COLORS.length
            ];

        el.innerHTML = `

            <div
                class="player-token"
                style="background:${color}">
            </div>

            <div>

                <div class="player-name">
                    ${escapeHtml(player.name)}
                    ${isMe ? "（你）" : ""}
                </div>

                <div class="player-meta">
                    玩家 ${player.player_number}
                    · 位置 ${player.position}
                    ${player.is_in_jail
                        ? " · 🚔 監獄"
                        : ""}
                </div>

            </div>

            <div class="player-money">
                £${Number(player.money).toLocaleString()}
            </div>
        `;

        list.appendChild(el);

    });

}


/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard() {

    const board =
        document.getElementById("board");

    /*
     * 保留中央區域
     */

    board.innerHTML = `

        <div class="board-center">
            <div class="board-title">
                UK<br>MONOPOLY
            </div>
        </div>

    `;

    /*
     * 如果 board 還沒載入
     */

    if (
        !state.board ||
        state.board.length === 0
    )
        return;

    state.board.forEach(space => {

        const grid =
            positionToGrid(
                space.position
            );

        const el =
            document.createElement("div");

        el.className =
            "space";

        el.style.gridRow =
            grid.row;

        el.style.gridColumn =
            grid.col;

        const color =
            groupColor(
                space.color_group
            );

        const owner =
            getPropertyOwner(
                space.position
            );

        let priceText = "";

        if (
            space.price &&
            Number(space.price) > 0
        ) {

            priceText =
                "£" +
                Number(
                    space.price
                ).toLocaleString();

        }

        el.innerHTML = `

            ${
                space.color_group
                ? `
                    <div
                        class="space-color"
                        style="background:${color}">
                    </div>
                  `
                : `
                    <div
                        class="space-color"
                        style="background:#aaa">
                    </div>
                  `
            }

            <div class="space-name">
                ${escapeHtml(space.name)}
            </div>

            ${
                priceText
                ? `
                    <div class="space-price">
                        ${priceText}
                    </div>
                  `
                : ""
            }

            ${
                owner
                ? `
                    <div
                        class="owner-mark"
                        title="Owner: ${escapeHtml(owner.name)}"
                        style="background:
                            ${tokenColor(owner.player_number)}">
                    </div>
                  `
                : ""
            }

            <div
                class="space-tokens"
                id="tokens-${space.position}">
            </div>
        `;

        board.appendChild(el);

    });

    /*
     * 加入玩家棋子
     */

    state.players.forEach(player => {

        const tokenContainer =
            document.getElementById(
                "tokens-" +
                player.position
            );

        if (!tokenContainer)
            return;

        const token =
            document.createElement("div");

        token.className =
            "token";

        token.style.background =
            tokenColor(
                player.player_number
            );

        token.title =
            player.name;

        tokenContainer.appendChild(
            token
        );

    });

}


/* =========================================================
   RENDER ACTIONS
========================================================= */

function renderActions() {

    const rollBtn =
        document.getElementById(
            "rollBtn"
        );

    const buyBtn =
        document.getElementById(
            "buyBtn"
        );

    const startBtn =
        document.getElementById(
            "startGameBtn"
        );

    const message =
        document.getElementById(
            "actionMessage"
        );

    if (!state.game) {

        rollBtn.disabled = true;
        buyBtn.disabled = true;

        return;

    }

    const current =
        getPlayer(
            state.game.current_player_id
        );

    const isMyTurn =
        state.game.current_player_id ===
        state.me?.id;

    const isPlaying =
        state.game.status ===
        "playing";

    /*
     * 開始遊戲
     */

    startBtn.disabled =
        isPlaying;

    /*
     * 擲骰
     */

    rollBtn.disabled =
        !isMyTurn ||
        !isPlaying;

    /*
     * 購買
     */

    const landed =
        state.players.find(
            p =>
                p.id === state.me?.id
        )?.position;

    const landedSpace =
        state.board.find(
            b =>
                b.position === landed
        );

    const canBuy =
        isMyTurn &&
        isPlaying &&
        landedSpace &&
        landedSpace.type === "property" &&
        Number(landedSpace.price) > 0 &&
        !getPropertyOwner(
            landedSpace.position
        ) &&
        Number(
            state.me?.money || 0
        ) >= Number(
            landedSpace.price
        );

    buyBtn.disabled =
        !canBuy;

    /*
     * Message
     */

    if (
        state.game.status ===
        "waiting"
    ) {

        message.textContent =
            "遊戲尚未開始。按「開始遊戲」後即可進行。";

    } else if (isMyTurn) {

        message.textContent =
            "現在輪到你。擲骰子吧！";

    } else {

        message.textContent =
            "現在輪到 " +
            (current?.name || "其他玩家") +
            "。請等待對方完成回合。";

    }

    /*
     * Property information
     */

    renderPropertyInfo(
        landedSpace
    );

}


/* =========================================================
   PROPERTY INFO
========================================================= */

function renderPropertyInfo(space) {

    const box =
        document.getElementById(
            "propertyInfo"
        );

    if (!space) {

        box.classList.add(
            "hidden"
        );

        return;

    }

    box.classList.remove(
        "hidden"
    );

    const owner =
        getPropertyOwner(
            space.position
        );

    let html = `
        <strong>
            ${escapeHtml(space.name)}
        </strong>
        <br>
        類型：${escapeHtml(space.type)}
    `;

    if (
        Number(space.price) > 0
    ) {

        html += `
            <br>
            價格：£${Number(
                space.price
            ).toLocaleString()}
        `;

    }

    if (owner) {

        html += `
            <br>
            所有者：
            <strong>
                ${escapeHtml(owner.name)}
            </strong>
        `;

    } else if (
        space.type === "property"
    ) {

        html += `
            <br>
            <strong>
                尚未有人購買
            </strong>
        `;

    }

    box.innerHTML = html;

}


/* =========================================================
   GET PLAYER
========================================================= */

function getPlayer(id) {

    return state.players.find(
        p => p.id === id
    );

}


/* =========================================================
   PROPERTY OWNER
========================================================= */

function getPropertyOwner(position) {

    /*
     * 目前 SQL 沒有 properties 表。
     *
     * 所有權是從：
     *
     * game_events.event_type =
     * property_purchase
     *
     * 推算。
     */

    const purchases =
        state.events
            .filter(
                e =>
                    e.event_type ===
                    "property_purchase"
            )
            .slice()
            .reverse();

    const purchase =
        purchases.find(
            e =>
                Number(
                    e.data?.position
                ) === Number(position)
        );

    if (!purchase)
        return null;

    return getPlayer(
        purchase.player_id
    );

}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents() {

    if (!state.me)
        return;

    const { data, error } =
        await supabaseClient
            .from("game_events")
            .select("*")
            .eq(
                "game_id",
                state.me.game_id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(100);

    if (error) {

        console.error(
            "loadEvents:",
            error
        );

        return;

    }

    state.events =
        (data || []).reverse();

    renderEventLog();

}


/* =========================================================
   ADD EVENT
========================================================= */

function addEventToLog(event) {

    if (!event)
        return;

    /*
     * 避免重複
     */

    const exists =
        state.events.some(
            e => e.id === event.id
        );

    if (exists)
        return;

    state.events.push(event);

    if (state.events.length > 100)
        state.events.shift();

    renderEventLog();

}


/* =========================================================
   EVENT LOG
========================================================= */

function renderEventLog() {

    const box =
        document.getElementById(
            "eventLog"
        );

    box.innerHTML = "";

    state.events
        .slice()
        .reverse()
        .forEach(event => {

            const el =
                document.createElement("div");

            el.className =
                "log-item";

            const time =
                new Date(
                    event.created_at
                );

            const timeText =
                time.toLocaleTimeString(
                    "zh-TW",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            el.innerHTML = `
                <span class="small">
                    ${timeText}
                </span>
                <br>
                ${escapeHtml(
                    event.message ||
                    event.event_type
                )}
            `;

            box.appendChild(el);

        });

}


/* =========================================================
   SHOW DICE
========================================================= */

function showDice(d1, d2) {

    document.getElementById(
        "die1"
    ).textContent =
        d1 || "—";

    document.getElementById(
        "die2"
    ).textContent =
        d2 || "—";

}


/* =========================================================
   TOKEN COLOR
========================================================= */

function tokenColor(playerNumber) {

    return TOKEN_COLORS[
        (Number(playerNumber) - 1) %
        TOKEN_COLORS.length
    ];

}


/* =========================================================
   SHOW GAME SCREEN
========================================================= */

function showGameScreen() {

    document.getElementById(
        "lobbyScreen"
    ).classList.add("hidden");

    document.getElementById(
        "gameScreen"
    ).classList.remove("hidden");

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(isLoading) {

    document.body.classList.toggle(
        "loading",
        isLoading
    );

}


/* =========================================================
   ACTION LOADING
========================================================= */

function setActionLoading(isLoading) {

    document.getElementById(
        "rollBtn"
    ).disabled =
        isLoading;

    document.getElementById(
        "buyBtn"
    ).disabled =
        isLoading;

}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function getErrorMessage(error) {

    if (!error)
        return "未知錯誤";

    return (
        error.message ||
        error.details ||
        error.hint ||
        String(error)
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession() {

    /*
     * 這裡不直接相信 localStorage 的 player ID。
     * 只是用來填入房間資訊。
     *
     * 真正狀態仍然重新從 Supabase 取得。
     */

    const raw =
        localStorage.getItem(
            "monopoly_session"
        );

    if (!raw)
        return;

    try {

        const session =
            JSON.parse(raw);

        if (
            session.roomCode
        ) {

            document.getElementById(
                "roomInput"
            ).value =
                session.roomCode;

        }

        if (
            session.playerName
        ) {

            document.getElementById(
                "nameInput"
            ).value =
                session.playerName;

        }

    } catch (e) {

        console.error(e);

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

async function initialize() {

    setConnection(
        "",
        "連線中..."
    );

    try {

        /*
         * 測試 Supabase 是否可以正常存取。
         */

        const { error } =
            await supabaseClient
                .from("board_spaces")
                .select("position")
                .limit(1);

        if (error)
            throw error;

        setConnection(
            "online",
            "Supabase 已連線"
        );

    } catch (error) {

        console.error(error);

        setConnection(
            "error",
            "Supabase 連線失敗"
        );

    }

    await restoreSession();

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

document.getElementById(
    "createRoomBtn"
).addEventListener(
    "click",
    createRoom
);

document.getElementById(
    "joinRoomBtn"
).addEventListener(
    "click",
    () => joinRoom()
);

document.getElementById(
    "startGameBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "rollBtn"
).addEventListener(
    "click",
    rollDice
);

document.getElementById(
    "buyBtn"
).addEventListener(
    "click",
    buyProperty
);

document.getElementById(
    "refreshBtn"
).addEventListener(
    "click",
    async () => {

        await refreshGame();
        await loadEvents();

        toast(
            "已同步最新遊戲狀態",
            "success"
        );

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

document.getElementById(
    "roomInput"
).addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        )
            joinRoom();

    }
);

document.getElementById(
    "nameInput"
).addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        )
            joinRoom();

    }
);


/* =========================================================
   START
========================================================= */

initialize();

</script>
