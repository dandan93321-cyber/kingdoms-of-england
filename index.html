<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>UK Monopoly - Supabase</title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #07111f;
            --panel: #0d1b2d;
            --panel2: #12243a;
            --border: rgba(255,255,255,.12);
            --text: #f5f7fa;
            --muted: #9eacbd;
            --green: #28d17c;
            --red: #ff5d6c;
            --yellow: #ffd166;
            --blue: #4ea8ff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #17304c 0%, #07111f 50%, #040a12 100%);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;

            height: 64px;
            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 12, 22, .92);
            backdrop-filter: blur(16px);

            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-weight: 800;
            font-size: 18px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;

            border-radius: 10px;
            background: linear-gradient(135deg, #28d17c, #168d55);
            color: #03130b;
            font-weight: 900;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);
            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #777;
        }

        .dot.online {
            background: var(--green);
            box-shadow: 0 0 12px rgba(40,209,124,.8);
        }

        .dot.error {
            background: var(--red);
        }

        /* =========================
           SETUP SCREEN
        ========================= */

        .setup-screen {
            min-height: calc(100vh - 64px);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .setup-card {
            width: min(520px, 100%);
            padding: 28px;

            background: rgba(13,27,45,.94);
            border: 1px solid var(--border);
            border-radius: 24px;

            box-shadow: 0 25px 80px rgba(0,0,0,.35);
        }

        .setup-card h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .setup-card > p {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.6;
        }

        .config-warning {
            margin-bottom: 18px;
            padding: 12px 14px;

            border: 1px solid rgba(255,209,102,.3);
            border-radius: 12px;

            background: rgba(255,209,102,.08);
            color: #ffe7a6;

            font-size: 13px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;

            color: var(--muted);
            font-size: 13px;
        }

        .field input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 12px;

            outline: none;

            color: white;
            background: rgba(255,255,255,.06);
        }

        .field input:focus {
            border-color: rgba(40,209,124,.7);
            box-shadow: 0 0 0 3px rgba(40,209,124,.08);
        }

        .setup-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;

            margin-top: 18px;
        }

        .btn {
            min-height: 46px;
            padding: 0 16px;

            border: 0;
            border-radius: 12px;

            font-weight: 800;

            transition:
                transform .15s ease,
                opacity .15s ease,
                background .15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            color: #03130b;
            background: var(--green);
        }

        .btn-secondary {
            color: white;
            background: rgba(255,255,255,.09);
            border: 1px solid var(--border);
        }

        .btn-danger {
            color: white;
            background: var(--red);
        }

        .message {
            min-height: 22px;
            margin-top: 14px;

            color: var(--yellow);
            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           GAME
        ========================= */

        .game-screen {
            padding: 18px;
        }

        .game-layout {
            width: min(1500px, 100%);
            margin: 0 auto;

            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 18px;
        }

        .main-panel,
        .side-panel {
            background: rgba(13,27,45,.88);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .main-panel {
            padding: 16px;
        }

        .side-panel {
            padding: 16px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* =========================
           ROOM INFO
        ========================= */

        .room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            margin-bottom: 14px;
        }

        .room-code {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .room-code span {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .room-code strong {
            font-size: 20px;
            letter-spacing: .08em;
        }

        .status-badge {
            padding: 7px 11px;
            border-radius: 999px;

            font-size: 12px;
            font-weight: 800;

            background: rgba(255,255,255,.08);
        }

        .status-playing {
            color: var(--green);
            background: rgba(40,209,124,.1);
        }

        .status-waiting {
            color: var(--yellow);
            background: rgba(255,209,102,.1);
        }

        .status-finished {
            color: var(--red);
            background: rgba(255,93,108,.1);
        }

        /* =========================
           BOARD
        ========================= */

        .board-wrap {
            width: 100%;
            overflow: auto;
            padding-bottom: 5px;
        }

        .board {
            width: min(900px, 100%);
            aspect-ratio: 1 / 1;
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);

            gap: 2px;

            padding: 4px;

            background: #0a1422;
            border: 2px solid rgba(255,255,255,.12);
            border-radius: 14px;
        }

        .space {
            position: relative;

            min-width: 0;
            min-height: 0;

            overflow: hidden;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 4px;

            border-radius: 5px;
            border: 1px solid rgba(255,255,255,.09);

            background: rgba(255,255,255,.045);

            font-size: clamp(7px, 1vw, 11px);
        }

        .space.center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at center, rgba(40,209,124,.12), transparent 55%),
                rgba(255,255,255,.025);

            border: 1px solid rgba(255,255,255,.08);
        }

        .center-content {
            text-align: center;
            padding: 20px;
        }

        .center-title {
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 900;
            letter-spacing: .08em;
        }

        .center-subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: clamp(10px, 1.3vw, 14px);
        }

        .space-color {
            height: 7px;
            margin: -4px -4px 3px;

            background: transparent;
        }

        .space-name {
            overflow: hidden;

            font-weight: 700;
            line-height: 1.15;

            text-align: center;
            word-break: break-word;
        }

        .space-price {
            text-align: center;
            color: var(--muted);
            font-size: .85em;
        }

        .space-tokens {
            min-height: 16px;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2px;
        }

        .token {
            width: 15px;
            height: 15px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: #07111f;
            background: white;

            border: 2px solid #07111f;

            font-size: 8px;
            font-weight: 900;

            box-shadow: 0 1px 5px rgba(0,0,0,.5);
        }

        .token-1 { background: #ff6b6b; }
        .token-2 { background: #4dabf7; }
        .token-3 { background: #ffd43b; }
        .token-4 { background: #69db7c; }

        .owned {
            outline: 2px solid rgba(40,209,124,.65);
            outline-offset: -2px;
        }

        .current-space {
            box-shadow:
                inset 0 0 0 2px rgba(255,209,102,.9),
                0 0 12px rgba(255,209,102,.15);
        }

        /* =========================
           SIDE PANEL
        ========================= */

        .section {
            padding: 14px;

            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .section-title {
            margin-bottom: 10px;

            font-size: 13px;
            font-weight: 900;

            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .dice-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;

            margin-bottom: 10px;
        }

        .dice {
            min-height: 70px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background: rgba(255,255,255,.07);
            border: 1px solid var(--border);

            font-size: 32px;
            font-weight: 900;
        }

        .turn-info {
            margin-bottom: 10px;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .turn-info strong {
            color: white;
        }

        .action-buttons {
            display: grid;
            gap: 8px;
        }

        /* =========================
           PLAYERS
        ========================= */

        .players-list {
            display: grid;
            gap: 8px;
        }

        .player-row {
            display: grid;
            grid-template-columns: 30px 1fr auto;
            align-items: center;
            gap: 8px;

            padding: 9px;

            border-radius: 10px;

            background: rgba(255,255,255,.04);
            border: 1px solid transparent;
        }

        .player-row.active {
            border-color: rgba(40,209,124,.5);
            background: rgba(40,209,124,.07);
        }

        .player-row.me {
            box-shadow: inset 3px 0 0 var(--blue);
        }

        .player-number {
            width: 26px;
            height: 26px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            font-size: 11px;
            font-weight: 900;

            background: rgba(255,255,255,.1);
        }

        .player-name {
            font-weight: 800;
            font-size: 14px;
        }

        .player-meta {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .player-money {
            font-weight: 900;
            color: var(--green);
            font-size: 13px;
        }

        /* =========================
           EVENTS
        ========================= */

        .events {
            max-height: 240px;
            overflow: auto;

            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .event {
            padding: 8px 10px;

            border-radius: 9px;

            background: rgba(255,255,255,.04);

            font-size: 12px;
            line-height: 1.4;
        }

        .event-time {
            margin-top: 3px;
            color: #74859a;
            font-size: 10px;
        }

        /* =========================
           MODAL / TOAST
        ========================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 100;

            width: min(480px, calc(100% - 30px));

            padding: 13px 16px;

            transform: translateX(-50%);

            border-radius: 13px;

            background: rgba(10,20,34,.96);
            border: 1px solid var(--border);

            box-shadow: 0 15px 50px rgba(0,0,0,.4);

            font-size: 14px;
            line-height: 1.5;
        }

        .toast.success {
            border-color: rgba(40,209,124,.4);
        }

        .toast.error {
            border-color: rgba(255,93,108,.5);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {
            .game-layout {
                grid-template-columns: 1fr;
            }

            .side-panel {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }

            .side-wide {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 650px) {
            .topbar {
                padding: 0 12px;
            }

            .brand {
                font-size: 15px;
            }

            .game-screen {
                padding: 9px;
            }

            .main-panel,
            .side-panel {
                border-radius: 15px;
                padding: 10px;
            }

            .side-panel {
                display: flex;
            }

            .setup-card {
                padding: 22px;
            }

            .setup-buttons {
                grid-template-columns: 1fr;
            }

            .room-header {
                align-items: flex-start;
            }

            .board {
                min-width: 560px;
            }

            .board-wrap {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">M</div>
        <div>UK MONOPOLY</div>
    </div>

    <div class="connection">
        <span id="connectionDot" class="dot"></span>
        <span id="connectionText">未連線</span>
    </div>
</header>

<!-- =========================
     SETUP
========================= -->

<section id="setupScreen" class="setup-screen">

    <div class="setup-card">

        <h1>UK Monopoly</h1>

        <p>
            Supabase 多人即時版。<br>
            建立或加入房間後，遊戲狀態會由 Supabase 控制。
        </p>

        <div class="config-warning" id="configWarning">
            請先在 HTML 最下面填入你的 Supabase URL 與 Anon Key。
        </div>

        <div class="field">
            <label for="playerName">玩家名稱</label>
            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="例如：Player 1"
            />
        </div>

        <div class="field">
            <label for="roomCode">房間代碼</label>
            <input
                id="roomCode"
                type="text"
                maxlength="20"
                placeholder="例如：LONDON01"
                autocomplete="off"
            />
        </div>

        <div class="setup-buttons">

            <button
                id="createRoomBtn"
                class="btn btn-primary"
                onclick="createRoomAndJoin()"
            >
                建立房間
            </button>

            <button
                id="joinRoomBtn"
                class="btn btn-secondary"
                onclick="joinRoom()"
            >
                加入房間
            </button>

        </div>

        <div id="setupMessage" class="message"></div>

    </div>

</section>

<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="game-screen hidden">

    <div class="game-layout">

        <!-- BOARD -->

        <main class="main-panel">

            <div class="room-header">

                <div class="room-code">
                    <span>Room</span>
                    <strong id="roomCodeDisplay">---</strong>
                </div>

                <div id="gameStatus" class="status-badge status-waiting">
                    WAITING
                </div>

            </div>

            <div class="board-wrap">
                <div id="board" class="board">
                    <!-- JS 產生 -->
                </div>
            </div>

        </main>

        <!-- SIDE -->

        <aside class="side-panel">

            <!-- GAME CONTROL -->

            <div class="section side-wide">

                <div class="section-title">
                    遊戲控制
                </div>

                <div class="dice-area">

                    <div id="dice1" class="dice">
                        —
                    </div>

                    <div id="dice2" class="dice">
                        —
                    </div>

                </div>

                <div id="turnInfo" class="turn-info">
                    等待遊戲開始……
                </div>

                <div class="action-buttons">

                    <button
                        id="startGameBtn"
                        class="btn btn-secondary"
                        onclick="startGame()"
                    >
                        開始遊戲
                    </button>

                    <button
                        id="rollDiceBtn"
                        class="btn btn-primary"
                        onclick="rollDice()"
                        disabled
                    >
                        🎲 擲骰子
                    </button>

                    <button
                        id="buyPropertyBtn"
                        class="btn btn-secondary"
                        onclick="buyProperty()"
                        disabled
                    >
                        🏠 購買地產
                    </button>

                </div>

            </div>

            <!-- MY INFO -->

            <div class="section">

                <div class="section-title">
                    我的狀態
                </div>

                <div id="myInfo">
                    尚未加入遊戲
                </div>

            </div>

            <!-- PLAYERS -->

            <div class="section side-wide">

                <div class="section-title">
                    玩家
                </div>

                <div id="playersList" class="players-list">
                    -
                </div>

            </div>

            <!-- EVENTS -->

            <div class="section side-wide">

                <div class="section-title">
                    遊戲事件
                </div>

                <div id="events" class="events">
                    -
                </div>

            </div>

        </aside>

    </div>

</section>

<!-- TOAST -->

<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   SUPABASE CONFIG
   =========================================================

   把下面兩個值換成你的 Supabase Project Settings
   → Data API / API Keys 裡面的：

   Project URL
   Publishable / Anon key

   不要放 service_role key。
========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

let supabaseClient = null;

if (
    SUPABASE_URL &&
    SUPABASE_ANON_KEY &&
    !SUPABASE_URL.includes("YOUR_") &&
    !SUPABASE_ANON_KEY.includes("YOUR_")
) {
    supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    document.getElementById("configWarning").classList.add("hidden");
}


/* =========================================================
   LOCAL GAME DATA
========================================================= */

let gameState = null;

let currentRoomId = localStorage.getItem("monopoly_room_id");
let currentGameId = localStorage.getItem("monopoly_game_id");
let currentPlayerId = localStorage.getItem("monopoly_player_id");
let currentRoomCode = localStorage.getItem("monopoly_room_code");
let currentPlayerName = localStorage.getItem("monopoly_player_name");

let realtimeChannel = null;


/* =========================================================
   BOARD POSITION MAP
========================================================= */

const boardCoordinates = {};

/*
    11 x 11 board

    順序：
    0 右下
    1 往左
    ...
    10 左下
    11 往上
    ...
    20 左上
    21 往右
    ...
    30 右上
    31 往下
    ...
    39 右下
*/

function buildBoardCoordinates() {

    let position = 0;

    // Bottom: 0 -> 10
    for (let col = 10; col >= 0; col--) {
        boardCoordinates[position++] = {
            row: 10,
            col
        };
    }

    // Left: 11 -> 20
    for (let row = 9; row >= 0; row--) {
        boardCoordinates[position++] = {
            row,
            col: 0
        };
    }

    // Top: 21 -> 30
    for (let col = 1; col <= 10; col++) {
        boardCoordinates[position++] = {
            row: 0,
            col
        };
    }

    // Right: 31 -> 39
    for (let row = 1; row <= 9; row++) {
        boardCoordinates[position++] = {
            row,
            col: 10
        };
    }
}


/* =========================================================
   INIT BOARD
========================================================= */

function renderBoard() {

    const board = document.getElementById("board");

    board.innerHTML = "";

    buildBoardCoordinates();

    const spaces = gameState?.board || [];

    spaces.forEach(space => {

        const coord = boardCoordinates[space.position];

        if (!coord) {
            return;
        }

        const el = document.createElement("div");

        el.className = "space";

        el.style.gridRow = coord.row + 1;
        el.style.gridColumn = coord.col + 1;

        el.dataset.position = space.position;

        if (space.color_group) {
            const color = getGroupColor(space.color_group);

            el.innerHTML = `
                <div
                    class="space-color"
                    style="background:${color};"
                ></div>

                <div class="space-name">
                    ${escapeHtml(space.name)}
                </div>

                <div class="space-price">
                    ${space.price ? "£" + space.price : ""}
                </div>

                <div
                    class="space-tokens"
                    id="tokens-${space.position}"
                ></div>
            `;
        } else {

            el.innerHTML = `
                <div class="space-color"></div>

                <div class="space-name">
                    ${escapeHtml(space.name)}
                </div>

                <div class="space-price">
                    ${getSpaceTypeText(space.type)}
                </div>

                <div
                    class="space-tokens"
                    id="tokens-${space.position}"
                ></div>
            `;
        }

        board.appendChild(el);
    });


    // Center
    const center = document.createElement("div");

    center.className = "space center";

    center.innerHTML = `
        <div class="center-content">
            <div class="center-title">
                MONOPOLY
            </div>

            <div class="center-subtitle">
                UK EDITION
            </div>

            <div style="margin-top:16px;color:#71839a;font-size:12px;">
                Supabase Realtime
            </div>
        </div>
    `;

    board.appendChild(center);

    renderTokens();
}


/* =========================================================
   BOARD HELPERS
========================================================= */

function getGroupColor(group) {

    const colors = {
        brown: "#8d5524",
        light_blue: "#74c0fc",
        pink: "#f783ac",
        orange: "#ff922b",
        red: "#ff6b6b",
        yellow: "#ffd43b",
        green: "#69db7c",
        dark_blue: "#4dabf7"
    };

    return colors[group] || "#888";
}

/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoomAndJoin() {

    if (!validateSupabase()) {
        return;
    }

    const {
        name,
        room
    } = getInputValues();

    if (!validateName(name) || !validateRoom(room)) {
        return;
    }

    setSetupLoading(true);

    try {

        showSetupMessage(
            "正在建立房間……"
        );

        const {
            data,
            error
        } = await supabaseClient.rpc(
            "create_room",
            {
                p_room_code: room
            }
        );

        if (error) {
            throw error;
        }

        /*
            create_room 回傳：

            room_id
            game_id
            room_code
        */

        currentRoomId = data.room_id;
        currentGameId = data.game_id;
        currentRoomCode = data.room_code;

        /*
            建立房間後直接加入
        */

        const {
            data: playerData,
            error: joinError
        } = await supabaseClient.rpc(
            "join_room",
            {
                p_room_code: currentRoomCode,
                p_name: name
            }
        );

        if (joinError) {
            throw joinError;
        }

        savePlayerSession(
            playerData,
            name
        );

        showGameScreen();

        await loadGameState();

        subscribeRealtime();

        toast(
            "房間建立成功！",
            "success"
        );

    } catch (error) {

        console.error(error);

        showSetupMessage(
            getErrorMessage(error),
            true
        );

    } finally {

        setSetupLoading(false);
    }
}

/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime() {

    if (
        !supabaseClient ||
        !currentGameId
    ) {
        return;
    }

    /*
        移除舊 channel
    */

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "monopoly-game-" +
                currentGameId +
                "-" +
                Date.now()
            )

            /*
                GAME
            */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "games",
                    filter:
                        "id=eq." +
                        currentGameId
                },
                async payload => {

                    console.log(
                        "games realtime:",
                        payload
                    );

                    await loadGameState();
                }
            )

            /*
                PLAYERS
            */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players",
                    filter:
                        "game_id=eq." +
                        currentGameId
                },
                async payload => {

                    console.log(
                        "players realtime:",
                        payload
                    );

                    await loadGameState();
                }
            )

            /*
                GAME EVENTS
            */

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "game_events",
                    filter:
                        "game_id=eq." +
                        currentGameId
                },
                async payload => {

                    console.log(
                        "event realtime:",
                        payload
                    );

                    await renderEvents();

                    await loadGameState();
                }
            )

            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                    if (
                        status === "SUBSCRIBED"
                    ) {

                        setConnection(
                            true,
                            "Realtime 已連線"
                        );

                    } else if (
                        status === "CHANNEL_ERROR"
                    ) {

                        setConnection(
                            false,
                            "Realtime 錯誤"
                        );
                    }
                }
            );
}

/* =========================================================
   ERROR
========================================================= */

function getErrorMessage(error) {

    if (!error) {
        return "發生未知錯誤";
    }

    let message =
        error.message ||
        error.error_description ||
        String(error);

    /*
        常見 Supabase / PostgreSQL 錯誤
    */

    if (
        message.includes(
            "找不到房間"
        )
    ) {
        return "找不到這個房間，請確認房間代碼。";
    }

    if (
        message.includes(
            "房間已滿"
        )
    ) {
        return "房間已滿。";
    }

    if (
        message.includes(
            "現在不是你的回合"
        )
    ) {
        return "現在不是你的回合。";
    }

    if (
        message.includes(
            "遊戲尚未開始"
        )
    ) {
        return "遊戲尚未開始。";
    }

    if (
        message.includes(
            "玩家不存在"
        )
    ) {
        return "找不到玩家資料，請重新加入房間。";
    }

    if (
        message.includes(
            "金錢不足"
        )
    ) {
        return "金錢不足，無法購買。";
    }

    if (
        message.includes(
            "這個地產已經有人購買"
        )
    ) {
        return "這個地產已經有人購買。";
    }

    return message;
}


/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatTime(
    timestamp
) {

    if (!timestamp) {
        return "";
    }

    const date =
        new Date(timestamp);

    return date.toLocaleTimeString(
        "zh-TW",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );
}

            .select("id")
            .eq(
                "id",
                currentPlayerId
            )
            .eq(
                "game_id",
                currentGameId
            )
            .maybeSingle();

        if (error) {
            throw error;
        }

        if (!data) {

            clearSession();

            return;
        }

        document.getElementById(
            "playerName"
        ).value =
            currentPlayerName || "";

        document.getElementById(
            "roomCode"
        ).value =
            currentRoomCode || "";

        showGameScreen();

        await loadGameState();

        subscribeRealtime();

        await renderEvents();

    } catch (error) {

        console.error(
            "restore session:",
            error
        );

        clearSession();
    }
}


function clearSession() {

    localStorage.removeItem(
        "monopoly_player_id"
    );

    localStorage.removeItem(
        "monopoly_game_id"
    );

    localStorage.removeItem(
        "monopoly_room_id"
    );

    localStorage.removeItem(
        "monopoly_room_code"
    );

    localStorage.removeItem(
        "monopoly_player_name"
    );

    currentPlayerId = null;
    currentGameId = null;
    currentRoomId = null;
    currentRoomCode = null;
    currentPlayerName = null;
}

    }

    setConnection(
