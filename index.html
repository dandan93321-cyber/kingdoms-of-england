<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#07111f">

    <title>MONOPOLY UK</title>

    <!-- =====================================================
         CSS 模組
         ===================================================== -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- =====================================================
         Supabase
         ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- =========================================================
     APP
     ========================================================= -->

<div id="app">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                M
            </div>

            <div class="brand-text">
                <div class="brand-title">
                    MONOPOLY UK
                </div>

                <div class="brand-subtitle">
                    Supabase Multiplayer Edition
                </div>
            </div>

        </div>

        <div id="connectionStatus" class="connection-status offline">
            <span class="status-dot"></span>
            <span id="connectionText">
                Supabase 連線中...
            </span>
        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main-container">

        <!-- =================================================
             SCREEN 1
             大廳 / 建立或加入房間
             ================================================= -->

        <section
            id="lobbyScreen"
            class="screen active"
        >

            <div class="lobby-card">

                <div class="lobby-icon">
                    🎲
                </div>

                <h1>
                    MONOPOLY UK
                </h1>

                <p class="lobby-description">
                    Supabase 多人即時版
                </p>

                <p class="lobby-description">
                    每位玩家使用自己的手機或瀏覽器加入同一個房間。
                    <br>
                    遊戲狀態由 Supabase 控制並即時同步。
                </p>


                <!-- =========================================
                     系統提示
                     ========================================= -->

                <div
                    id="lobbyMessage"
                    class="message-box"
                    hidden
                >
                </div>


                <!-- =========================================
                     玩家名稱
                     ========================================= -->

                <div class="form-group">

                    <label for="playerName">
                        玩家名稱
                    </label>

                    <input
                        id="playerName"
                        type="text"
                        maxlength="20"
                        autocomplete="off"
                        placeholder="輸入你的名字"
                    >

                </div>


                <!-- =========================================
                     房間代碼
                     ========================================= -->

                <div class="form-group">

                    <label for="roomCode">
                        房間代碼
                    </label>

                    <input
                        id="roomCode"
                        type="text"
                        maxlength="12"
                        autocomplete="off"
                        autocapitalize="characters"
                        placeholder="例如 ABC123"
                    >

                </div>


                <!-- =========================================
                     房間操作
                     ========================================= -->

                <div class="button-row">

                    <button
                        id="createRoomBtn"
                        class="btn btn-primary"
                        type="button"
                    >
                        建立房間
                    </button>

                    <button
                        id="joinRoomBtn"
                        class="btn btn-secondary"
                        type="button"
                    >
                        加入房間
                    </button>

                </div>


                <!-- =========================================
                     Loading
                     ========================================= -->

                <div
                    id="lobbyLoading"
                    class="loading"
                    hidden
                >
                    <div class="spinner"></div>
                    <span>處理中...</span>
                </div>

            </div>

        </section>


        <!-- =================================================
             SCREEN 2
             等待玩家
             ================================================= -->

        <section
            id="waitingScreen"
            class="screen"
        >

            <div class="waiting-card">

                <div class="waiting-icon">
                    👥
                </div>

                <h2>
                    等待其他玩家
                </h2>

                <p>
                    房間代碼
                </p>

                <div
                    id="waitingRoomCode"
                    class="room-code"
                >
                    ------
                </div>


                <button
                    id="copyRoomCodeBtn"
                    class="btn btn-secondary"
                    type="button"
                >
                    複製房間代碼
                </button>


                <div class="player-list-container">

                    <h3>
                        玩家
                    </h3>

                    <div
                        id="waitingPlayerList"
                        class="player-list"
                    >
                    </div>

                </div>


                <div
                    id="waitingStatus"
                    class="waiting-status"
                >
                    等待玩家加入...
                </div>


                <button
                    id="startGameBtn"
                    class="btn btn-primary"
                    type="button"
                    hidden
                >
                    開始遊戲
                </button>


                <button
                    id="leaveRoomBtn"
                    class="btn btn-danger-outline"
                    type="button"
                >
                    離開房間
                </button>

            </div>

        </section>


        <!-- =================================================
             SCREEN 3
             遊戲
             ================================================= -->

        <section
            id="gameScreen"
            class="screen"
        >

            <!-- =============================================
                 GAME HEADER
                 ============================================= -->

            <div class="game-header">

                <div>

                    <div class="game-room">
                        房間：
                        <span id="gameRoomCode">
                            ------
                        </span>
                    </div>

                    <div class="turn-info">
                        第
                        <span id="turnNumber">
                            0
                        </span>
                        回合
                    </div>

                </div>


                <div
                    id="currentTurnBadge"
                    class="turn-badge"
                >
                    等待遊戲開始
                </div>

            </div>


            <!-- =============================================
                 PLAYER BAR
                 ============================================= -->

            <div
                id="playerBar"
                class="player-bar"
            >
            </div>


            <!-- =============================================
                 BOARD
                 ============================================= -->

            <div class="board-wrapper">

                <div
                    id="gameBoard"
                    class="monopoly-board"
                >

                    <!--
                        棋盤由 JS 模組建立。

                        40 格：
                        0  = GO
                        1  = Bridgwater
                        2  = Community Chest
                        ...
                        39 = Plymouth

                        不把 40 格硬寫死在 index.html。
                    -->

                </div>

            </div>


            <!-- =============================================
                 GAME CONTROL PANEL
                 ============================================= -->

            <div
                id="gameControlPanel"
                class="game-control-panel"
            >

                <!-- =========================================
                     當前玩家
                     ========================================= -->

                <div
                    id="myTurnPanel"
                    class="turn-panel"
                >

                    <div
                        id="turnPlayerName"
                        class="turn-player-name"
                    >
                        等待中
                    </div>

                    <div
                        id="turnHint"
                        class="turn-hint"
                    >
                        等待遊戲狀態...
                    </div>


                    <!-- =====================================
                         骰子
                         ===================================== -->

                    <div class="dice-area">

                        <div
                            id="dice1"
                            class="dice"
                        >
                            ⚀
                        </div>

                        <div
                            id="dice2"
                            class="dice"
                        >
                            ⚀
                        </div>

                    </div>


                    <div
                        id="diceResult"
                        class="dice-result"
                    >
                    </div>


                    <!-- =====================================
                         擲骰子
                         ===================================== -->

                    <button
                        id="rollDiceBtn"
                        class="btn btn-roll"
                        type="button"
                    >
                        🎲 擲骰子
                    </button>


                    <!-- =====================================
                         回合操作
                         ===================================== -->

                    <div
                        id="turnActions"
                        class="turn-actions"
                        hidden
                    >

                        <button
                            id="buyPropertyBtn"
                            class="btn btn-buy"
                            type="button"
                            disabled
                        >
                            🏠 購買地產
                        </button>

                        <button
                            id="skipPropertyBtn"
                            class="btn btn-secondary"
                            type="button"
                            disabled
                        >
                            略過購買
                        </button>

                        <button
                            id="drawChanceBtn"
                            class="btn btn-chance"
                            type="button"
                            disabled
                        >
                            ❓ 機會卡
                        </button>

                        <button
                            id="drawCommunityBtn"
                            class="btn btn-community"
                            type="button"
                            disabled
                        >
                            🎁 福利卡
                        </button>

                        <button
                            id="endTurnBtn"
                            class="btn btn-end-turn"
                            type="button"
                            disabled
                        >
                            ➡️ 結束回合
                        </button>

                    </div>

                </div>


                <!-- =========================================
                     非當前玩家
                     ========================================= -->

                <div
                    id="waitingTurnPanel"
                    class="waiting-turn-panel"
                    hidden
                >

                    <div class="waiting-turn-icon">
                        ⏳
                    </div>

                    <div>
                        <strong>
                            等待其他玩家
                        </strong>

                        <p id="waitingTurnText">
                            等待對方完成回合...
                        </p>
                    </div>

                </div>

            </div>


            <!-- =============================================
                 CURRENT SPACE
                 ============================================= -->

            <div
                id="currentSpacePanel"
                class="current-space-panel"
            >

                <div class="panel-title">
                    📍 目前位置
                </div>

                <div
                    id="currentSpaceName"
                    class="current-space-name"
                >
                    GO
                </div>

                <div
                    id="currentSpaceDescription"
                    class="current-space-description"
                >
                </div>

            </div>


            <!-- =============================================
                 EVENT / CARD RESULT
                 ============================================= -->

            <div
                id="eventPanel"
                class="event-panel"
                hidden
            >

                <div
                    id="eventIcon"
                    class="event-icon"
                >
                    🎴
                </div>

                <div>

                    <div
                        id="eventTitle"
                        class="event-title"
                    >
                    </div>

                    <div
                        id="eventMessage"
                        class="event-message"
                    >
                    </div>

                </div>

                <button
                    id="closeEventBtn"
                    class="event-close"
                    type="button"
                >
                    確定
                </button>

            </div>


            <!-- =============================================
                 PLAYERS DETAIL
                 ============================================= -->

            <div class="players-panel">

                <div class="panel-title">
                    👥 玩家狀態
                </div>

                <div
                    id="playersDetail"
                    class="players-detail"
                >
                </div>

            </div>


            <!-- =============================================
                 GAME LOG
                 ============================================= -->

            <div class="game-log-panel">

                <div class="panel-title">
                    📜 遊戲紀錄
                </div>

                <div
                    id="gameLog"
                    class="game-log"
                >
                    <div class="log-empty">
                        遊戲紀錄會顯示在這裡
                    </div>
                </div>

            </div>


            <!-- =============================================
                 LEAVE GAME
                 ============================================= -->

            <button
                id="leaveGameBtn"
                class="btn btn-danger-outline leave-game-btn"
                type="button"
            >
                離開遊戲
            </button>

        </section>


        <!-- =================================================
             SCREEN 4
             遊戲結束
             ================================================= -->

        <section
            id="finishScreen"
            class="screen"
        >

            <div class="finish-card">

                <div class="finish-icon">
                    🏆
                </div>

                <h1>
                    遊戲結束
                </h1>

                <div
                    id="winnerName"
                    class="winner-name"
                >
                </div>

                <div
                    id="finalRanking"
                    class="final-ranking"
                >
                </div>

                <button
                    id="backToLobbyBtn"
                    class="btn btn-primary"
                    type="button"
                >
                    回到大廳
                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         GLOBAL TOAST
         ===================================================== -->

    <div
        id="toast"
        class="toast"
        hidden
    >
        <span id="toastMessage"></span>
    </div>


    <!-- =====================================================
         MODAL
         ===================================================== -->

    <div
        id="modalOverlay"
        class="modal-overlay"
        hidden
    >

        <div
            id="modal"
            class="modal"
        >

            <div
                id="modalIcon"
                class="modal-icon"
            >
                🎲
            </div>

            <h2
                id="modalTitle"
                class="modal-title"
            >
            </h2>

            <div
                id="modalContent"
                class="modal-content"
            >
            </div>

            <div
                id="modalButtons"
                class="modal-buttons"
            >
            </div>

        </div>

    </div>


</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script type="module" src="./js/app.js"></script>

</body>
</html>
