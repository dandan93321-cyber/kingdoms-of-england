<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONOPOLY UK - Supabase Multiplayer</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #10131a;
      --panel: #191e27;
      --panel2: #202733;
      --border: #333b49;
      --text: #f5f7fa;
      --muted: #aab3c2;
      --green: #35d07f;
      --red: #ff5d6c;
      --yellow: #ffd166;
      --blue: #5aa9ff;
      --purple: #a78bfa;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, #20283a 0%, #10131a 45%, #090b10 100%);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: min(1400px, 100%);
      margin: auto;
      padding: 20px;
    }

    /* =====================================================
       TOP
    ===================================================== */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 999px;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
    }

    .dot.online {
      background: var(--green);
      box-shadow: 0 0 10px rgba(53, 208, 127, .6);
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    .join-screen {
      min-height: calc(100vh - 100px);
      display: grid;
      place-items: center;
    }

    .join-card {
      width: min(480px, 100%);
      background: rgba(25, 30, 39, .96);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .45);
    }

    .join-card h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .join-card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: #0e1218;
      color: white;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(90, 169, 255, .12);
    }

    .join-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .primary,
    .secondary,
    .danger {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font-weight: 800;
      transition: transform .15s, opacity .15s;
    }

    .primary {
      background: var(--green);
      color: #07140d;
    }

    .secondary {
      background: #2b3341;
      color: white;
    }

    .danger {
      background: var(--red);
      color: white;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .38;
      cursor: not-allowed;
      transform: none;
    }

    .status-message {
      min-height: 22px;
      margin-top: 14px;
      color: var(--yellow);
      font-size: 13px;
      line-height: 1.5;
    }

    /* =====================================================
       GAME
    ===================================================== */

    .game-layout {
      display: grid;
      grid-template-columns: minmax(620px, 1fr) 350px;
      gap: 18px;
      align-items: start;
    }

    .board-panel,
    .side-panel {
      background: rgba(25, 30, 39, .95);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .board-panel {
      padding: 14px;
    }

    .side-panel {
      padding: 16px;
    }

    /* =====================================================
       BOARD
    ===================================================== */

    .board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      gap: 3px;
      background: #0a0d12;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #3a4351;
    }

    .space {
      position: relative;
      background: #f3f0e7;
      color: #15181d;
      min-width: 0;
      min-height: 0;
      border: 1px solid #aaa79f;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .space.empty {
      background:
        radial-gradient(circle, #242b36 1px, transparent 1px);
      background-size: 8px 8px;
      border: 0;
    }

    .space-color {
      height: 17%;
      min-height: 5px;
      flex-shrink: 0;
    }

    .brown {
      background: #955b35;
    }

    .light_blue {
      background: #8fd8f7;
    }

    .pink {
      background: #e88ac4;
    }

    .orange {
      background: #f59c47;
    }

    .red {
      background: #ed4d54;
    }

    .yellow {
      background: #f1d34f;
    }

    .green {
      background: #58b76d;
    }

    .dark_blue {
      background: #4f65b7;
    }

    .space-content {
      padding: 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1px;
      height: 100%;
    }

    .space-name {
      font-size: clamp(5px, .75vw, 10px);
      line-height: 1.1;
      font-weight: 900;
      word-break: break-word;
    }

    .space-price {
      font-size: clamp(5px, .65vw, 9px);
      color: #444;
    }

    .owner-bar {
      height: 4px;
      width: 100%;
      border-radius: 4px;
      margin-top: auto;
    }

    .owner-1 {
      background: #ff595e;
    }

    .owner-2 {
      background: #1982c4;
    }

    .owner-3 {
      background: #8ac926;
    }

    .owner-4 {
      background: #ffca3a;
    }

    .tokens {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      margin-top: 1px;
    }

    .token {
      width: clamp(11px, 1.5vw, 22px);
      height: clamp(11px, 1.5vw, 22px);
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      font-size: clamp(5px, .6vw, 9px);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
    }

    .token-1 {
      background: #ff595e;
    }

    .token-2 {
      background: #1982c4;
    }

    .token-3 {
      background: #8ac926;
    }

    .token-4 {
      background: #ff9f1c;
    }

    .center {
      grid-column: 2 / 11;
      grid-row: 2 / 11;
      background:
        radial-gradient(circle at 50% 35%, #263448 0%, #141a24 55%, #0c1017 100%);
      color: white;
      border-radius: 4px;
      border: 1px solid #3b4657;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .center-inner {
      max-width: 420px;
    }

    .center-title {
      font-size: clamp(24px, 4vw, 54px);
      font-weight: 1000;
      letter-spacing: 3px;
    }

    .center-sub {
      color: #aeb8c8;
      margin-top: 8px;
      font-size: 13px;
    }

    /* =====================================================
       SIDE
    ===================================================== */

    .room-info {
      background: #11161e;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .room-code {
      font-size: 24px;
      font-weight: 1000;
      letter-spacing: 3px;
    }

    .room-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .turn-box {
      border: 1px solid var(--border);
      background: #11161e;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .turn-label {
      color: var(--muted);
      font-size: 12px;
    }

    .turn-player {
      font-size: 21px;
      font-weight: 900;
      margin-top: 3px;
    }

    .your-turn {
      color: var(--green);
    }

    .dice {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    .die {
      width: 58px;
      height: 58px;
      background: #f6f7f9;
      color: #15181d;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
    }

    .total {
      color: var(--muted);
      font-size: 13px;
      align-self: center;
    }

    .action-buttons {
      display: grid;
      gap: 9px;
      margin-top: 12px;
    }

    .action-buttons button {
      width: 100%;
    }

    .players-title,
    .events-title {
      font-weight: 900;
      margin: 18px 0 9px;
    }

    .players {
      display: grid;
      gap: 8px;
    }

    .player-card {
      background: #11161e;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      position: relative;
    }

    .player-card.active {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(53, 208, 127, .18);
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .player-name {
      font-weight: 900;
    }

    .player-money {
      color: var(--green);
      font-weight: 900;
    }

    .player-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .events {
      max-height: 230px;
      overflow-y: auto;
      display: grid;
      gap: 6px;
    }

    .event {
      background: #11161e;
      border: 1px solid #29313e;
      border-radius: 9px;
      padding: 8px;
      font-size: 11px;
      color: #d9dee6;
      line-height: 1.4;
    }

    .event-time {
      color: #7f8a9a;
      font-size: 10px;
      margin-top: 3px;
    }

    .error {
      color: var(--red);
    }

    .success {
      color: var(--green);
    }

    .loading {
      color: var(--yellow);
    }

    .footer-note {
      color: #6e7888;
      font-size: 10px;
      line-height: 1.5;
      margin-top: 14px;
    }

    @media (max-width: 1000px) {
      .game-layout {
        grid-template-columns: 1fr;
      }

      .side-panel {
        width: 100%;
      }
    }

    @media (max-width: 700px) {
      .app {
        padding: 10px;
      }

      .logo {
        font-size: 21px;
      }

      .board-panel {
        padding: 6px;
      }

      .board {
        gap: 1px;
      }

      .space-name {
        font-size: 5px;
      }

      .space-price {
        font-size: 5px;
      }

      .center {
        padding: 5px;
      }

      .center-title {
        font-size: 22px;
        letter-spacing: 1px;
      }

      .center-sub {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>
    <div>
      <div class="logo">MONOPOLY UK</div>
      <div class="subtitle">Supabase Multiplayer Edition</div>
    </div>

    <div class="connection">
      <span id="connectionDot" class="dot"></span>
      <span id="connectionText">尚未連線</span>
    </div>
  </header>


  <!-- =====================================================
       JOIN SCREEN
  ====================================================== -->

  <section id="joinScreen" class="join-screen">

    <div class="join-card">

      <h1>開始遊戲</h1>

      <p>
        建立新房間，或輸入朋友提供的房間代碼加入遊戲。
      </p>

      <div class="field">
        <label>玩家名稱</label>
        <input
          id="playerName"
          type="text"
          maxlength="20"
          placeholder="例如：Alex"
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label>房間代碼</label>
        <input
          id="roomCode"
          type="text"
          maxlength="12"
          placeholder="例如：ABCD"
          autocomplete="off"
        >
      </div>

      <div class="join-actions">
        <button id="createRoomBtn" class="primary">
          建立房間
        </button>

        <button id="joinRoomBtn" class="secondary">
          加入房間
        </button>
      </div>

      <div id="joinMessage" class="status-message"></div>

    </div>

  </section>


  <!-- =====================================================
       GAME SCREEN
  ====================================================== -->

  <section id="gameScreen" class="hidden">

    <div class="game-layout">

      <!-- =================================================
           BOARD
      ================================================== -->

      <div class="board-panel">

        <div id="board" class="board">

          <!-- 中央區 -->
          <div class="center">
            <div class="center-inner">
              <div class="center-title">MONOPOLY</div>
              <div class="center-sub">
                UK EDITION · SUPABASE ONLINE
              </div>
            </div>
          </div>

        </div>

      </div>


      <!-- =================================================
           SIDE PANEL
      ================================================== -->

      <aside class="side-panel">

        <div class="room-info">
          <div class="turn-label">ROOM</div>
          <div id="roomCodeDisplay" class="room-code">----</div>
          <div id="roomStatus" class="room-status">
            等待玩家加入
          </div>
        </div>


        <div class="turn-box">

          <div class="turn-label">
            CURRENT TURN
          </div>

          <div id="turnPlayer" class="turn-player">
            等待開始
          </div>

          <div class="dice">
            <div id="die1" class="die">—</div>
            <div id="die2" class="die">—</div>
            <div id="diceTotal" class="total">
              尚未擲骰
            </div>
          </div>

          <div id="actionButtons" class="action-buttons">

            <button
              id="rollBtn"
              class="primary"
              disabled
            >
              🎲 擲骰
            </button>

            <button
              id="buyBtn"
              class="primary hidden"
            >
              🏠 購買地產
            </button>

            <button
              id="endTurnBtn"
              class="secondary hidden"
            >
              ➜ 結束回合
            </button>

            <button
              id="startBtn"
              class="primary hidden"
            >
              ▶ 開始遊戲
            </button>

          </div>

          <div id="actionMessage" class="status-message"></div>

        </div>


        <!-- =================================================
             PLAYERS
        ================================================== -->

        <div class="players-title">
          玩家
        </div>

        <div id="playersList" class="players"></div>


        <!-- =================================================
             EVENTS
        ================================================== -->

        <div class="events-title">
          遊戲紀錄
        </div>

        <div id="eventsList" class="events"></div>


        <div class="footer-note">
          遊戲狀態由 Supabase Server RPC 控制。<br>
          骰子由伺服器產生，玩家無法自行修改結果。
        </div>

      </aside>

    </div>

  </section>

</div>


<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://aeqhrcdlmpqncddridaj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_mpr9262EO73p6B6KHBhc7A_l-TBVzPc";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let roomId = null;
let gameId = null;
let myPlayerId = null;
let myPlayerNumber = null;

let currentGame = null;
let players = [];
let boardSpaces = [];
let gameEvents = [];

let realtimeChannel = null;

let hasRolledThisTurn = false;
let currentLandingPosition = null;


/* =========================================================
   DOM
========================================================= */

const joinScreen =
  document.getElementById("joinScreen");

const gameScreen =
  document.getElementById("gameScreen");

const playerNameInput =
  document.getElementById("playerName");

const roomCodeInput =
  document.getElementById("roomCode");

const createRoomBtn =
  document.getElementById("createRoomBtn");

const joinRoomBtn =
  document.getElementById("joinRoomBtn");

const joinMessage =
  document.getElementById("joinMessage");

const roomCodeDisplay =
  document.getElementById("roomCodeDisplay");

const roomStatus =
  document.getElementById("roomStatus");

const turnPlayer =
  document.getElementById("turnPlayer");

const die1 =
  document.getElementById("die1");

const die2 =
  document.getElementById("die2");

const diceTotal =
  document.getElementById("diceTotal");

const rollBtn =
  document.getElementById("rollBtn");

const buyBtn =
  document.getElementById("buyBtn");

const endTurnBtn =
  document.getElementById("endTurnBtn");

const startBtn =
  document.getElementById("startBtn");

const actionMessage =
  document.getElementById("actionMessage");

const playersList =
  document.getElementById("playersList");

const eventsList =
  document.getElementById("eventsList");

const board =
  document.getElementById("board");

const connectionDot =
  document.getElementById("connectionDot");

const connectionText =
  document.getElementById("connectionText");


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {
  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function setJoinMessage(message, type = "") {
  joinMessage.textContent = message;
  joinMessage.className =
    "status-message " + type;
}


function setActionMessage(message, type = "") {
  actionMessage.textContent = message;
  actionMessage.className =
    "status-message " + type;
}


function setConnection(online, text) {
  connectionDot.classList.toggle("online", online);
  connectionText.textContent = text;
}


function normalizeRoomCode(value) {
  return String(value || "")
    .trim()
    .toUpperCase();
}


function getPlayerById(id) {
  return players.find(p => p.id === id);
}


function getCurrentPlayer() {
  if (!currentGame) return null;

  return getPlayerById(
    currentGame.current_player_id
  );
}


function isMyTurn() {
  return (
    currentGame &&
    currentGame.status === "playing" &&
    currentGame.current_player_id === myPlayerId
  );
}


/* =========================================================
   CREATE ROOM
========================================================= */

createRoomBtn.addEventListener(
  "click",
  async () => {

    const name =
      playerNameInput.value.trim();

    let code =
      normalizeRoomCode(roomCodeInput.value);

    if (!name) {
      setJoinMessage(
        "請先輸入玩家名稱。",
        "error"
      );
      return;
    }

    if (!code) {
      code =
        Math.random()
          .toString(36)
          .substring(2, 6)
          .toUpperCase();

      roomCodeInput.value = code;
    }

    createRoomBtn.disabled = true;
    joinRoomBtn.disabled = true;

    setJoinMessage(
      "正在建立房間……",
      "loading"
    );

    try {

      const { data, error } =
        await supabaseClient.rpc(
          "create_room",
          {
            p_room_code: code
          }
        );

      if (error) {
        throw error;
      }

      if (!data || !data.room_id) {
        throw new Error(
          "建立房間失敗：伺服器沒有回傳房間資料。"
        );
      }

      roomCodeInput.value =
        data.room_code;

      setJoinMessage(
        "房間建立成功，正在加入……",
        "success"
      );

      await joinRoom(
        data.room_code,
        name
      );

    } catch (error) {

      console.error(error);

      setJoinMessage(
        error.message ||
        "建立房間失敗。",
        "error"
      );

      createRoomBtn.disabled = false;
      joinRoomBtn.disabled = false;
    }
  }
);


/* =========================================================
   JOIN ROOM
========================================================= */

joinRoomBtn.addEventListener(
  "click",
  async () => {

    const name =
      playerNameInput.value.trim();

    const code =
      normalizeRoomCode(roomCodeInput.value);

    if (!name) {
      setJoinMessage(
        "請輸入玩家名稱。",
        "error"
      );
      return;
    }

    if (!code) {
      setJoinMessage(
        "請輸入房間代碼。",
        "error"
      );
      return;
    }

    createRoomBtn.disabled = true;
    joinRoomBtn.disabled = true;

    setJoinMessage(
      "正在加入房間……",
      "loading"
    );

    try {

      await joinRoom(
        code,
        name
      );

    } catch (error) {

      console.error(error);

      setJoinMessage(
        error.message ||
        "加入房間失敗。",
        "error"
      );

      createRoomBtn.disabled = false;
      joinRoomBtn.disabled = false;
    }
  }
);


/* =========================================================
   JOIN ROOM FUNCTION
========================================================= */

async function joinRoom(code, name) {

  const { data, error } =
    await supabaseClient.rpc(
      "join_room",
      {
        p_room_code: code,
        p_name: name
      }
    );

  if (error) {
    throw error;
  }

  if (!data || !data.player_id) {
    throw new Error(
      "加入房間失敗：伺服器沒有回傳玩家資料。"
    );
  }

  roomId = data.room_id;
  gameId = data.game_id;
  myPlayerId = data.player_id;
  myPlayerNumber = data.player_number;

  localStorage.setItem(
    "monopoly_room_code",
    code
  );

  localStorage.setItem(
    "monopoly_player_name",
    name
  );

  localStorage.setItem(
    "monopoly_player_id",
    myPlayerId
  );

  localStorage.setItem(
    "monopoly_game_id",
    gameId
  );

  joinScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  roomCodeDisplay.textContent = code;

  setConnection(
    true,
    "Supabase 已連線"
  );

  setActionMessage(
    "已加入房間。",
    "success"
  );

  await loadGameState();
  await loadEvents();
  subscribeRealtime();

  createBoard();

  renderAll();
}


/* =========================================================
   LOAD GAME STATE
========================================================= */

async function loadGameState() {

  if (!gameId) return;

  const { data, error } =
    await supabaseClient.rpc(
      "get_game_state",
      {
        p_game_id: gameId
      }
    );

  if (error) {
    console.error(error);

    setActionMessage(
      error.message ||
      "取得遊戲狀態失敗。",
      "error"
    );

    return;
  }

  if (!data) return;

  currentGame =
    typeof data.game === "string"
      ? JSON.parse(data.game)
      : data.game;

  players =
    typeof data.players === "string"
      ? JSON.parse(data.players)
      : (data.players || []);

  boardSpaces =
    typeof data.board === "string"
      ? JSON.parse(data.board)
      : (data.board || []);

  if (!Array.isArray(players)) {
    players = [];
  }

  if (!Array.isArray(boardSpaces)) {
    boardSpaces = [];
  }

  if (currentGame) {
    const currentPlayer =
      getCurrentPlayer();

    if (
      currentGame.current_player_id !==
      myPlayerId
    ) {
      hasRolledThisTurn = false;
    }

    if (
      currentPlayer &&
      currentPlayer.id === myPlayerId
    ) {
      /*
       * 不要因為 realtime refresh
       * 把玩家剛剛擲骰的狀態亂掉。
       */
    }
  }

  renderAll();
}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents() {

  if (!gameId) return;

  const { data, error } =
    await supabaseClient
      .from("game_events")
      .select("*")
      .eq("game_id", gameId)
      .order("created_at", {
        ascending: false
      })
      .limit(100);

  if (error) {
    console.error(error);
    return;
  }

  gameEvents =
    Array.isArray(data)
      ? data
      : [];

  renderEvents();
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime() {

  if (!gameId) return;

  if (realtimeChannel) {
    supabaseClient.removeChannel(
      realtimeChannel
    );
  }

  realtimeChannel =
    supabaseClient
      .channel(
        "monopoly-game-" + gameId
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "games",
          filter: "id=eq." + gameId
        },
        async () => {

          await loadGameState();
        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "players",
          filter: "game_id=eq." + gameId
        },
        async () => {

          await loadGameState();
        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "game_events",
          filter: "game_id=eq." + gameId
        },
        async () => {

          await loadEvents();
          await loadGameState();
        }
      )

      .subscribe(
        status => {

          if (
            status === "SUBSCRIBED"
          ) {

            setConnection(
              true,
              "即時同步中"
            );

          } else if (
            status === "CHANNEL_ERROR"
          ) {

            setConnection(
              false,
              "Realtime 錯誤"
            );

          } else if (
            status === "TIMED_OUT"
          ) {

            setConnection(
              false,
              "Realtime 逾時"
            );
          }
        }
      );
}

/* =========================================================
   BOARD POSITION → CSS GRID
========================================================= */

/*
   40 格：
   bottom row: 0 → 10
   left column: 11 → 19
   top row: 20 → 30
   right column: 31 → 39
*/

function getGridPosition(position) {

  if (position === 0) {
    return {
      row: 11,
      col: 11
    };
  }

  if (position <= 10) {
    return {
      row: 11,
      col: 11 - position
    };
  }

  if (position <= 20) {
    return {
      row: 11 - (position - 10),
      col: 1
    };
  }

  if (position <= 30) {
    return {
      row: 1,
      col: position - 20 + 1
    };
  }

  return {
    row: position - 30 + 1,
    col: 11
  };
}


/* =========================================================
   CREATE BOARD
========================================================= */

function createBoard() {

  if (!boardSpaces.length) {
    return;
  }

  /*
   * 保留中央
   */
  board.innerHTML = "";

  const center =
    document.createElement("div");

  center.className = "center";

  center.innerHTML = `
    <div class="center-inner">
      <div class="center-title">
        MONOPOLY
      </div>
      <div class="center-sub">
        UK EDITION · SUPABASE ONLINE
      </div>
    </div>
  `;

  board.appendChild(center);

  boardSpaces.forEach(space => {

    const el =
      document.createElement("div");

    el.className =
      "space";

    const pos =
      getGridPosition(
        space.position
      );

    el.style.gridRow =
      pos.row;

    el.style.gridColumn =
      pos.col;

    el.dataset.position =
      space.position;

    let colorClass = "";

    if (space.color_group) {
      colorClass =
        space.color_group;
    }

    const owner =
      getPropertyOwner(
        space.position
      );

    const ownerClass =
      owner
        ? "owner-" + owner.player_number
        : "";

    el.innerHTML = `
      ${
        colorClass
          ? `<div class="space-color ${escapeHtml(colorClass)}"></div>`
          : ""
      }

      <div class="space-content">

        <div class="space-name">
          ${escapeHtml(space.name)}
        </div>

        ${
          space.price > 0
            ? `<div class="space-price">£${space.price}</div>`
            : ""
        }

        ${
          owner
            ? `
              <div
                class="owner-bar ${ownerClass}"
                title="擁有者：${escapeHtml(owner.name)}"
              ></div>
            `
            : ""
        }

        <div
          class="tokens"
          id="tokens-${space.position}"
        ></div>

      </div>
    `;

    board.appendChild(el);
  });

  renderTokens();
}


/* =========================================================
   PROPERTY OWNERSHIP
========================================================= */

function getPropertyOwner(position) {

  /*
   * SQL 的 buy_property：
   *
   * event_type = property_purchase
   * data.position = 地產位置
   *
   * 因此從 game_events 還原所有權。
   */

  const event =
    gameEvents.find(e => {

      if (
        e.event_type !==
        "property_purchase"
      ) {
        return false;
      }

      if (!e.data) {
        return false;
      }

      return Number(
        e.data.position
      ) === Number(position);

    });

  if (!event) {
    return null;
  }

  return getPlayerById(
    event.player_id
  ) || null;
}


/* =========================================================
   TOKENS
========================================================= */

function renderTokens() {

  boardSpaces.forEach(space => {

    const container =
      document.getElementById(
        "tokens-" +
        space.position
      );

    if (!container) return;

    container.innerHTML = "";

    const here =
      players.filter(
        p =>
          Number(p.position) ===
          Number(space.position) &&
          !p.is_bankrupt
      );

    here.forEach(player => {

      const token =
        document.createElement("div");

      token.className =
        "token token-" +
        player.player_number;

      token.textContent =
        player.player_number;

      token.title =
        player.name;

      container.appendChild(token);
    });
  });
}


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers() {

  playersList.innerHTML = "";

  players
    .slice()
    .sort(
      (a, b) =>
        a.player_number -
        b.player_number
    )
    .forEach(player => {

      const card =
        document.createElement("div");

      card.className =
        "player-card";

      if (
        currentGame &&
        currentGame.current_player_id ===
        player.id
      ) {
        card.classList.add("active");
      }

      const isMe =
        player.id === myPlayerId;

      card.innerHTML = `
        <div class="player-top">

          <div class="player-name">

            <span
              class="token token-${player.player_number}"
              style="
                display:inline-grid;
                width:18px;
                height:18px;
                border-width:1px;
                vertical-align:middle;
                margin-right:4px;
              "
            >
              ${player.player_number}
            </span>

            ${escapeHtml(player.name)}

            ${
              isMe
                ? `<span style="color:#5aa9ff;font-size:10px;">
                    YOU
                   </span>`
                : ""
            }

          </div>

          <div class="player-money">
            £${Number(player.money || 0)}
          </div>

        </div>

        <div class="player-meta">

          位置：
          ${player.position}

          ·
          ${
            boardSpaces.find(
              s =>
                Number(s.position) ===
                Number(player.position)
            )?.name || "—"
          }

          ${
            player.is_in_jail
              ? " · 🔒 監獄"
              : ""
          }

          ${
            player.is_bankrupt
              ? " · 💀 破產"
              : ""
          }

        </div>
      `;

      playersList.appendChild(card);
    });
}


/* =========================================================
   RENDER TURN
========================================================= */

function renderTurn() {

  if (!currentGame) {
    turnPlayer.textContent =
      "等待開始";
    return;
  }

  const current =
    getCurrentPlayer();

  if (!current) {

    turnPlayer.textContent =
      "等待玩家";

    return;
  }

  turnPlayer.textContent =
    current.name;

  turnPlayer.classList.toggle(
    "your-turn",
    current.id === myPlayerId
  );

  roomStatus.textContent =
    currentGame.status === "waiting"
      ? "等待遊戲開始"
      : currentGame.status === "playing"
        ? "遊戲進行中 · 第 " +
          currentGame.turn_number +
          " 回合"
        : "遊戲結束";

  if (
    currentGame.dice_1 !== null &&
    currentGame.dice_1 !== undefined
  ) {

    die1.textContent =
      currentGame.dice_1;

    die2.textContent =
      currentGame.dice_2;

    diceTotal.textContent =
      "總和：" +
      (
        Number(currentGame.dice_1) +
        Number(currentGame.dice_2)
      );

  }
}


/* =========================================================
   UPDATE BUTTONS
========================================================= */

function updateButtons() {

  if (!currentGame) {
    rollBtn.disabled = true;
    return;
  }

  const myTurn =
    isMyTurn();

  /*
   * waiting
   */
  if (
    currentGame.status ===
    "waiting"
  ) {

    rollBtn.disabled = true;

    buyBtn.classList.add(
      "hidden"
    );

    endTurnBtn.classList.add(
      "hidden"
    );

    /*
     * 任何人都可以嘗試 start_game。
     * 這裡讓第一位玩家顯示按鈕。
     */
    if (
      players.length >= 2
    ) {
      startBtn.classList.remove(
        "hidden"
      );
    } else {
      startBtn.classList.add(
        "hidden"
      );
    }

    return;
  }

  /*
   * playing
   */
  startBtn.classList.add(
    "hidden"
  );

  if (
    currentGame.status !==
    "playing"
  ) {

    rollBtn.disabled = true;

    buyBtn.classList.add(
      "hidden"
    );

    endTurnBtn.classList.add(
      "hidden"
    );

    return;
  }

  rollBtn.disabled =
    !myTurn ||
    hasRolledThisTurn;

  /*
   * 只有自己的回合，而且已經擲骰
   * 才能看到結束回合。
   */
  if (
    myTurn &&
    hasRolledThisTurn
  ) {

    endTurnBtn.classList.remove(
      "hidden"
    );

  } else {

    endTurnBtn.classList.add(
      "hidden"
    );
  }

  /*
   * buyBtn 由 roll_dice 結果控制。
   */
}


/* =========================================================
   RENDER EVENTS
========================================================= */

function renderEvents() {

  eventsList.innerHTML = "";

  if (!gameEvents.length) {

    eventsList.innerHTML = `
      <div class="event">
        尚無遊戲紀錄。
      </div>
    `;

    return;
  }

  gameEvents.forEach(event => {

    const div =
      document.createElement("div");

    div.className =
      "event";

    const date =
      new Date(
        event.created_at
      );

    div.innerHTML = `
      <div>
        ${escapeHtml(
          event.message ||
          event.event_type
        )}
      </div>

      <div class="event-time">
        ${date.toLocaleTimeString(
          "zh-TW",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        )}
      </div>
    `;

    eventsList.appendChild(div);
  });
}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

  if (!boardSpaces.length) {
    return;
  }

  createBoard();
  renderPlayers();
  renderTurn();
  renderEvents();
  updateButtons();
}


/* =========================================================
   RESTORE SESSION FROM LOCAL STORAGE
========================================================= */

async function restoreSession() {

  const savedRoom =
    localStorage.getItem(
      "monopoly_room_code"
    );

  const savedName =
    localStorage.getItem(
      "monopoly_player_name"
    );

  const savedPlayerId =
    localStorage.getItem(
      "monopoly_player_id"
    );

  const savedGameId =
    localStorage.getItem(
      "monopoly_game_id"
    );

  if (
    !savedRoom ||
    !savedName ||
    !savedPlayerId ||
    !savedGameId
  ) {
    return;
  }

  /*
   * 注意：
   * 不直接相信 localStorage 的 player_id。
   * 先取得 game state，再確認玩家仍存在。
   */

  setJoinMessage(
    "正在恢復上一場遊戲……",
    "loading"
  );

  try {

    roomId = null;
    gameId = savedGameId;
    myPlayerId = savedPlayerId;

    const { data, error } =
      await supabaseClient.rpc(
        "get_game_state",
        {
          p_game_id: gameId
        }
      );

    if (error) {
      throw error;
    }

    if (!data) {
      throw new Error(
        "遊戲不存在。"
      );
    }

    const restoredPlayers =
      typeof data.players === "string"
        ? JSON.parse(data.players)
        : data.players;

    const me =
      (restoredPlayers || []).find(
        p =>
          p.id ===
          savedPlayerId
      );

    if (!me) {
      throw new Error(
        "找不到原本的玩家。"
      );
    }

    myPlayerNumber =
      me.player_number;

    currentGame =
      typeof data.game === "string"
        ? JSON.parse(data.game)
        : data.game;

    players =
      restoredPlayers || [];

    boardSpaces =
      typeof data.board === "string"
        ? JSON.parse(data.board)
        : (data.board || []);

    joinScreen.classList.add(
      "hidden"
    );

    gameScreen.classList.remove(
      "hidden"
    );

    roomCodeDisplay.textContent =
      savedRoom;

    setConnection(
      true,
      "正在恢復即時連線"
    );

    await loadEvents();

    subscribeRealtime();

    createBoard();
    renderAll();

    setActionMessage(
      "已恢復遊戲連線。",
      "success"
    );

  } catch (error) {

    console.warn(
      "Restore session failed:",
      error
    );

    localStorage.removeItem(
      "monopoly_player_id"
    );

    localStorage.removeItem(
      "monopoly_game_id"
    );

    gameId = null;
    myPlayerId = null;
  }
}

/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    /*
     * Enter 加入
     */
    if (
      event.key === "Enter" &&
      !gameScreen.classList.contains(
        "hidden"
      )
    ) {
      return;
    }

    if (
      event.key === "Enter" &&
      !joinScreen.classList.contains(

      )
    ) {

      joinRoomBtn.click();
    }
  }
);


/* =========================================================
   INITIALIZE
========================================================= */

(async function init() {

  await testSupabaseConnection();

  /*
   * 預填上次使用的名稱 / 房間
   */
  const savedName =
    localStorage.getItem(
      "monopoly_player_name"
    );

  const savedRoom =
    localStorage.getItem(
      "monopoly_room_code"
    );

  if (savedName) {
    playerNameInput.value =
      savedName;
  }

  if (savedRoom) {
    roomCodeInput.value =
      savedRoom;
  }

  /*
   * 嘗試恢復上一場遊戲
   */
  await restoreSession();

})();
</script>
