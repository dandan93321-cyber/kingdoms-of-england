<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>MONOPOLY UK - Supabase Multiplayer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #07101d;
    --bg2: #0c1a2c;
    --card: #101d2e;
    --card2: #16263a;
    --border: #263b55;
    --text: #f4f7fb;
    --muted: #9eacbd;
    --green: #21d58a;
    --blue: #3f7cff;
    --purple: #6250ef;
    --red: #ff5d73;
    --yellow: #e5c65a;
    --shadow: 0 25px 80px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        radial-gradient(
            circle at 50% 0%,
            #1a3559 0%,
            #0b1b2f 35%,
            #050c16 80%
        );
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .45;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 20;

    height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: rgba(4, 12, 22, .94);
    border-bottom: 1px solid #1c2d43;
    backdrop-filter: blur(14px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 14px;

    font-size: 24px;
    font-weight: 800;
    letter-spacing: .5px;
}

.logo-mark {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background: linear-gradient(
        135deg,
        #24dc91,
        #18b978
    );

    color: #062016;
    font-weight: 900;
    font-size: 25px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 11px 16px;

    border-radius: 999px;

    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.06);

    color: var(--muted);
    font-size: 14px;
}

.connection-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--yellow);
}

.connection.connected .connection-dot {
    background: var(--green);
    box-shadow: 0 0 12px rgba(33,213,138,.7);
}

.connection.error .connection-dot {
    background: var(--red);
}

/* =========================
   LAYOUT
========================= */

.container {
    width: min(1250px, calc(100% - 30px));
    margin: 0 auto;
    padding: 45px 0 80px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* =========================
   LOGIN
========================= */

.login-card {
    width: min(760px, 100%);
    margin: 80px auto 0;

    padding: 42px;

    background:
        linear-gradient(
            145deg,
            rgba(18,34,54,.96),
            rgba(10,23,39,.96)
        );

    border: 1px solid rgba(116,151,190,.25);
    border-radius: 25px;

    box-shadow: var(--shadow);
}

.login-title {
    margin: 0 0 10px;

    font-size: clamp(32px, 6vw, 48px);
    font-weight: 850;
}

.login-subtitle {
    margin: 0 0 28px;

    color: var(--muted);
    font-size: 18px;
    line-height: 1.7;
}

.notice {
    margin-bottom: 25px;
    padding: 17px 18px;

    border-radius: 16px;

    border: 1px solid rgba(229,198,90,.35);
    background: rgba(229,198,90,.08);

    color: #e9d993;
    line-height: 1.65;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    margin-bottom: 8px;

    color: #b5c0ce;
    font-size: 14px;
    font-weight: 650;
}

.field input {
    width: 100%;
    height: 60px;

    padding: 0 18px;

    border-radius: 15px;

    border: 1px solid #30465f;
    outline: none;

    background: #101e30;
    color: white;

    font-size: 17px;
}

.field input:focus {
    border-color: #4e7bc0;
    box-shadow: 0 0 0 3px rgba(63,124,255,.12);
}

.button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 24px;
}

.btn {
    min-height: 58px;

    border: 0;
    border-radius: 15px;

    font-size: 17px;
    font-weight: 800;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.btn:not(:disabled):active {
    transform: scale(.98);
}

.btn-primary {
    background: linear-gradient(
        135deg,
        #20db8a,
        #19bd76
    );
    color: #041a10;
}

.btn-blue {
    background: linear-gradient(
        135deg,
        #397aff,
        #6350ec
    );
    color: white;
}

.btn-dark {
    background: #1b2b40;
    color: white;
    border: 1px solid #30445d;
}

.btn-danger {
    background: rgba(255,93,115,.13);
    color: #ff8292;
    border: 1px solid rgba(255,93,115,.25);
}

.btn-small {
    min-height: 44px;
    padding: 0 16px;
    font-size: 14px;
}

/* =========================
   ROOM
========================= */

.room-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 24px;
}

.room-title {
    margin: 0;
    font-size: 32px;
}

.room-code {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin-top: 8px;

    color: var(--muted);
}

.room-code strong {
    color: white;
    letter-spacing: 2px;
}

.status-card {
    padding: 25px;

    border-radius: 22px;

    background: rgba(13,27,44,.92);
    border: 1px solid var(--border);
}

.status-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.status-title {
    font-size: 21px;
    font-weight: 800;
}

.status-desc {
    margin-top: 7px;
    color: var(--muted);
}

.player-count {
    padding: 10px 15px;

    border-radius: 999px;

    background: #1b2c42;
    color: #dce6f2;

    white-space: nowrap;
}

/* =========================
   PLAYERS
========================= */

.players-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));

    gap: 14px;
    margin-top: 18px;
}

.player-card {
    padding: 17px;

    border-radius: 18px;

    background: #132237;
    border: 1px solid #263b55;

    transition: .2s ease;
}

.player-card.current {
    border-color: var(--green);
    box-shadow:
        0 0 0 1px rgba(33,213,138,.2),
        0 0 30px rgba(33,213,138,.08);
}

.player-card.me {
    background:
        linear-gradient(
            145deg,
            rgba(25,55,67,.9),
            rgba(17,34,49,.95)
        );
}

.player-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.player-name {
    font-size: 18px;
    font-weight: 800;
}

.badge {
    padding: 4px 8px;
    border-radius: 999px;

    background: rgba(255,255,255,.08);
    color: #aeb9c7;

    font-size: 11px;
}

.badge.turn {
    background: rgba(33,213,138,.12);
    color: var(--green);
}

.player-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;

    margin-top: 14px;
}

.info-box {
    padding: 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.045);
}

.info-label {
    color: #8090a4;
    font-size: 11px;
}

.info-value {
    margin-top: 3px;
    font-weight: 750;
}

/* =========================
   GAME
========================= */

.game-layout {
    display: grid;
    grid-template-columns:
        minmax(0, 1.55fr)
        minmax(320px, .75fr);

    gap: 20px;

    margin-top: 20px;
}

.panel {
    border-radius: 22px;

    background: rgba(12,25,42,.95);
    border: 1px solid var(--border);

    box-shadow: 0 15px 50px rgba(0,0,0,.18);
}

.panel-header {
    padding: 20px 22px;

    border-bottom: 1px solid #1e3148;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.panel-title {
    font-size: 20px;
    font-weight: 800;
}

/* =========================
   BOARD
========================= */

.board {
    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 7px;

    padding: 15px;
}

.space {
    position: relative;

    min-height: 108px;

    padding: 10px;

    border-radius: 13px;

    background: #17273b;
    border: 1px solid #2a4059;

    overflow: hidden;
}

.space:hover {
    border-color: #426384;
}

.space-color {
    height: 7px;

    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    border-radius: 13px 13px 0 0;

    background: #536273;
}

.space-name {
    margin-top: 8px;

    font-size: 12px;
    font-weight: 800;

    line-height: 1.3;
}

.space-city {
    margin-top: 4px;

    color: #8796a8;
    font-size: 10px;
}

.space-price {
    margin-top: 7px;

    color: #c9d3df;
    font-size: 11px;
}

.space-owner {
    margin-top: 5px;

    color: var(--green);
    font-size: 10px;
    font-weight: 750;
}

.tokens {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;

    margin-top: 8px;
}

.token {
    width: 18px;
    height: 18px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: #fff;
    color: #111;

    font-size: 9px;
    font-weight: 900;
}

.color-brown { background: #8a6348; }
.color-light_blue { background: #72c8df; }
.color-pink { background: #e477a9; }
.color-orange { background: #e8994e; }
.color-red { background: #e94d58; }
.color-yellow { background: #e8ce4e; }
.color-green { background: #53bd77; }
.color-dark_blue { background: #586fdb; }

.space-special {
    background: #1b2a3c;
}

.space-current {
    box-shadow:
        inset 0 0 0 2px var(--green),
        0 0 18px rgba(33,213,138,.08);
}

/* =========================
   GAME CONTROL
========================= */

.control-panel {
    padding-bottom: 20px;
}

.turn-box {
    margin: 20px;

    padding: 18px;

    border-radius: 17px;

    background: #14273d;
    border: 1px solid #29415c;
}

.turn-label {
    color: #8394a8;
    font-size: 13px;
}

.turn-player {
    margin-top: 4px;

    font-size: 24px;
    font-weight: 850;
}

.dice-result {
    display: grid;
    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 10px;

    margin: 20px;
}

.die {
    min-height: 78px;

    display: grid;
    place-items: center;

    border-radius: 17px;

    background: #182b41;
    border: 1px solid #304b69;

    font-size: 32px;
    font-weight: 900;
}

.dice-plus {
    color: #74859a;
    font-weight: 900;
}

.total {
    margin: 0 20px 20px;

    padding: 13px;

    text-align: center;

    border-radius: 13px;

    background: rgba(33,213,138,.08);
    color: var(--green);

    font-weight: 800;
}

.action-area {
    display: grid;
    gap: 10px;

    padding: 0 20px;
}

.message {
    margin: 20px;

    min-height: 50px;

    padding: 13px 15px;

    border-radius: 13px;

    background: rgba(255,255,255,.045);

    color: #aeb9c7;

    font-size: 13px;
    line-height: 1.55;
}

.message.success {
    color: #7fe9ba;
    background: rgba(33,213,138,.08);
}

.message.error {
    color: #ff8a98;
    background: rgba(255,93,115,.08);
}

/* =========================
   EVENTS
========================= */

.events {
    max-height: 380px;
    overflow: auto;
    padding: 12px 20px 20px;
}

.event {
    padding: 12px 0;

    border-bottom: 1px solid #1b2d42;

    color: #aab6c4;
    font-size: 13px;
    line-height: 1.55;
}

.event:last-child {
    border-bottom: 0;
}

.event-time {
    margin-right: 8px;
    color: #65778c;
    font-size: 11px;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;
    place-items: center;

    padding: 20px;

    background: rgba(0,0,0,.7);
    backdrop-filter: blur(5px);
}

.modal.active {
    display: grid;
}

.modal-card {
    width: min(520px, 100%);

    padding: 30px;

    border-radius: 23px;

    background: #102034;
    border: 1px solid #304966;

    box-shadow: 0 30px 100px rgba(0,0,0,.5);
}

.modal-title {
    margin: 0 0 10px;

    font-size: 25px;
}

.modal-text {
    color: var(--muted);
    line-height: 1.65;
}

.modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 22px;
}

/* =========================
   LOADING
========================= */

.loading {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;
    place-items: center;

    background: rgba(4,10,18,.78);
    backdrop-filter: blur(4px);
}

.loading.active {
    display: grid;
}

.loading-card {
    padding: 25px 30px;

    border-radius: 18px;

    background: #102034;
    border: 1px solid #2b425d;

    text-align: center;
}

.spinner {
    width: 35px;
    height: 35px;

    margin: 0 auto 12px;

    border: 4px solid rgba(255,255,255,.12);
    border-top-color: var(--green);

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .game-layout {
        grid-template-columns: 1fr;
    }

    .login-card {
        margin-top: 30px;
    }
}

@media (max-width: 650px) {

    .header {
        height: 68px;
        padding: 0 15px;
    }

    .logo {
        font-size: 19px;
    }

    .logo-mark {
        width: 40px;
        height: 40px;
        font-size: 21px;
    }

    .connection {
        padding: 8px 11px;
        font-size: 12px;
    }

    .container {
        width: min(100% - 20px, 1250px);
        padding-top: 25px;
    }

    .login-card {
        padding: 25px 18px;
        border-radius: 20px;
    }

    .button-row {
        grid-template-columns: 1fr;
    }

    .room-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .status-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .board {
        gap: 5px;
        padding: 9px;
    }

    .space {
        min-height: 92px;
        padding: 7px;
    }

    .space-name {
        font-size: 10px;
    }

    .space-price,
    .space-city,
    .space-owner {
        font-size: 9px;
    }

    .die {
        min-height: 65px;
        font-size: 27px;
    }

    .modal-actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <div class="logo-mark">M</div>
        <div>MONOPOLY UK</div>
    </div>

    <div id="connection"
         class="connection">
        <span class="connection-dot"></span>
        <span id="connectionText">
            Supabase 連線中...
        </span>
    </div>

</header>

<main class="container">

    <!-- =====================
         HOME
    ====================== -->

    <section id="homeScreen"
             class="screen active">

        <div class="login-card">

            <h1 class="login-title">
                🎲 加入遊戲
            </h1>

            <p class="login-subtitle">
                Supabase 多人即時版。<br>
                每位玩家使用自己的玩家身份，
                遊戲狀態由 Supabase 控制。
            </p>

            <div class="notice">
                建議每位玩家使用自己的手機或瀏覽器加入同一個房間。
                房間、玩家、骰子與回合會自動同步。
            </div>

            <div class="field">
                <label for="playerName">
                    玩家名稱
                </label>

                <input
                    id="playerName"
                    type="text"
                    maxlength="30"
                    placeholder="輸入你的名字"
                    autocomplete="off">
            </div>

            <div class="field">
                <label for="roomCode">
                    房間代碼
                </label>

                <input
                    id="roomCode"
                    type="text"
                    maxlength="20"
                    placeholder="例如 ABC123"
                    autocomplete="off">
            </div>

            <div class="button-row">

                <button
                    id="createRoomBtn"
                    class="btn btn-primary">
                    建立房間
                </button>

                <button
                    id="joinRoomBtn"
                    class="btn btn-blue">
                    加入房間
                </button>

            </div>

            <div id="homeMessage"
                 class="message"
                 style="margin-left:0;margin-right:0;">
                等待連線...
            </div>

        </div>

    </section>


    <!-- =====================
         ROOM
    ====================== -->

    <section id="roomScreen"
             class="screen">

        <div class="room-header">

            <div>

                <h1 class="room-title">
                    遊戲房間
                </h1>

                <div class="room-code">
                    房間代碼：
                    <strong id="roomCodeDisplay">
                        -
                    </strong>

                    <button
                        id="copyRoomBtn"
                        class="btn btn-dark btn-small">
                        複製
                    </button>
                </div>

            </div>

            <button
                id="leaveRoomBtn"
                class="btn btn-danger btn-small">
                離開
            </button>

        </div>


        <div class="status-card">

            <div class="status-top">

                <div>

                    <div id="roomStatusTitle"
                         class="status-title">
                        等待玩家
                    </div>

                    <div id="roomStatusDesc"
                         class="status-desc">
                        -
                    </div>

                </div>

                <div id="playerCount"
                     class="player-count">
                    0 / 4
                </div>

            </div>


            <div id="playersGrid"
                 class="players-grid">
            </div>


            <div
                style="
                    display:grid;
                    grid-template-columns:1fr;
                    gap:10px;
                    margin-top:18px;
                ">

                <button
                    id="startGameBtn"
                    class="btn btn-primary"
                    disabled>
                    開始遊戲
                </button>

            </div>

        </div>


        <div id="gameArea"
             style="display:none;">

            <div class="game-layout">

                <!-- BOARD -->

                <div class="panel">

                    <div class="panel-header">

                        <div class="panel-title">
                            🇬🇧 英國地產棋盤
                        </div>

                        <div id="turnNumberLabel"
                             style="
                                color:#8192a7;
                                font-size:13px;
                             ">
                            回合 0
                        </div>

                    </div>

                    <div id="board"
                         class="board">
                    </div>

                </div>


                <!-- CONTROL -->

                <div>

                    <div class="panel control-panel">

                        <div class="panel-header">

                            <div class="panel-title">
                                🎲 遊戲控制
                            </div>

                        </div>


                        <div class="turn-box">

                            <div class="turn-label">
                                目前回合
                            </div>

                            <div id="currentTurnPlayer"
                                 class="turn-player">
                                -
                            </div>

                        </div>


                        <div class="dice-result">

                            <div id="dice1"
                                 class="die">
                                -
                            </div>

                            <div class="dice-plus">
                                +
                            </div>

                            <div id="dice2"
                                 class="die">
                                -
                            </div>

                        </div>


                        <div id="diceTotal"
                             class="total">
                            尚未擲骰
                        </div>


                        <div class="action-area">

                            <button
                                id="rollDiceBtn"
                                class="btn btn-blue"
                                disabled>
                                🎲 擲骰
                            </button>

                            <button
                                id="buyPropertyBtn"
                                class="btn btn-primary"
                                disabled>
                                🏠 購買地產
                            </button>

                        </div>


                        <div id="gameMessage"
                             class="message">
                            -
                        </div>

                    </div>


                    <!-- PLAYERS -->

                    <div class="panel"
                         style="margin-top:20px;">

                        <div class="panel-header">

                            <div class="panel-title">
                                👥 玩家
                            </div>

                        </div>

                        <div id="sidePlayers"
                             style="padding:12px 20px 20px;">
                        </div>

                    </div>


                    <!-- EVENTS -->

                    <div class="panel"
                         style="margin-top:20px;">

                        <div class="panel-header">

                            <div class="panel-title">
                                📜 遊戲紀錄
                            </div>

                        </div>

                        <div id="events"
                             class="events">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- =====================
     MODAL
====================== -->

<div id="errorModal"
     class="modal">

    <div class="modal-card">

<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://aeqhrcdlmpqncddridaj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_mpr9262EO73p6B6KHBhc7A_l-TBVzPc";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   LOCAL PLAYER SESSION
========================================================= */

const STORAGE_KEY =
    "monopoly_supabase_player_v3";


let session = {
    roomId: null,
    gameId: null,
    playerId: null,
    roomCode: null,
    playerName: null
};


try {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {
        session = {
            ...session,
            ...JSON.parse(saved)
        };
    }

} catch (e) {

    console.warn(
        "localStorage unavailable",
        e
    );

}


/* =========================================================
   GAME STATE
========================================================= */

let gameState = {
    game: null,
    players: [],
    board: [],
    events: []
};

let realtimeChannel = null;

let pollTimer = null;

let isBusy = false;


/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   UI HELPERS
========================================================= */

function saveSession() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(session)
    );

}


function clearSession() {

    localStorage.removeItem(
        STORAGE_KEY
    );

    session = {
        roomId: null,
        gameId: null,
        playerId: null,
        roomCode: null,
        playerName: null
    };

}


function showScreen(name) {

    $("homeScreen")
        .classList.remove("active");

    $("roomScreen")
        .classList.remove("active");


    if (name === "home") {

        $("homeScreen")
            .classList.add("active");

    }

    if (name === "room") {

        $("roomScreen")
            .classList.add("active");

    }

}


function setLoading(
    active,
    text = "處理中..."
) {

    $("loadingText").textContent = text;

    $("loading")
        .classList.toggle(
            "active",
            active
        );

}


function setHomeMessage(
    text,
    type = ""
) {

    const el = $("homeMessage");

    el.textContent = text;

    el.className =
        "message" +
        (type ? " " + type : "");

}


function setGameMessage(
    text,
    type = ""
) {

    const el = $("gameMessage");

    el.textContent = text;

    el.className =
        "message" +
        (type ? " " + type : "");

}


function showError(error) {

    console.error(error);

    let message =
        error?.message ||
        error?.error_description ||
        String(error) ||
        "未知錯誤";

    $("modalText").textContent =
        message;

    $("errorModal")
        .classList.add("active");
}


function hideError() {

    $("errorModal")
        .classList.remove("active");

}


/* =========================================================
   CONNECTION STATUS
========================================================= */

function setConnectionStatus(
    state,
    text
) {

    const el =
        $("connection");

    el.classList.remove(
        "connected",
        "error"
    );

    if (state === "connected") {
        el.classList.add("connected");
    }

    if (state === "error") {
        el.classList.add("error");
    }

    $("connectionText")
        .textContent = text;
}


/* =========================================================
   SUPABASE CONNECTION TEST
========================================================= */

async function testSupabaseConnection() {

    setConnectionStatus(
        "loading",
        "Supabase 連線中..."
    );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("board_spaces")
                .select("position")
                .limit(1);

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                "Supabase 沒有回傳資料"
            );
        }

        setConnectionStatus(
            "connected",
            "Supabase 已連線"
        );

        setHomeMessage(
            "Supabase 已連線，可以建立或加入房間。",
            "success"
        );

        return true;

    } catch (error) {

        setConnectionStatus(
            "error",
            "Supabase 連線失敗"
        );

        setHomeMessage(
            "Supabase 連線失敗：" +
            (error.message || error),
            "error"
        );

        console.error(
            "Supabase connection test failed:",
            error
        );

        return false;
    }
}


/* =========================================================
   RPC HELPER
========================================================= */

async function rpc(
    functionName,
    params
) {

    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            functionName,
            params
        );

    if (error) {
        throw error;
    }

    return data;
}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom() {

    const name =
        $("playerName")
            .value
            .trim();

    const roomCode =
        $("roomCode")
            .value
            .trim()
            .toUpperCase();


    if (!name) {

        setHomeMessage(
            "請先輸入玩家名稱。",
            "error"
        );

        return;
    }


    if (!roomCode) {

        setHomeMessage(
            "請輸入房間代碼。",
            "error"
        );

        return;
    }


    if (isBusy) return;

    isBusy = true;

    setLoading(
        true,
        "正在建立房間..."
    );


    try {

        const result =
            await rpc(
                "create_room",
                {
                    p_room_code:
                        roomCode
                }
            );


        /*
         * create_room 只建立 room/game。
         * 所以建立後還要自己 join_room。
         */

        const joined =
            await rpc(
                "join_room",
                {
                    p_room_code:
                        roomCode,

                    p_name:
                        name
                }
            );


        session.roomId =
            result.room_id;

        session.gameId =
            result.game_id;

        session.playerId =
            joined.player_id;

        session.roomCode =
            result.room_code;

        session.playerName =
            joined.name;


        saveSession();


        $("playerName")
            .value = "";

        $("roomCode")
            .value = "";


        await enterRoom();

        setGameMessage(
            "房間建立成功，你已經加入遊戲。",
            "success"
        );


    } catch (error) {

        showError(error);

    } finally {

        isBusy = false;

        setLoading(false);
    }
}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom() {

    const name =
        $("playerName")
            .value
            .trim();

    const roomCode =
        $("roomCode")
            .value
            .trim()
            .toUpperCase();


    if (!name) {

        setHomeMessage(
            "請先輸入玩家名稱。",
            "error"
        );

        return;
    }


    if (!roomCode) {

        setHomeMessage(
            "請輸入房間代碼。",
            "error"
        );

        return;
    }


    if (isBusy) return;

    isBusy = true;

    setLoading(
        true,
        "正在加入房間..."
    );


    try {

        const result =
            await rpc(
                "join_room",
                {
                    p_room_code:
                        roomCode,

                    p_name:
                        name
                }
            );


        session.roomId =
            result.room_id;

        session.gameId =
            result.game_id;

        session.playerId =
            result.player_id;

        session.roomCode =
            roomCode;

        session.playerName =
            result.name;


        saveSession();


        $("playerName")
            .value = "";

        $("roomCode")
            .value = "";


        await enterRoom();

        setGameMessage(
            "成功加入房間。",
            "success"
        );


    } catch (error) {

        showError(error);

    } finally {

        isBusy = false;

        setLoading(false);
    }
}


/* =========================================================
   ENTER ROOM
========================================================= */

async function enterRoom() {

    showScreen("room");

    $("roomCodeDisplay")
        .textContent =
        session.roomCode || "-";


    await loadGameState();

    await loadEvents();

    setupRealtime();

    startPolling();
}


/* =========================================================
   LOAD GAME STATE
========================================================= */

async function loadGameState() {

    if (!session.gameId) {
        return;
    }


    try {

        const result =
            await rpc(
                "get_game_state",
                {
                    p_game_id:
                        session.gameId
                }
            );


        if (!result) {
            throw new Error(
                "get_game_state 沒有回傳資料"
            );
        }


        gameState.game =
            result.game || null;

        gameState.players =
            result.players || [];

        gameState.board =
            result.board || [];


        renderEverything();


    } catch (error) {

        console.error(
            "loadGameState:",
            error
        );

        setGameMessage(
            "讀取遊戲狀態失敗：" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents() {

    if (!session.gameId) {
        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("game_events")
                .select("*")
                .eq(
                    "game_id",
                    session.gameId
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(80);


        if (error) {
            throw error;
        }


        gameState.events =
            data || [];


        renderEvents();


    } catch (error) {

        console.error(
            "loadEvents:",
            error
        );
    }
}


/* =========================================================
   REALTIME
========================================================= */

function setupRealtime() {

    if (!session.gameId) {
        return;
    }


    if (realtimeChannel) {

        try {
            supabaseClient
                .removeChannel(
                    realtimeChannel
                );
        } catch (e) {
            console.warn(e);
        }

        realtimeChannel = null;
    }


    const channelName =
        "monopoly-game-" +
        session.gameId;


    realtimeChannel =
        supabaseClient
            .channel(channelName)


            /* GAME */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "games",
                    filter:
                        "id=eq." +
                        session.gameId
                },
                async payload => {

                    console.log(
                        "GAME CHANGE",
                        payload
                    );

                    await loadGameState();
                }
            )


            /* PLAYERS */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players",
                    filter:
                        "game_id=eq." +
                        session.gameId
                },
                async payload => {

                    console.log(
                        "PLAYER CHANGE",
                        payload
                    );

                    await loadGameState();
                }
            )


            /* EVENTS */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "game_events",
                    filter:
                        "game_id=eq." +
                        session.gameId
                },
                async payload => {

                    console.log(
                        "EVENT CHANGE",
                        payload
                    );

                    await loadEvents();

                    await loadGameState();
                }
            )


            /* ROOM */

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "rooms",
                    filter:
                        "id=eq." +
                        session.roomId
                },
                async payload => {

                    console.log(
                        "ROOM CHANGE",
                        payload
                    );

                    await loadGameState();
                }
            )


            .subscribe(
                status => {

                    console.log(
                        "Realtime status:",
                        status
                    );


                    if (
                        status ===
                        "SUBSCRIBED"
                    ) {

                        setConnectionStatus(
                            "connected",
                            "Supabase 已連線・即時同步"
                        );

                    }


                    if (
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        setConnectionStatus(
                            "error",
                            "Realtime 連線錯誤・使用自動同步"
                        );

                    }


                    if (
                        status ===
                        "TIMED_OUT"
                    ) {

                        setConnectionStatus(
                            "error",
                            "Realtime 逾時・使用自動同步"
                        );

                    }


                    if (
                        status ===
                        "CLOSED"
                    ) {

                        setConnectionStatus(
                            "error",
                            "Realtime 已關閉・使用自動同步"
                        );
                    }

                }
            );
}


/* =========================================================
   POLLING FALLBACK
========================================================= */

function startPolling() {

    stopPolling();


    /*
     * Realtime 是主要同步。
     *
     * 每 2 秒再抓一次 state，
     * 作為 fallback。
     *
     * 這樣即使手機瀏覽器暫時沒有收到
     * Realtime event，也不會卡在舊回合。
     */

    pollTimer =
        setInterval(
            async () => {

                if (!session.gameId) {
                    return;
                }

                await loadGameState();

                await loadEvents();

            },
            2000
        );
}


function stopPolling() {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );

        pollTimer = null;
    }
}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderEverything() {

    renderRoom();

    renderPlayers();

    renderBoard();

    renderGameControl();

    renderEvents();
}


/* =========================================================
   RENDER ROOM
========================================================= */

function renderRoom() {

    const game =
        gameState.game;

    const players =
        gameState.players;


    $("playerCount")
        .textContent =
        `${players.length} / 4`;


    if (!game) {

        $("roomStatusTitle")
            .textContent =
            "找不到遊戲";

        $("roomStatusDesc")
            .textContent =
            "請重新加入房間。";

        return;
    }


    if (
        game.status ===
        "waiting"
    ) {

        $("roomStatusTitle")
            .textContent =
            "等待開始遊戲";

        $("roomStatusDesc")
            .textContent =
            players.length >= 2
                ? "玩家已經足夠，可以開始遊戲。"
                : "至少建議 2 名玩家一起遊玩。";

        $("gameArea")
            .style.display =
            "none";


        $("startGameBtn")
            .disabled =
            players.length < 2;

    }


    if (
        game.status ===
        "playing"
    ) {

        $("roomStatusTitle")
            .textContent =
            "🎲 遊戲進行中";

        $("roomStatusDesc")
            .textContent =
            "目前回合由 Supabase 控制。";

        $("gameArea")
            .style.display =
            "block";


        $("startGameBtn")
            .disabled = true;
    }


    if (
        game.status ===
        "finished"
    ) {

        $("roomStatusTitle")
            .textContent =
            "🏆 遊戲結束";

        $("roomStatusDesc")
            .textContent =
            "本局遊戲已結束。";

        $("gameArea")
            .style.display =
            "block";


        $("startGameBtn")
            .disabled = true;
    }
}

/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard() {

    const board =
        gameState.board;

    const players =
        gameState.players;


    if (!board.length) {

        $("board").innerHTML =
            `<div style="
                grid-column:1/-1;
                padding:30px;
                text-align:center;
                color:#8c9bad;
            ">
                尚未載入棋盤。
            </div>`;

        return;
    }


    /*
     * 由 game_events 判斷地產所有權。
     *
     * 因為目前 SQL 沒有 property_ownership table。
     */

    const owners =
        getPropertyOwners();


    $("board").innerHTML =
        board
            .map(
                space => {

                    const playersHere =
                        players.filter(
                            player =>
                                player.position ===
                                space.position
                        );


                    const owner =
                        owners[space.position];


                    const colorClass =
                        space.color_group
                            ? "color-" +
                              space.color_group
                            : "";


                    const special =
                        space.type !==
                        "property";


                    const currentHere =
                        playersHere.some(
                            p =>
                                p.id ===
                                session.playerId
                        );


                    return `
                    <div class="
                        space
                        ${special ? "space-special" : ""}
                        ${currentHere ? "space-current" : ""}
                    ">

                        <div class="
                            space-color
                            ${colorClass}
                        "></div>


                        <div class="space-name">
                            ${escapeHtml(space.name)}
                        </div>


                        ${
                            space.city
                                ? `
                                <div class="space-city">
                                    ${escapeHtml(space.city)}
                                </div>
                                `
                                : ""
                        }


                        ${
                            space.price > 0
                                ? `
                                <div class="space-price">
                                    £${space.price}
                                </div>
                                `
                                : ""
                        }


                        ${
                            owner
                                ? `
                                <div class="space-owner">
                                    🏠 ${escapeHtml(owner.name)}
                                </div>
                                `
                                : ""
                        }


                        ${
                            playersHere.length
                                ? `
                                <div class="tokens">

                                    ${
                                        playersHere
                                            .map(
                                                p => `
                                                <div
                                                    class="token"
                                                    title="${escapeAttr(p.name)}"
                                                >
                                                    ${p.player_number}
                                                </div>
                                                `
                                            )
                                            .join("")
                                    }

                                </div>
                                `
                                : ""
                        }

                    </div>
                    `;
                }
            )
            .join("");
}


/* =========================================================
   PROPERTY OWNERS
========================================================= */

function getPropertyOwners() {

    const owners = {};


    /*
     * property_purchase data:
     *
     * {
     *    position,
     *    property,
     *    price
     * }
     */


    for (
        let i =
            gameState.events.length - 1;
        i >= 0;
        i--
    ) {

        const event =
            gameState.events[i];


        if (
            event.event_type !==
            "property_purchase"
        ) {
            continue;
        }


        const position =
            Number(
                event.data?.position
            );


        if (
            Number.isNaN(position)
        ) {
            continue;
        }


        if (
            owners[position]
        ) {
            continue;
        }


        const player =
            gameState.players.find(
                p =>
                    p.id ===
                    event.player_id
            );


        if (player) {

            owners[position] =
                player;
        }
    }


    return owners;
}


/* =========================================================
   RENDER GAME CONTROL
========================================================= */

function renderGameControl() {

    const game =
        gameState.game;


    if (!game) {
        return;
    }


    $("turnNumberLabel")
        .textContent =
        "回合 " +
        (game.turn_number || 0);


    const currentPlayer =
        gameState.players.find(
            p =>
                p.id ===
                game.current_player_id
        );


    $("currentTurnPlayer")
        .textContent =
        currentPlayer
            ? currentPlayer.name
            : "-";


    $("dice1")
        .textContent =
        game.dice_1 || "-";


    $("dice2")
        .textContent =
        game.dice_2 || "-";


    if (
        game.dice_1 &&
        game.dice_2
    ) {

        $("diceTotal")
            .textContent =
            "本回合：" +
            (game.dice_1 +
             game.dice_2);

    } else {

        $("diceTotal")
            .textContent =
            "尚未擲骰";
    }


    const isMyTurn =
        game.current_player_id ===
        session.playerId;


    const isPlaying =
        game.status ===
        "playing";


    $("rollDiceBtn")
        .disabled =
        !isPlaying ||
        !isMyTurn ||
        isBusy;


    /*
     * 注意：
     *
     * 目前 SQL 的 roll_dice()
     * 會在骰完後立即切換
     * current_player_id。
     *
     * 所以這裡不假裝可以成功購買。
     */

    $("buyPropertyBtn")
        .disabled = true;
}


/* =========================================================
   RENDER EVENTS
========================================================= */

function renderEvents() {

    const events =
        gameState.events;


    if (!events.length) {

        $("events").innerHTML =
            `
            <div
                style="
                    padding:15px 0;
                    color:#738398;
                "
            >
                尚無遊戲紀錄。
            </div>
            `;

        return;
    }


    $("events").innerHTML =
        events
            .map(
                event => {

                    const date =
                        new Date(
                            event.created_at
                        );


                    const time =
                        date.toLocaleTimeString(
                            "zh-Hant",
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );


                    return `
                    <div class="event">

                        <span class="event-time">
                            ${time}
                        </span>

                        ${escapeHtml(
                            event.message ||
                            event.event_type
                        )}

                    </div>
                    `;
                }
            )
            .join("");
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    if (!session.gameId) {
        return;
    }


    if (isBusy) {
        return;
    }


    isBusy = true;

    setLoading(
        true,
        "正在開始遊戲..."
    );


    try {

        await rpc(
            "start_game",
            {
                p_game_id:
                    session.gameId
            }
        );


        await loadGameState();

        setGameMessage(
            "遊戲開始！輪到目前顯示的玩家。",
            "success"
        );


    } catch (error) {

        showError(error);

    } finally {

        isBusy = false;

        setLoading(false);

        renderGameControl();
    }
}


/* =========================================================
   ROLL DICE
========================================================= */

async function rollDice() {

    if (!session.gameId ||
        !session.playerId) {

        return;
    }


    const game =
        gameState.game;


    if (!game) {
        return;
    }


    if (
        game.current_player_id !==
        session.playerId
    ) {

        setGameMessage(
            "現在不是你的回合。",
            "error"
        );

        return;
    }


    if (
        game.status !==
        "playing"
    ) {

        setGameMessage(
            "遊戲尚未開始。",
            "error"
        );

        return;
    }


    if (isBusy) {
        return;
    }


    isBusy = true;

    $("rollDiceBtn")
        .disabled = true;


    setLoading(
        true,
        "🎲 擲骰中..."
    );


    try {

        const result =
            await rpc(
                "roll_dice",
                {
                    p_game_id:
                        session.gameId,

                    p_player_id:
                        session.playerId
                }
            );


        console.log(
            "ROLL RESULT",
            result
        );


        if (result) {

            $("dice1")
                .textContent =
                result.dice1;

            $("dice2")
                .textContent =
                result.dice2;

            $("diceTotal")
                .textContent =
                "本次擲出 " +
                result.total;
        }


        /*
         * 重要：
         *
         * SQL 已經在 roll_dice()
         * 裡面切換下一位。
         *
         * 所以這裡重新讀取 DB，
         * 不自行修改 current_player。
         */

        await loadGameState();

        await loadEvents();


        setGameMessage(
            `你擲出了 ${result.dice1} + ${result.dice2} = ${result.total}。` +
            ` 已經同步到其他玩家。`,
            "success"
        );


    } catch (error) {

        console.error(
            "rollDice:",
            error
        );


        setGameMessage(
            error.message ||
            "擲骰失敗",
            "error"
        );

    } finally {

        isBusy = false;

        setLoading(false);

        renderGameControl();
    }
}


/* =========================================================
   BUY PROPERTY
========================================================= */

async function buyProperty() {

    /*
     * 保留這個 function，
     * 因為你的 SQL 有 buy_property RPC。
     *
     * 但目前 SQL 的 roll_dice()
     * 在擲骰後已經切換 current_player_id。
     *
     * 所以正常流程下，
     * buy_property() 會被 DB 拒絕。
     *
     * 等你把 roll_dice SQL 改成
     * "購買/結束回合後才換玩家"，
     * 這裡即可直接啟用。
     */


    if (!session.gameId ||
        !session.playerId) {

        return;
    }


    try {

        const result =
            await rpc(
                "buy_property",
                {
                    p_game_id:
                        session.gameId,

                    p_player_id:
                        session.playerId
                }
            );


        await loadGameState();

        await loadEvents();


        setGameMessage(
            `成功購買 ${result.property}，花費 £${result.price}。`,
            "success"
        );


    } catch (error) {

        setGameMessage(
            error.message ||
            "購買地產失敗",
            "error"
        );
    }
}


/* =========================================================
   COPY ROOM
========================================================= */

async function copyRoomCode() {

    const code =
        session.roomCode;


    if (!code) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            code
        );

        setGameMessage(
            "房間代碼已複製：" +
            code,
            "success"
        );

    } catch (error) {

        setGameMessage(
            "複製失敗，房間代碼是：" +
            code,
            "error"
        );
    }
}


/* =========================================================
   LEAVE ROOM
========================================================= */

function leaveRoom() {

    stopPolling();


    if (realtimeChannel) {

        try {

            supabaseClient
                .removeChannel(
                    realtimeChannel
                );

        } catch (error) {

            console.warn(error);
        }

        realtimeChannel = null;
    }


    clearSession();


    gameState = {
        game: null,
        players: [],
        board: [],
        events: []
    };


    showScreen("home");


    setHomeMessage(
        "你已離開目前房間。",
        ""
    );
}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession() {

    if (
        !session.gameId ||
        !session.playerId
    ) {

        return false;
    }


    try {

        setLoading(
            true,
            "正在恢復遊戲..."
        );


        const result =
            await rpc(
                "get_game_state",
                {
                    p_game_id:
                        session.gameId
                }
            );


        if (!result ||
            !result.game) {

            throw new Error(
                "找不到這個遊戲"
            );
        }


        const playerExists =
            (result.players || [])
                .some(
                    p =>
                        p.id ===
                        session.playerId
                );


        if (!playerExists) {

            throw new Error(
                "這個玩家已不存在"
            );
        }


        gameState.game =
            result.game;

        gameState.players =
            result.players || [];

        gameState.board =
            result.board || [];


        $("roomCodeDisplay")
            .textContent =
            session.roomCode || "-";


        showScreen("room");


        await loadEvents();

        setupRealtime();

        startPolling();

        renderEverything();


        return true;


    } catch (error) {

        console.warn(
            "Unable to restore session:",
            error
        );


        clearSession();

        return false;


    } finally {

        setLoading(false);
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttr(value) {

    return escapeHtml(value);
}


/* =========================================================
   EVENTS
========================================================= */

$("createRoomBtn")
    .addEventListener(
        "click",
        createRoom
    );


$("joinRoomBtn")
    .addEventListener(
        "click",
        joinRoom
    );


$("startGameBtn")
    .addEventListener(
        "click",
        startGame
    );


$("rollDiceBtn")
    .addEventListener(
        "click",
        rollDice
    );


$("buyPropertyBtn")
    .addEventListener(
        "click",
        buyProperty
    );


$("copyRoomBtn")
    .addEventListener(
        "click",
        copyRoomCode
    );


$("leaveRoomBtn")
    .addEventListener(
        "click",
        leaveRoom
    );


$("modalCloseBtn")
    .addEventListener(
        "click",
        hideError
    );


$("modalReloadBtn")
    .addEventListener(
        "click",
        () => location.reload()
    );


$("roomCode")
    .addEventListener(
        "input",
        event => {

            event.target.value =
                event.target.value
                    .toUpperCase();
        }
    );


$("playerName")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                $("joinRoomBtn")
                    .click();
            }
        }
    );


$("roomCode")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                $("joinRoomBtn")
                    .click();
            }
        }
    );


/* =========================================================
   INIT
========================================================= */

async function init() {

    /*
     * 先測試 Supabase。
     */

    const connected =
        await testSupabaseConnection();


    if (!connected) {
        return;
    }


    /*
     * 如果這個瀏覽器之前已經加入過房間，
     * 自動恢復。
     */

    if (
        session.gameId &&
        session.playerId
    ) {

        const restored =
            await restoreSession();


        if (restored) {

            setGameMessage(
                "已恢復上一個遊戲。",
                "success"
            );

            return;
        }
    }


    showScreen("home");
}


init();


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        /*
         * 不刪 localStorage。
         *
         * 這樣重新整理後可以恢復玩家身份。
         */

        stopPolling();
    }
);

</script>
