<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOPOLY UK - Supabase</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at top, #23395d 0%, #111827 55%, #070b12 100%);
    color: #fff;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.container {
    width: min(1400px, 96%);
    margin: 0 auto;
    padding: 20px 0 40px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    color: #aebbd0;
    font-size: 13px;
}

.connection {
    padding: 8px 12px;
    border-radius: 999px;
    background: #263244;
    font-size: 12px;
}

.connection.ok {
    background: #14532d;
    color: #bbf7d0;
}

.connection.error {
    background: #7f1d1d;
    color: #fecaca;
}

/* =========================================================
   LOGIN / ROOM
========================================================= */

.panel {
    background: rgba(17, 24, 39, .92);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.room-panel {
    width: min(520px, 100%);
    margin: 50px auto;
}

.room-panel h1 {
    margin-top: 0;
    font-size: 30px;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: #aebbd0;
    font-size: 13px;
}

.field input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #3a4659;
    background: #0f172a;
    color: white;
    outline: none;
}

.field input:focus {
    border-color: #60a5fa;
}

.primary-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    font-weight: 800;
    margin-top: 5px;
}

.primary-btn:hover {
    filter: brightness(1.08);
}

.primary-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.secondary-btn {
    padding: 10px 14px;
    border: 1px solid #475569;
    border-radius: 9px;
    background: #1e293b;
    color: white;
}

.status-message {
    min-height: 22px;
    margin-top: 14px;
    color: #fbbf24;
    font-size: 14px;
}

/* =========================================================
   GAME
========================================================= */

.game-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 18px;
    align-items: start;
}

.board-wrapper {
    background: rgba(15, 23, 42, .94);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 15px;
    overflow: auto;
}

.board {
    width: min(850px, 100%);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    grid-template-rows: repeat(11, 1fr);
    background: #e8e1cc;
    border: 5px solid #171717;
    color: #111;
}

.space {
    position: relative;
    border: 1px solid #888;
    background: #f7f3e8;
    overflow: hidden;
    min-width: 0;
}

.space.center {
    grid-column: 2 / 11;
    grid-row: 2 / 11;
    background:
        radial-gradient(circle, #fff 0%, #e8e1cc 75%);
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.center-logo {
    font-size: clamp(22px, 4vw, 55px);
    font-weight: 1000;
    color: #b91c1c;
    transform: rotate(-10deg);
    text-shadow: 2px 2px 0 #111;
    letter-spacing: 3px;
}

.space-name {
    font-size: clamp(6px, .85vw, 12px);
    font-weight: 800;
    text-align: center;
    padding: 3px;
    line-height: 1.05;
}

.property-color {
    height: 18%;
    width: 100%;
    border-bottom: 1px solid #555;
}

.color-brown { background: #955436; }
.color-light_blue { background: #aae0fa; }
.color-pink { background: #d93a96; }
.color-orange { background: #f7941d; }
.color-red { background: #ed1b24; }
.color-yellow { background: #fef200; }
.color-green { background: #1fb25a; }
.color-dark_blue { background: #0072bb; }

.space-price {
    text-align: center;
    font-size: clamp(6px, .7vw, 10px);
    margin-top: 2px;
}

.tokens {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 3px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px;
}

.token {
    width: clamp(12px, 1.5vw, 23px);
    height: clamp(12px, 1.5vw, 23px);
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: clamp(6px, .7vw, 10px);
    font-weight: 900;
}

.token-1 { background: #2563eb; }
.token-2 { background: #dc2626; }
.token-3 { background: #16a34a; }
.token-4 { background: #f59e0b; }

.owner-badge {
    position: absolute;
    right: 2px;
    top: 2px;
    font-size: 8px;
    font-weight: 900;
    background: #111;
    color: white;
    border-radius: 3px;
    padding: 2px 3px;
}

.space-active {
    box-shadow: inset 0 0 0 3px #2563eb;
}

/* =========================================================
   SIDE PANEL
========================================================= */

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card {
    background: rgba(17, 24, 39, .94);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 16px;
}

.card h2,
.card h3 {
    margin: 0 0 12px;
}

.current-turn {
    border: 2px solid #f59e0b;
    background: rgba(120, 53, 15, .35);
}

.turn-name {
    font-size: 22px;
    font-weight: 900;
}

.turn-sub {
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 4px;
}

.dice-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 15px 0;
}

.die {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    background: white;
    color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    font-weight: 900;
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

.dice-total {
    text-align: center;
    color: #cbd5e1;
    font-size: 13px;
}

.roll-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(135deg, #059669, #10b981);
    color: white;
    font-weight: 900;
    font-size: 17px;
}

.roll-btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.buy-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #d97706, #f59e0b);
    color: white;
    font-weight: 900;
}

.players {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    background: #172033;
    border: 1px solid transparent;
}

.player-row.me {
    border-color: #60a5fa;
}

.player-row.turn {
    background: #3b2a12;
    border-color: #f59e0b;
}

.player-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex: 0 0 auto;
}

.player-info {
    flex: 1;
    min-width: 0;
}

.player-name {
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-meta {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 2px;
}

.money {
    font-weight: 900;
    color: #86efac;
}

.log {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.log-item {
    font-size: 12px;
    line-height: 1.4;
    padding: 7px 8px;
    border-radius: 7px;
    background: #111827;
    color: #cbd5e1;
}

.my-id {
    font-size: 11px;
    color: #64748b;
    word-break: break-all;
    margin-top: 8px;
}

.notice {
    padding: 10px;
    border-radius: 9px;
    background: #172033;
    color: #cbd5e1;
    font-size: 13px;
    line-height: 1.5;
}

.notice.success {
    background: #052e1b;
    color: #bbf7d0;
}

.notice.error {
    background: #450a0a;
    color: #fecaca;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {
    .game-layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .sidebar .card:first-child {
        grid-column: 1 / -1;
    }
}

@media (max-width: 650px) {
    .container {
        padding-top: 10px;
    }

    .logo {
        font-size: 22px;
    }

    .sidebar {
        display: flex;
    }

    .board-wrapper {
        padding: 7px;
    }

    .board {
        min-width: 600px;
    }

    .board-wrapper {
        overflow-x: auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">
        <div>
            <div class="logo">MONOPOLY UK</div>
            <div class="subtitle">Supabase Multiplayer Edition</div>
        </div>

        <div id="connectionStatus" class="connection">
            連線中...
        </div>
    </div>


    <!-- =====================================================
         ROOM SCREEN
    ====================================================== -->

    <section id="roomScreen" class="panel room-panel">

        <h1>🎲 加入遊戲</h1>

        <div class="field">
            <label>房間代碼</label>
            <input
                id="roomCode"
                type="text"
                maxlength="20"
                placeholder="例如 ABC123"
                autocomplete="off"
            >
        </div>

        <div class="field">
            <label>玩家名稱</label>
            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="輸入你的名字"
                autocomplete="off"
            >
        </div>

        <button id="joinBtn" class="primary-btn">
            加入房間
        </button>

        <div id="roomMessage" class="status-message"></div>

    </section>


    <!-- =====================================================
         GAME SCREEN
    ====================================================== -->

    <section id="gameScreen" class="hidden">

        <div class="game-layout">

            <!-- BOARD -->
            <div class="board-wrapper">
                <div id="board" class="board">
                    <div class="space center">
                        <div class="center-logo">
                            MONOPOLY
                        </div>
                    </div>
                </div>
            </div>


            <!-- SIDEBAR -->
            <div class="sidebar">

                <!-- TURN -->
                <div class="card current-turn">

                    <h3>目前回合</h3>

                    <div id="turnName" class="turn-name">
                        -
                    </div>

                    <div id="turnSub" class="turn-sub">
                        等待遊戲...
                    </div>

                    <div class="dice-area">
                        <div id="die1" class="die">?</div>
                        <div id="die2" class="die">?</div>
                    </div>

                    <div id="diceTotal" class="dice-total">
                        尚未擲骰
                    </div>

                    <button id="rollBtn" class="roll-btn" disabled>
                        🎲 擲骰
                    </button>

                    <button id="buyBtn" class="buy-btn hidden">
                        💷 購買地產
                    </button>

                </div>


                <!-- PLAYERS -->
                <div class="card">

                    <h3>👥 玩家</h3>

                    <div id="playersList" class="players"></div>

                    <div id="myId" class="my-id"></div>

                </div>


                <!-- SPACE -->
                <div class="card">

                    <h3>📍 目前位置</h3>

                    <div id="spaceInfo" class="notice">
                        等待遊戲...
                    </div>

                </div>


                <!-- LOG -->
                <div class="card">

                    <h3>📜 遊戲紀錄</h3>

                    <div id="eventLog" class="log"></div>

                </div>

            </div>

        </div>

    </section>

</div>


<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://aeqhrcdlmpqncddridaj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_mpr9262EO73p6B6KHBhc7A_l-TBVzPc";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL STATE
========================================================= */

let roomId = null;
let gameId = null;
let playerId = null;

let gameState = null;
let players = [];
let boardSpaces = [];
let events = [];

let realtimeChannel = null;

let lastDiceEventId = null;
let lastStateSignature = "";


/* =========================================================
   DOM
========================================================= */

const roomScreen =
    document.getElementById("roomScreen");

const gameScreen =
    document.getElementById("gameScreen");

const roomCodeInput =
    document.getElementById("roomCode");

const playerNameInput =
    document.getElementById("playerName");

const joinBtn =
    document.getElementById("joinBtn");

const roomMessage =
    document.getElementById("roomMessage");

const connectionStatus =
    document.getElementById("connectionStatus");

const board =
    document.getElementById("board");

const turnName =
    document.getElementById("turnName");

const turnSub =
    document.getElementById("turnSub");

const die1 =
    document.getElementById("die1");

const die2 =
    document.getElementById("die2");

const diceTotal =
    document.getElementById("diceTotal");

const rollBtn =
    document.getElementById("rollBtn");

const buyBtn =
    document.getElementById("buyBtn");

const playersList =
    document.getElementById("playersList");

const spaceInfo =
    document.getElementById("spaceInfo");

const eventLog =
    document.getElementById("eventLog");

const myId =
    document.getElementById("myId");


/* =========================================================
   CONNECTION STATUS
========================================================= */

function setConnection(text, type = "") {

    connectionStatus.textContent = text;

    connectionStatus.className =
        "connection " + type;
}


/* =========================================================
   MESSAGE
========================================================= */

function showRoomMessage(message, error = false) {

    roomMessage.textContent = message;

    roomMessage.style.color =
        error ? "#fca5a5" : "#fbbf24";
}


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "monopoly_supabase_player_v2";


function saveSession() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            roomId,
            gameId,
            playerId,
            roomCode: roomCodeInput.value.trim().toUpperCase(),
            playerName: playerNameInput.value.trim()
        })
    );
}


function loadSession() {

    try {

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if (!raw) return null;

        return JSON.parse(raw);

    } catch {

        return null;

    }
}


/* =========================================================
   JOIN ROOM
========================================================= */

joinBtn.addEventListener("click", joinRoom);

roomCodeInput.addEventListener("keydown", e => {

    if (e.key === "Enter") {
        joinRoom();
    }

});

playerNameInput.addEventListener("keydown", e => {

    if (e.key === "Enter") {
        joinRoom();
    }

});


async function joinRoom() {

    const roomCode =
        roomCodeInput.value.trim().toUpperCase();

    const name =
        playerNameInput.value.trim();

    if (!roomCode) {

        showRoomMessage(
            "請輸入房間代碼",
            true
        );

        return;
    }

    if (!name) {

        showRoomMessage(
            "請輸入玩家名稱",
            true
        );

        return;
    }

    joinBtn.disabled = true;

    showRoomMessage("加入房間中...");

    try {

        /*
         * 重要：
         *
         * 如果 localStorage 裡已經有這個房間的 player_id，
         * 不要再次 join。
         *
         * 否則重新整理會產生第二個玩家。
         */

        const saved = loadSession();

        if (
            saved &&
            saved.roomCode === roomCode &&
            saved.playerId
        ) {

            const { data: existingPlayer, error } =
                await supabaseClient
                    .from("players")
                    .select(`
                        id,
                        room_id,
                        game_id,
                        name,
                        player_number,
                        position,
                        money,
                        is_in_jail,
                        jail_turns,
                        is_bankrupt
                    `)
                    .eq("id", saved.playerId)
                    .maybeSingle();

            if (
                !error &&
                existingPlayer
            ) {

                roomId = existingPlayer.room_id;
                gameId = existingPlayer.game_id;
                playerId = existingPlayer.id;

                playerNameInput.value =
                    existingPlayer.name;

                await enterGame();

                return;
            }
        }


        /*
         * 新玩家
         */

        const { data, error } =
            await supabaseClient.rpc(
                "join_room",
                {
                    p_room_code: roomCode,
                    p_name: name
                }
            );

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error("Supabase 沒有返回玩家資料");
        }

        roomId = data.room_id;
        gameId = data.game_id;
        playerId = data.player_id;

        saveSession();

        await enterGame();

    } catch (err) {

        console.error(err);

        showRoomMessage(
            err.message || "加入房間失敗",
            true
        );

        joinBtn.disabled = false;
    }
}


/* =========================================================
   ENTER GAME
========================================================= */

async function enterGame() {

    roomScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    myId.textContent =
        "你的 Player ID：" + playerId;

    setConnection(
        "Supabase 已連線",
        "ok"
    );

    await loadGameState();

    subscribeRealtime();

    /*
     * 重要：
     *
     * Realtime 是即時同步，
     * polling 是保險。
     *
     * 即使某些瀏覽器 Realtime 沒收到，
     * 每 1 秒還是會取得最新 current_player_id。
     */

    startPolling();
}


/* =========================================================
   LOAD GAME STATE
========================================================= */

async function loadGameState() {

    if (!gameId) return;

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "get_game_state",
                {
                    p_game_id: gameId
                }
            );

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error("沒有取得遊戲狀態");
        }

        gameState =
            data.game;

        players =
            Array.isArray(data.players)
                ? data.players
                : [];

        boardSpaces =
            Array.isArray(data.board)
                ? data.board
                : [];

        await loadEvents();

        renderAll();

        setConnection(
            "即時連線",
            "ok"
        );

    } catch (err) {

        console.error(
            "loadGameState:",
            err
        );

        setConnection(
            "同步失敗",
            "error"
        );
    }
}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents() {

    if (!gameId) return;

    const { data, error } =
        await supabaseClient
            .from("game_events")
            .select("*")
            .eq("game_id", gameId)
            .order("created_at", {
                ascending: false
            })
            .limit(30);

    if (error) {

        console.error(
            "loadEvents:",
            error
        );

        return;
    }

    events =
        data || [];
}


/* =========================================================
   POLLING
========================================================= */

let pollingTimer = null;


function startPolling() {

    if (pollingTimer) {
        clearInterval(pollingTimer);
    }

    pollingTimer =
        setInterval(
            async () => {

                if (!gameId) return;

                await loadGameState();

            },
            1000
        );
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }

    realtimeChannel =
        supabaseClient
            .channel(
                "monopoly-game-" + gameId
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "games",
                    filter:
                        "id=eq." + gameId
                },
                async () => {

                    await loadGameState();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players",
                    filter:
                        "game_id=eq." + gameId
                },
                async () => {

                    await loadGameState();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "game_events",
                    filter:
                        "game_id=eq." + gameId
                },
                async () => {

                    await loadGameState();

                }
            )

            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );
}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

    if (!gameState) return;

    renderPlayers();

    renderTurn();

    renderBoard();

    renderSpaceInfo();

    renderEvents();

}


/* =========================================================
   FIND PLAYER
========================================================= */

function getMe() {

    return players.find(
        p => p.id === playerId
    );
}


function getCurrentPlayer() {

    return players.find(
        p =>
            p.id ===
            gameState.current_player_id
    );
}


/* =========================================================
   TURN
========================================================= */

function renderTurn() {

    const current =
        getCurrentPlayer();

    const me =
        getMe();

    if (!current) {

        turnName.textContent =
            "等待玩家";

        turnSub.textContent =
            "尚未設定回合";

        rollBtn.disabled = true;

        return;
    }

    turnName.textContent =
        current.name;

    const isMyTurn =
        current.id === playerId;

    if (isMyTurn) {

        turnSub.textContent =
            "🎯 現在是你的回合";

        rollBtn.disabled =
            gameState.status !== "playing";

    } else {

        turnSub.textContent =
            "⏳ 等待 " +
            current.name +
            " 擲骰";

        rollBtn.disabled = true;
    }

    /*
     * 如果遊戲不是 playing，
     * 不允許擲骰。
     */

    if (
        gameState.status !== "playing"
    ) {

        rollBtn.disabled = true;

        if (
            gameState.status === "waiting"
        ) {

            turnSub.textContent =
                "等待遊戲開始";

        } else if (
            gameState.status === "finished"
        ) {

            turnSub.textContent =
                "遊戲已結束";
        }
    }

    /*
     * 顯示最後一次骰子
     */

    if (
        gameState.dice_1 !== null &&
        gameState.dice_1 !== undefined
    ) {

        die1.textContent =
            gameState.dice_1;

        die2.textContent =
            gameState.dice_2;

        diceTotal.textContent =
            "點數：" +
            (
                Number(gameState.dice_1) +
                Number(gameState.dice_2)
            );

    } else {

        die1.textContent = "?";
        die2.textContent = "?";
        diceTotal.textContent =
            "尚未擲骰";
    }

    /*
     * 判斷目前玩家是否可以購買地產
     */

    buyBtn.classList.add(
        "hidden"
    );

    if (
        me &&
        isMyTurn &&
        gameState.status === "playing"
    ) {

        const space =
            boardSpaces.find(
                s =>
                    Number(s.position) ===
                    Number(me.position)
            );

        if (
            space &&
            space.type === "property" &&
            Number(me.money) >= Number(space.price)
        ) {

            const owner =
                getPropertyOwner(
                    Number(space.position)
                );

            if (!owner) {

                buyBtn.classList.remove(
                    "hidden"
                );
            }
        }
    }
}


/* =========================================================
   PLAYERS
========================================================= */

function renderPlayers() {

    playersList.innerHTML = "";

    const sorted =
        [...players].sort(
            (a, b) =>
                a.player_number -
                b.player_number
        );

    for (const p of sorted) {

        const row =
            document.createElement("div");

        row.className =
            "player-row";

        if (
            p.id === playerId
        ) {
            row.classList.add("me");
        }

        if (
            gameState &&
            p.id ===
            gameState.current_player_id
        ) {
            row.classList.add("turn");
        }

        const icon =
            document.createElement("div");

        icon.className =
            "player-icon token-" +
            p.player_number;

        const info =
            document.createElement("div");

        info.className =
            "player-info";

        const name =
            document.createElement("div");

        name.className =
            "player-name";

        name.textContent =
            p.name +
            (
                p.id === playerId
                    ? "（你）"
                    : ""
            );

        const meta =
            document.createElement("div");

        meta.className =
            "player-meta";

        meta.textContent =
            "#" +
            p.player_number +
            " · 位置 " +
            p.position;

        const money =
            document.createElement("div");

        money.className =
            "money";

        money.textContent =
            "£" +
            Number(p.money).toLocaleString();

        info.appendChild(name);
        info.appendChild(meta);

        row.appendChild(icon);
        row.appendChild(info);
        row.appendChild(money);

        playersList.appendChild(row);
    }
}


/* =========================================================
   PROPERTY OWNERSHIP
========================================================= */

function getPropertyOwner(position) {

    const purchaseEvents =
        events.filter(
            e =>
                e.event_type ===
                "property_purchase"
        );

    /*
     * SQL 沒有 property_ownership table，
     * 所以依 game_events 判斷所有權。
     *
     * 最新一筆購買事件就是擁有人。
     */

    for (const event of purchaseEvents) {

        const eventPosition =
            Number(
                event.data?.position
            );

        if (
            eventPosition ===
            Number(position)
        ) {

            return players.find(
                p =>
                    p.id ===
                    event.player_id
            ) || {
                id: event.player_id,
                name: "其他玩家"
            };
        }
    }

    return null;
}


/* =========================================================
   BOARD
========================================================= */

function renderBoard() {

    /*
     * 保留中央 MONOPOLY
     */

    board.innerHTML = `
        <div class="space center">
            <div class="center-logo">
                MONOPOLY
            </div>
        </div>
    `;

    /*
     * Monopoly 40 格放在外圈。
     *
     * 使用 11x11：
     *
     * 0  = 左下角
     * 10 = 左上角
     * 20 = 右上角
     * 30 = 右下角
     */

    const positions =
        getBoardGridPositions();

    for (
        const space of boardSpaces
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "space";

        const grid =
            positions[
                Number(space.position)
            ];

        if (!grid) continue;

        cell.style.gridColumn =
            grid.col;

        cell.style.gridRow =
            grid.row;

        if (
            gameState &&
            players.some(
                p =>
                    Number(p.position) ===
                    Number(space.position)
            )
        ) {

            cell.classList.add(
                "space-active"
            );
        }

        if (
            space.type === "property"
        ) {

            const color =
                document.createElement("div");

            color.className =
                "property-color " +
                (
                    space.color_group
                        ? "color-" +
                          space.color_group
                        : ""
                );

            cell.appendChild(color);
        }

        const name =
            document.createElement("div");

        name.className =
            "space-name";

        name.textContent =
            space.name;

        cell.appendChild(name);

        if (
            space.price &&
            Number(space.price) > 0
        ) {

            const price =
                document.createElement("div");

            price.className =
                "space-price";

            price.textContent =
                "£" +
                Number(
                    space.price
                ).toLocaleString();

            cell.appendChild(price);
        }

        /*
         * Owner
         */

        if (
            space.type === "property"
        ) {

            const owner =
                getPropertyOwner(
                    Number(space.position)
                );

            if (owner) {

                const badge =
                    document.createElement("div");

                badge.className =
                    "owner-badge";

                badge.textContent =
                    owner.name
                        .slice(0, 5);

                cell.appendChild(
                    badge
                );
            }
        }

        /*
         * 玩家棋子
         */

        const tokens =
            document.createElement("div");

        tokens.className =
            "tokens";

        const occupying =
            players.filter(
                p =>
                    !p.is_bankrupt &&
                    Number(p.position) ===
                    Number(space.position)
            );

        for (
            const p of occupying
        ) {

            const token =
                document.createElement("div");

            token.className =
                "token token-" +
                p.player_number;

            token.textContent =
                p.player_number;

            token.title =
                p.name;

            tokens.appendChild(
                token
            );
        }

        cell.appendChild(tokens);

        board.appendChild(cell);
    }
}


/* =========================================================
   BOARD GRID
========================================================= */

function getBoardGridPositions() {

    const map = {};

    /*
     * 底部：0 → 10
     */

    for (
        let pos = 0;
        pos <= 10;
        pos++
    ) {

        map[pos] = {
            col: String(11 - pos),
            row: "11"
        };
    }

    /*
     * 左側：11 → 20
     */

    for (
        let pos = 11;
        pos <= 20;
        pos++
    ) {

        map[pos] = {
            col: "1",
            row: String(11 - (pos - 10))
        };
    }

    /*
     * 上方：21 → 30
     */

    for (
        let pos = 21;
        pos <= 30;
        pos++
    ) {

        map[pos] = {
            col: String(pos - 20),
            row: "1"
        };
    }

    /*
     * 右側：31 → 39
     */

    for (
        let pos = 31;
        pos <= 39;
        pos++
    ) {

        map[pos] = {
            col: "11",
            row: String(pos - 30 + 1)
        };
    }

    return map;
}


/* =========================================================
   SPACE INFO
========================================================= */

function renderSpaceInfo() {

    const me =
        getMe();

    if (!me) {

        spaceInfo.textContent =
            "找不到你的玩家資料";

        return;
    }

    const space =
        boardSpaces.find(
            s =>
                Number(s.position) ===
                Number(me.position)
        );

    if (!space) {

        spaceInfo.textContent =
            "位置 " +
            me.position;

        return;
    }

    let html =
        `<strong>${escapeHtml(space.name)}</strong><br>`;

    html +=
        "類型：" +
        escapeHtml(space.type) +
        "<br>";

    if (
        Number(space.price) > 0
    ) {

        html +=
            "價格：£" +
            Number(
                space.price
            ).toLocaleString() +
            "<br>";
    }

    if (
        Number(space.rent) > 0
    ) {

        html +=
            "租金：£" +
            Number(
                space.rent
            ).toLocaleString() +
            "<br>";
    }

    if (
        space.type === "property"
    ) {

        const owner =
            getPropertyOwner(
                Number(space.position)
            );

        if (owner) {

            html +=
                "👑 擁有人：" +
                escapeHtml(owner.name);

        } else {

            html +=
                "🏠 尚未有人購買";
        }
    }

    spaceInfo.innerHTML =
        html;
}


/* =========================================================
   EVENTS
========================================================= */

function renderEvents() {

    eventLog.innerHTML = "";

    for (
        const event of events
    ) {

        const item =
            document.createElement("div");

        item.className =
            "log-item";

        const time =
            new Date(
                event.created_at
            ).toLocaleTimeString(
                "zh-TW",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        item.textContent =
            "[" +
            time +
            "] " +
            (
                event.message ||
                event.event_type
            );

        eventLog.appendChild(
            item
        );
    }
}


/* =========================================================
   ROLL DICE
========================================================= */

rollBtn.addEventListener(
    "click",
    rollDice
);


async function rollDice() {

    /*
     * 前端再次確認
     */

    if (!gameState) return;

    if (
        gameState.current_player_id !==
        playerId
    ) {

        alert(
            "現在不是你的回合"
        );

        await loadGameState();

        return;
    }

    if (
        gameState.status !==
        "playing"
    ) {

        alert(
            "遊戲尚未開始"
        );

        return;
    }

    rollBtn.disabled = true;

    rollBtn.textContent =
        "🎲 擲骰中...";

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "roll_dice",
                {
                    p_game_id: gameId,
                    p_player_id: playerId
                }
            );

        if (error) {
            throw error;
        }

        console.log(
            "roll_dice result:",
            data
        );

        /*
         * 立即刷新一次
         *
         * 不等待 Realtime。
         */

        await loadGameState();

    } catch (err) {

        console.error(
            "rollDice:",
            err
        );

        alert(
            err.message ||
            "擲骰失敗"
        );

        await loadGameState();

    } finally {

        rollBtn.textContent =
            "🎲 擲骰";

        /*
         * renderTurn() 會根據
         * current_player_id 決定是否重新啟用。
         */

        renderTurn();
    }
}


/* =========================================================
   BUY PROPERTY
========================================================= */

buyBtn.addEventListener(
    "click",
    buyProperty
);


async function buyProperty() {

    const me =
        getMe();

    if (!me) return;

    if (
        gameState.current_player_id !==
        playerId
    ) {

        alert(
            "現在不是你的回合"
        );

        return;
    }

    const space =
        boardSpaces.find(
            s =>
                Number(s.position) ===
                Number(me.position)
        );

    if (
        !space ||
        space.type !== "property"
    ) {

        alert(
            "目前位置不是可購買地產"
        );

        return;
    }

    const owner =
        getPropertyOwner(
            Number(space.position)
        );

    if (owner) {

        alert(
            "這個地產已經有人購買"
        );

        return;
    }

    if (
        Number(me.money) <
        Number(space.price)
    ) {

        alert(
            "金錢不足"
        );

        return;
    }

    const ok =
        confirm(
            "確定購買 " +
            space.name +
            "？\n價格：£" +
            Number(
                space.price
            ).toLocaleString()
        );

    if (!ok) return;

    buyBtn.disabled = true;

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "buy_property",
                {
                    p_game_id: gameId,
                    p_player_id: playerId
                }
            );

        if (error) {
            throw error;
        }

        console.log(
            "buy_property:",
            data
        );

        await loadGameState();

    } catch (err) {

        console.error(
            "buyProperty:",
            err
        );

        alert(
            err.message ||
            "購買地產失敗"
        );

    } finally {

        buyBtn.disabled = false;

        renderTurn();
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   AUTO RESTORE SESSION
========================================================= */

async function restoreSession() {

    const saved =
        loadSession();

    if (!saved) return;

    /*
     * 只填入表單，
     * 不自動加入新的玩家。
     *
     * enterGame 前會檢查 player_id。
     */

    roomCodeInput.value =
        saved.roomCode || "";

    playerNameInput.value =
        saved.playerName || "";

    if (
        !saved.playerId
    ) return;

    try {

        const { data, error } =
            await supabaseClient
                .from("players")
                .select(`
                    id,
                    room_id,
                    game_id,
                    name,
                    player_number,
                    position,
                    money,
                    is_in_jail,
                    jail_turns,
                    is_bankrupt
                `)
                .eq("id", saved.playerId)
                .maybeSingle();

        if (
            error ||
            !data
        ) {

            return;
        }

        roomId =
            data.room_id;

        gameId =
            data.game_id;

        playerId =
            data.id;

        await enterGame();

    } catch (err) {

        console.error(
            "restoreSession:",
            err
        );
    }
}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    setConnection(
        "Supabase 連線中..."
    );

    await restoreSession();
}


initialize();
