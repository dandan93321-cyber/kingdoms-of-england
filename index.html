<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MONOPOLY UK - Supabase Multiplayer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#07101d;
    --bg2:#0d1b2d;
    --panel:#111d2d;
    --panel2:#17263a;
    --line:#2b405b;
    --text:#f4f7fb;
    --muted:#9eacbf;
    --green:#22d486;
    --blue:#3d7cff;
    --purple:#6655ff;
    --red:#ff5f70;
    --yellow:#f0c85c;
    --white:#ffffff;
    --shadow:0 25px 80px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    background:
        radial-gradient(circle at 50% 0%, #1b3557 0%, var(--bg) 55%, #030812 100%);
    color:var(--text);
}

body{
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.45;
}

.hidden{
    display:none !important;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:100;
    min-height:76px;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    background:rgba(5,13,24,.94);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#27db91,#16a967);
    color:#062318;
    font-size:22px;
    font-weight:900;
}

.brand-title{
    font-size:20px;
    font-weight:900;
    letter-spacing:.8px;
}

.connection{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    color:var(--muted);
    font-size:14px;
}

.connection-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff5d6d;
    box-shadow:0 0 10px rgba(255,93,109,.6);
}

.connection.ok .connection-dot{
    background:var(--green);
    box-shadow:0 0 10px rgba(34,212,134,.6);
}

/* =========================================================
   LAYOUT
========================================================= */

.container{
    width:min(1200px, calc(100% - 32px));
    margin:0 auto;
    padding:38px 0 70px;
}

.screen{
    width:100%;
}

.center-card{
    width:min(650px,100%);
    margin:8vh auto 0;
    padding:34px;
    background:rgba(14,27,44,.88);
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    box-shadow:var(--shadow);
}

h1{
    margin:0 0 10px;
    font-size:36px;
    line-height:1.1;
}

h2{
    margin:0 0 18px;
}

.subtitle{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:28px;
}

.section{
    margin-top:24px;
}

label{
    display:block;
    margin:0 0 8px;
    color:#b8c4d4;
    font-size:14px;
    font-weight:700;
}

input{
    width:100%;
    height:58px;
    padding:0 17px;
    border-radius:14px;
    border:1px solid #344a65;
    outline:none;
    background:#111e30;
    color:var(--text);
    font-size:17px;
    transition:.2s;
}

input:focus{
    border-color:#5f88ff;
    box-shadow:0 0 0 3px rgba(61,124,255,.15);
}

.form-group{
    margin-bottom:18px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.btn{
    min-height:56px;
    border:0;
    border-radius:14px;
    padding:0 20px;
    font-weight:900;
    font-size:17px;
    transition:transform .15s,filter .15s;
}

.btn:not(:disabled):active{
    transform:scale(.98);
}

.btn-primary{
    background:linear-gradient(135deg,#2bdc8d,#19bf76);
    color:#052419;
}

.btn-blue{
    background:linear-gradient(135deg,#3479ff,#6251ef);
    color:#fff;
}

.btn-dark{
    background:#243449;
    color:#fff;
    border:1px solid #3b4e66;
}

.btn-danger{
    background:#562633;
    color:#fff;
    border:1px solid #7d3c4d;
}

.notice{
    padding:14px 16px;
    border-radius:13px;
    background:rgba(240,200,92,.08);
    border:1px solid rgba(240,200,92,.35);
    color:#e7cf88;
    line-height:1.6;
    margin:20px 0;
}

.error{
    margin-top:16px;
    padding:13px 15px;
    border-radius:12px;
    background:rgba(255,95,112,.1);
    border:1px solid rgba(255,95,112,.3);
    color:#ff8794;
    line-height:1.5;
}

.success{
    margin-top:16px;
    padding:13px 15px;
    border-radius:12px;
    background:rgba(34,212,134,.1);
    border:1px solid rgba(34,212,134,.3);
    color:#61e5aa;
}

/* =========================================================
   LOBBY
========================================================= */

.lobby-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.panel{
    background:rgba(15,28,45,.9);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    padding:24px;
    box-shadow:0 15px 45px rgba(0,0,0,.18);
}

.room-code{
    font-size:38px;
    font-weight:900;
    letter-spacing:5px;
    margin:8px 0 20px;
}

.players-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.player-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px;
    border-radius:14px;
    background:#17263a;
    border:1px solid rgba(255,255,255,.05);
}

.player-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.player-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    background:#304766;
}

.player-row.me{
    border-color:rgba(34,212,134,.55);
}

.player-number{
    color:var(--muted);
    font-size:13px;
}

.status-pill{
    display:inline-flex;
    align-items:center;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.07);
    color:#b9c5d5;
    font-size:13px;
}

.status-pill.turn{
    background:rgba(34,212,134,.13);
    color:#55e7a4;
}

/* =========================================================
   GAME
========================================================= */

.game-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:20px;
    align-items:start;
}

.game-main{
    min-width:0;
}

.game-side{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.turn-banner{
    margin-bottom:18px;
    padding:18px 20px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.1);
    background:#111f31;
}

.turn-banner.my-turn{
    background:rgba(34,212,134,.08);
    border-color:rgba(34,212,134,.4);
}

.turn-title{
    font-size:22px;
    font-weight:900;
}

.turn-sub{
    margin-top:5px;
    color:var(--muted);
}

.dice-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:18px 0;
}

.die{
    width:68px;
    height:68px;
    border-radius:16px;
    background:#f5f7fb;
    color:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:900;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.dice-total{
    font-size:14px;
    color:var(--muted);
    text-align:center;
    margin-top:8px;
}

.roll-btn{
    width:100%;
    min-height:62px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#2f7cff,#6452f2);
    color:white;
    font-size:20px;
    font-weight:900;
    box-shadow:0 10px 25px rgba(48,110,255,.18);
}

.buy-btn{
    width:100%;
    margin-top:10px;
    min-height:54px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#ffd86a,#e9ad35);
    color:#251c04;
    font-weight:900;
    font-size:17px;
}

.space-card{
    margin-top:16px;
    padding:18px;
    border-radius:16px;
    background:#17263a;
    border:1px solid rgba(255,255,255,.07);
}

.space-name{
    font-size:20px;
    font-weight:900;
}

.space-meta{
    margin-top:7px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

.money{
    font-size:22px;
    font-weight:900;
    color:#61e5aa;
}

.game-players{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.game-player{
    padding:14px;
    border-radius:14px;
    background:#16253a;
    border:1px solid rgba(255,255,255,.05);
}

.game-player.current{
    border-color:rgba(34,212,134,.5);
    box-shadow:0 0 0 1px rgba(34,212,134,.08);
}

.game-player-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.game-player-name{
    font-weight:900;
}

.game-player-info{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    color:var(--muted);
    font-size:13px;
}

.events{
    max-height:350px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.event{
    padding:10px 12px;
    border-radius:10px;
    background:#152337;
    color:#c2ccda;
    font-size:13px;
    line-height:1.5;
}

.event strong{
    color:#fff;
}

.board-wrap{
    width:100%;
    overflow:auto;
    padding-bottom:4px;
}

.board{
    min-width:650px;
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(11,1fr);
    grid-template-rows:repeat(11,1fr);
    gap:3px;
    background:#07111f;
    padding:4px;
    border-radius:20px;
    border:1px solid #31445c;
    box-shadow:var(--shadow);
}

.board-space{
    position:relative;
    overflow:hidden;
    min-width:0;
    border-radius:5px;
    background:#e9edf2;
    color:#152033;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:4px;
    text-align:center;
    font-size:8px;
    font-weight:800;
}

.board-space.center{
    grid-column:2 / 11;
    grid-row:2 / 11;
    border-radius:12px;
    background:
        radial-gradient(circle at 50% 45%,#203e62,#0c1b2d 72%);
    color:#fff;
    justify-content:center;
    padding:20px;
}

.board-center-title{
    font-size:28px;
    letter-spacing:2px;
    font-weight:1000;
}

.board-center-sub{
    color:#9fb1c8;
    margin-top:7px;
    font-size:12px;
}

.board-space .color-bar{
    width:100%;
    height:9px;
    flex:none;
    margin-bottom:3px;
}

.board-space .space-price{
    margin-top:auto;
    font-size:7px;
    opacity:.75;
}

.board-space.property-owned{
    box-shadow:inset 0 0 0 2px rgba(35,210,134,.8);
}

.board-space.current-space{
    box-shadow:inset 0 0 0 3px #ffcc4d;
}

.tokens{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2px;
    margin-top:3px;
}

.token{
    width:17px;
    height:17px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:900;
    color:#07101d;
    border:2px solid rgba(255,255,255,.8);
}

.token-1{background:#55e8aa;}
.token-2{background:#67a3ff;}
.token-3{background:#ff7f91;}
.token-4{background:#ffd96a;}

/* =========================================================
   MODAL / LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,7,15,.72);
    backdrop-filter:blur(5px);
}

.loading.show{
    display:flex;
}

.loading-box{
    padding:24px 30px;
    border-radius:18px;
    background:#14243a;
    border:1px solid #344964;
    text-align:center;
}

.spinner{
    width:35px;
    height:35px;
    margin:0 auto 13px;
    border:4px solid rgba(255,255,255,.15);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:600;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    padding:13px 18px;
    border-radius:12px;
    background:#f2f5fa;
    color:#111827;
    font-weight:800;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    transition:.25s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){
    .game-layout{
        grid-template-columns:1fr;
    }

    .game-side{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .game-side > .panel:last-child{
        grid-column:1 / -1;
    }
}

@media(max-width:700px){
    .header{
        padding:12px 14px;
    }

    .brand-title{
        font-size:17px;
    }

    .connection{
        font-size:12px;
        padding:8px 10px;
    }

    .container{
        width:min(100% - 20px,1200px);
        padding-top:20px;
    }

    .center-card{
        padding:23px 18px;
        margin-top:5vh;
    }

    h1{
        font-size:30px;
    }

    .lobby-grid{
        grid-template-columns:1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .game-side{
        grid-template-columns:1fr;
    }

    .game-side > .panel:last-child{
        grid-column:auto;
    }

    .room-code{
        font-size:30px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="brand">
        <div class="logo">M</div>
        <div>
            <div class="brand-title">MONOPOLY UK</div>
        </div>
    </div>

    <div class="connection" id="connectionStatus">
        <span class="connection-dot"></span>
        <span id="connectionText">Supabase 連線中…</span>
    </div>
</header>

<main class="container">

    <!-- =====================================================
         HOME
    ====================================================== -->

    <section id="homeScreen" class="screen">

        <div class="center-card">

            <h1>🎲 加入遊戲</h1>

            <div class="subtitle">
                Supabase 多人即時版。<br>
                每位玩家使用自己的玩家身份，遊戲回合由 Supabase 控制。
            </div>

            <div class="notice">
                建議每位玩家使用自己的手機或瀏覽器加入同一個房間。
                房間狀態、玩家、骰子與回合會自動同步。
            </div>

            <div class="form-group">
                <label>玩家名稱</label>
                <input
                    id="homeName"
                    type="text"
                    maxlength="20"
                    placeholder="輸入你的名字"
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label>房間代碼</label>
                <input
                    id="homeRoomCode"
                    type="text"
                    maxlength="12"
                    placeholder="例如 ABC123"
                    autocomplete="off"
                    autocapitalize="characters"
                >
            </div>

            <div class="buttons">
                <button class="btn btn-primary" id="createRoomBtn">
                    建立房間
                </button>

                <button class="btn btn-blue" id="joinRoomBtn">
                    加入房間
                </button>
            </div>

            <div id="homeError" class="error hidden"></div>

        </div>

    </section>


    <!-- =====================================================
         LOBBY
    ====================================================== -->

    <section id="lobbyScreen" class="screen hidden">

        <div class="lobby-grid">

            <div class="panel">

                <div class="status-pill" id="lobbyStatus">
                    等待玩家
                </div>

                <h1 style="margin-top:16px;">🎲 遊戲房間</h1>

                <div class="room-code" id="lobbyRoomCode">
                    ------
                </div>

                <div class="subtitle" style="margin-bottom:0;">
                    把房間代碼給其他玩家即可加入。
                </div>

                <div class="section">

                    <button
                        id="startGameBtn"
                        class="btn btn-primary"
                        style="width:100%;"
                    >
                        開始遊戲
                    </button>

                    <button
                        id="leaveLobbyBtn"
                        class="btn btn-dark"
                        style="width:100%;margin-top:10px;"
                    >
                        離開房間
                    </button>

                </div>

                <div id="lobbyError" class="error hidden"></div>

            </div>


            <div class="panel">

                <h2>玩家</h2>

                <div
                    id="lobbyPlayers"
                    class="players-list"
                ></div>

                <div
                    id="lobbyHint"
                    class="subtitle"
                    style="margin-top:18px;margin-bottom:0;"
                ></div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <section id="gameScreen" class="screen hidden">

        <div class="game-layout">

            <div class="game-main">

                <div
                    id="turnBanner"
                    class="turn-banner"
                >
                    <div
                        id="turnTitle"
                        class="turn-title"
                    >
                        等待遊戲…
                    </div>

                    <div
                        id="turnSub"
                        class="turn-sub"
                    ></div>
                </div>


                <div class="board-wrap">
                    <div id="board" class="board">

                        <div class="board-space center">

                            <div class="board-center-title">
                                MONOPOLY
                            </div>

                            <div class="board-center-sub">
                                UK EDITION
                            </div>

                            <div
                                id="boardCenterInfo"
                                class="board-center-sub"
                                style="margin-top:18px;"
                            >
                                Supabase Multiplayer
                            </div>

                        </div>

                    </div>
                </div>

            </div>


            <aside class="game-side">

                <!-- DICE -->
                <div class="panel">

                    <h2>🎲 擲骰子</h2>

                    <div class="dice-area">

                        <div id="dice1" class="die">
                            —
                        </div>

                        <div id="dice2" class="die">
                            —
                        </div>

                    </div>

                    <div
                        id="diceTotal"
                        class="dice-total"
                    >
                        尚未擲骰
                    </div>

                    <button
                        id="rollDiceBtn"
                        class="roll-btn"
                        style="margin-top:16px;"
                    >
                        擲骰子
                    </button>

                    <div
                        id="spaceCard"
                        class="space-card hidden"
                    >

                        <div
                            id="spaceName"
                            class="space-name"
                        ></div>

                        <div
                            id="spaceMeta"
                            class="space-meta"
                        ></div>

                    </div>

                    <button
                        id="buyPropertyBtn"
                        class="buy-btn hidden"
                    >
                        購買地產
                    </button>

                    <div
                        id="gameActionError"
                        class="error hidden"
                    ></div>

                </div>


                <!-- PLAYERS -->
                <div class="panel">

                    <h2>👥 玩家</h2>

                    <div
                        id="gamePlayers"
                        class="game-players"
                    ></div>

                </div>


                <!-- EVENTS -->
                <div class="panel">

                    <h2>📜 遊戲紀錄</h2>

                    <div
                        id="gameEvents"
                        class="events"
                    ></div>

                </div>

            </aside>

        </div>

    </section>

</main>


<!-- =========================================================
     LOADING
========================================================== -->

<div id="loading" class="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            處理中…
        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://aeqhrcdlmpqncddridaj.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mpr9262EO73p6B6KHBhc7A_l-TBVzPc";

const { createClient } =
    window.supabase;

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentRoomId = null;
let currentGameId = null;
let currentPlayerId = null;

let currentState = null;
let realtimeChannel = null;

let lastRenderedPosition = null;

const STORAGE_KEYS = {
    roomId: "monopoly_room_id",
    gameId: "monopoly_game_id",
    playerId: "monopoly_player_id",
    roomCode: "monopoly_room_code",
    playerName: "monopoly_player_name"
};


/* =========================================================
   DOM
========================================================= */

const $ = (id) =>
    document.getElementById(id);


/* =========================================================
   BASIC UI
========================================================= */

function showScreen(name){

    $("homeScreen").classList.add("hidden");
    $("lobbyScreen").classList.add("hidden");
    $("gameScreen").classList.add("hidden");

    if(name === "home"){
        $("homeScreen").classList.remove("hidden");
    }

    if(name === "lobby"){
        $("lobbyScreen").classList.remove("hidden");
    }

    if(name === "game"){
        $("gameScreen").classList.remove("hidden");
    }
}


function setLoading(show, text="處理中…"){

    $("loadingText").textContent = text;

    if(show){
        $("loading").classList.add("show");
    }else{
        $("loading").classList.remove("show");
    }
}


function showError(elementId, message){

    const el = $(elementId);

    if(!el){
        return;
    }

    el.textContent = message || "發生錯誤";
    el.classList.remove("hidden");
}


function clearError(elementId){

    const el = $(elementId);

    if(el){
        el.textContent = "";
        el.classList.add("hidden");
    }
}


let toastTimer = null;

function toast(message){

    const el = $("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        el.classList.remove("show");
    }, 2600);
}


function getErrorMessage(error){

    if(!error){
        return "未知錯誤";
    }

    let message =
        error.message ||
        error.error_description ||
        error.details ||
        "未知錯誤";

    if(
        message.includes("現在不是你的回合")
    ){
        return "現在不是你的回合，請等待其他玩家。";
    }

    if(
        message.includes("遊戲尚未開始")
    ){
        return "遊戲尚未開始。";
    }

    if(
        message.includes("玩家不存在")
    ){
        return "找不到你的玩家身份，請重新加入房間。";
    }

    if(
        message.includes("房間已滿")
    ){
        return "房間已滿。";
    }

    if(
        message.includes("找不到房間")
    ){
        return "找不到這個房間。";
    }

    if(
        message.includes("金錢不足")
    ){
        return "你的金錢不足，不能購買。";
    }

    if(
        message.includes("這個地產已經有人購買")
    ){
        return "這個地產已經有人購買。";
    }

    if(
        message.includes("這個位置不是地產")
    ){
        return "目前位置不是可以購買的地產。";
    }

    return message;
}


/* =========================================================
   SESSION STORAGE
   每個瀏覽器分頁各自保存玩家身份。
   避免 A/B 玩家在同一裝置開不同分頁時互相覆蓋。
========================================================= */

function saveSession(){

    if(currentRoomId){
        sessionStorage.setItem(
            STORAGE_KEYS.roomId,
            currentRoomId
        );
    }

    if(currentGameId){
        sessionStorage.setItem(
            STORAGE_KEYS.gameId,
            currentGameId
        );
    }

    if(currentPlayerId){
        sessionStorage.setItem(
            STORAGE_KEYS.playerId,
            currentPlayerId
        );
    }

    const code =
        $("homeRoomCode").value.trim().toUpperCase();

    const name =
        $("homeName").value.trim();

    if(code){
        sessionStorage.setItem(
            STORAGE_KEYS.roomCode,
            code
        );
    }

    if(name){
        sessionStorage.setItem(
            STORAGE_KEYS.playerName,
            name
        );
    }
}


function loadSession(){

    currentRoomId =
        sessionStorage.getItem(
            STORAGE_KEYS.roomId
        );

    currentGameId =
        sessionStorage.getItem(
            STORAGE_KEYS.gameId
        );

    currentPlayerId =
        sessionStorage.getItem(
            STORAGE_KEYS.playerId
        );

    const roomCode =
        sessionStorage.getItem(
            STORAGE_KEYS.roomCode
        );

    const name =
        sessionStorage.getItem(
            STORAGE_KEYS.playerName
        );

    if(roomCode){
        $("homeRoomCode").value = roomCode;
    }

    if(name){
        $("homeName").value = name;
    }
}


function clearSession(){

    Object.values(STORAGE_KEYS)
        .forEach(key => {
            sessionStorage.removeItem(key);
        });

    currentRoomId = null;
    currentGameId = null;
    currentPlayerId = null;
    currentState = null;
}

/* =========================================================
   RPC HELPER
========================================================= */

async function callRpc(functionName, params){

    const { data, error } =
        await supabase.rpc(
            functionName,
            params
        );

    if(error){
        throw error;
    }

    return data;
}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom(){

    clearError("homeError");

    const name =
        $("homeName").value.trim();

    let roomCode =
        $("homeRoomCode").value.trim().toUpperCase();

    if(!name){
        showError(
            "homeError",
            "請先輸入玩家名稱。"
        );
        return;
    }

    if(!roomCode){

        roomCode =
            Math.random()
                .toString(36)
                .substring(2,8)
                .toUpperCase();

        $("homeRoomCode").value =
            roomCode;
    }

    if(!/^[A-Z0-9_-]{3,12}$/.test(roomCode)){
        showError(
            "homeError",
            "房間代碼請使用 3～12 個英數字元。"
        );
        return;
    }

    try{

        setLoading(true,"建立房間中…");

        const result =
            await callRpc(
                "create_room",
                {
                    p_room_code: roomCode
                }
            );

        currentRoomId =
            result.room_id;

        currentGameId =
            result.game_id;

        saveSession();

        /*
         * 建立房間後，建立者也必須透過 join_room
         * 成為真正的 players row。
         */
        const player =
            await callRpc(
                "join_room",
                {
                    p_room_code: roomCode,
                    p_name: name
                }
            );

        currentPlayerId =
            player.player_id;

        currentRoomId =
            player.room_id;

        currentGameId =
            player.game_id;

        saveSession();

        await subscribeRealtime();

        await refreshGameState();

        showScreen(
            currentState.game.status === "playing"
                ? "game"
                : "lobby"
        );

        toast("房間建立成功");

    }catch(error){

        console.error(error);

        showError(
            "homeError",
            getErrorMessage(error)
        );

    }finally{

        setLoading(false);
    }
}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom(){

    clearError("homeError");

    const name =
        $("homeName").value.trim();

    const roomCode =
        $("homeRoomCode")
            .value
            .trim()
            .toUpperCase();

    if(!name){
        showError(
            "homeError",
            "請輸入玩家名稱。"
        );
        return;
    }

    if(!roomCode){
        showError(
            "homeError",
            "請輸入房間代碼。"
        );
        return;
    }

    try{

        setLoading(true,"加入房間中…");

        const player =
            await callRpc(
                "join_room",
                {
                    p_room_code: roomCode,
                    p_name: name
                }
            );

        /*
         * 最重要：
         * 這裡保存「這個瀏覽器玩家自己的 ID」。
         *
         * 之後 roll_dice / buy_property
         * 都只使用這個 ID。
         */
        currentPlayerId =
            player.player_id;

        currentRoomId =
            player.room_id;

        currentGameId =
            player.game_id;

        saveSession();

        await subscribeRealtime();

        await refreshGameState();

        showScreen(
            currentState.game.status === "playing"
                ? "game"
                : "lobby"
        );

        toast("成功加入房間");

    }catch(error){

        console.error(error);

        showError(
            "homeError",
            getErrorMessage(error)
        );

    }finally{

        setLoading(false);
    }
}


/* =========================================================
   REFRESH GAME STATE
========================================================= */

async function refreshGameState(){

    if(!currentGameId){
        return;
    }

    try{

        const state =
            await callRpc(
                "get_game_state",
                {
                    p_game_id: currentGameId
                }
            );

        currentState = normalizeState(state);

        renderState();

    }catch(error){

        console.error(
            "get_game_state error:",
            error
        );
    }
}


/* =========================================================
   NORMALIZE STATE
========================================================= */

function normalizeState(state){

    if(!state){
        return {
            game:null,
            players:[],
            board:[],
            events:[]
        };
    }

    let game =
        state.game || null;

    let players =
        Array.isArray(state.players)
            ? state.players
            : [];

    let board =
        Array.isArray(state.board)
            ? state.board
            : [];

    /*
     * get_game_state 原本的 SQL 沒有回傳 events。
     * 因此另外查詢 game_events。
     */
    return {
        game,
        players,
        board,
        events:[]
    };
}


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents(){

    if(!currentGameId){
        return [];
    }

    const {
        data,
        error
    } = await supabase
        .from("game_events")
        .select("*")
        .eq("game_id",currentGameId)
        .order("created_at",{ascending:false})
        .limit(50);

    if(error){

        console.error(
            "loadEvents error:",
            error
        );

        return [];
    }

    return data || [];
}


/* =========================================================
   REALTIME
========================================================= */

async function subscribeRealtime(){

    if(!currentGameId){
        return;
    }

    if(realtimeChannel){

        try{
            await supabase.removeChannel(
                realtimeChannel
            );
        }catch(e){
            console.warn(e);
        }

        realtimeChannel = null;
    }

    const channelName =
        "monopoly-game-" + currentGameId;

    realtimeChannel =
        supabase.channel(channelName);

    realtimeChannel
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"games",
                filter:"id=eq." + currentGameId
            },
            async(payload) => {

                console.log(
                    "Realtime games:",
                    payload
                );

                await refreshGameState();
            }
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"players",
                filter:"game_id=eq." + currentGameId
            },
            async(payload) => {

                console.log(
                    "Realtime players:",
                    payload
                );

                await refreshGameState();
            }
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"game_events",
                filter:"game_id=eq." + currentGameId
            },
            async(payload) => {

                console.log(
                    "Realtime events:",
                    payload
                );

                await refreshGameState();
            }
        )
        .subscribe((status) => {

            console.log(
                "Realtime status:",
                status
            );

            if(status === "SUBSCRIBED"){

                setConnectionStatus(
                    true,
                    "Supabase 已連線"
                );

            }else if(
                status === "CHANNEL_ERROR" ||
                status === "TIMED_OUT"
            ){

                setConnectionStatus(
                    false,
                    "Realtime 連線異常"
                );
            }
        });
}


/* =========================================================
   RENDER STATE
========================================================= */

async function renderState(){

    if(!currentState){
        return;
    }

    /*
     * events 不在 get_game_state RPC 裡，
     * 所以每次狀態更新順便重新讀。
     */
    currentState.events =
        await loadEvents();

    const game =
        currentState.game;

    if(!game){
        return;
    }

    if(game.status === "waiting"){

        renderLobby();

        showScreen("lobby");

    }else{

        renderGame();

        showScreen("game");
    }
}


/* =========================================================
   LOBBY
========================================================= */

function renderLobby(){

    const game =
        currentState.game;

    const players =
        currentState.players;

    const roomCode =
        sessionStorage.getItem(
            STORAGE_KEYS.roomCode
        ) || "";

    $("lobbyRoomCode").textContent =
        roomCode || "------";

    $("lobbyStatus").textContent =
        game.status === "waiting"
            ? `${players.length} / 4 人`
            : "遊戲進行中";

    const list =
        $("lobbyPlayers");

    list.innerHTML = "";

    players.forEach(player => {

        const row =
            document.createElement("div");

        row.className =
            "player-row" +
            (
                player.id === currentPlayerId
                    ? " me"
                    : ""
            );

        const initial =
            (player.name || "?")
                .trim()
                .charAt(0)
                .toUpperCase();

        row.innerHTML = `
            <div class="player-left">
                <div class="player-avatar">
                    ${escapeHtml(initial)}
                </div>

                <div>
                    <div>
                        <strong>
                            ${escapeHtml(player.name)}
                        </strong>

                        ${
                            player.id === currentPlayerId
                            ? `<span class="status-pill turn" style="margin-left:6px;">你</span>`
                            : ""
                        }
                    </div>

                    <div class="player-number">
                        玩家 ${player.player_number}
                    </div>
                </div>
            </div>

            <div class="status-pill">
                已加入
            </div>
        `;

        list.appendChild(row);
    });

    if(players.length === 0){

        list.innerHTML =
            `<div class="subtitle">目前還沒有玩家。</div>`;
    }

    const me =
        players.find(
            p => p.id === currentPlayerId
        );

    /*
     * SQL 沒有 host 欄位。
     * 這裡以 player_number = 1
     * 作為房主 / 第一位玩家。
     */
    const isHost =
        me &&
        Number(me.player_number) === 1;

    $("startGameBtn").disabled =
        !isHost ||
        players.length < 1;

    $("startGameBtn").textContent =
        players.length >= 4
            ? "開始遊戲"
            : `開始遊戲（目前 ${players.length}/4）`;

    if(isHost){

        $("lobbyHint").textContent =
            "你是第一位玩家。可以等待其他玩家加入，或直接按「開始遊戲」。";

    }else{

        $("lobbyHint").textContent =
            "等待第一位玩家開始遊戲。";
    }
}

/* =========================================================
   GAME RENDER
========================================================= */

function renderGame(){

    const game =
        currentState.game;

    const players =
        currentState.players;

    const me =
        players.find(
            p => p.id === currentPlayerId
        );

    const currentPlayer =
        players.find(
            p => p.id === game.current_player_id
        );

    const isMyTurn =
        !!me &&
        game.current_player_id === currentPlayerId;

    /* -----------------------------------------------
       TURN
    ------------------------------------------------ */

    const banner =
        $("turnBanner");

    if(isMyTurn){

        banner.classList.add("my-turn");

        $("turnTitle").textContent =
            "🟢 輪到你了";

        $("turnSub").textContent =
            `你是 ${me.name}，請擲骰子。`;

    }else{

        banner.classList.remove("my-turn");

        $("turnTitle").textContent =
            currentPlayer
                ? `⏳ ${currentPlayer.name} 的回合`
                : "等待回合…";

        $("turnSub").textContent =
            currentPlayer
                ? "請等待對方完成擲骰。"
                : "";
    }


    /* -----------------------------------------------
       DICE
    ------------------------------------------------ */

    $("dice1").textContent =
        game.dice_1 || "—";

    $("dice2").textContent =
        game.dice_2 || "—";

    if(game.dice_1 && game.dice_2){

        $("diceTotal").textContent =
            `本回合：${game.dice_1} + ${game.dice_2} = ${game.dice_1 + game.dice_2}`;

    }else{

        $("diceTotal").textContent =
            "尚未擲骰";
    }


    /*
     * 只有真正 current_player_id
     * 與自己的 player_id 相同時才能按。
     */
    $("rollDiceBtn").disabled =
        !isMyTurn ||
        game.status !== "playing";


    /* -----------------------------------------------
       PLAYERS
    ------------------------------------------------ */

    renderGamePlayers();

    /* -----------------------------------------------
       BOARD
    ------------------------------------------------ */

    renderBoard();

    /* -----------------------------------------------
       EVENTS
    ------------------------------------------------ */

    renderEvents();

    /* -----------------------------------------------
       CURRENT SPACE
    ------------------------------------------------ */

    if(me){

        const space =
            currentState.board.find(
                b =>
                    Number(b.position) ===
                    Number(me.position)
            );

        renderSpaceCard(
            space,
            me
        );
    }

    $("boardCenterInfo").textContent =
        `回合 ${game.turn_number || 0} · ${players.length} 位玩家`;
}

/* =========================================================
   BOARD
========================================================= */

function boardGridPosition(position){

    /*
     * Monopoly 40 格繞外圈。
     * 這裡把 0 放右下角，
     * 然後順時針繞一圈。
     */

    if(position >= 0 && position <= 10){

        /*
         * bottom row
         * 0 = bottom-right
         * 10 = bottom-left
         */
        return {
            row:11,
            col:11 - position
        };
    }

    if(position >= 11 && position <= 20){

        /*
         * left column
         * 11 = row 10
         * 20 = row 1
         */
        return {
            row:21 - position,
            col:1
        };
    }

    if(position >= 21 && position <= 30){

        /*
         * top row
         * 21 = top-left
         * 30 = top-right
         */
        return {
            row:1,
            col:position - 20
        };
    }

    /*
     * right column
     * 31 = row 2
     * 39 = row 10
     */
    return {
        row:position - 29,
        col:11
    };
}


const COLOR_MAP = {
    brown:"#955b3e",
    light_blue:"#77cce8",
    pink:"#e889b8",
    orange:"#ee9c4a",
    red:"#e55a58",
    yellow:"#e9cb58",
    green:"#54a96e",
    dark_blue:"#405dba"
};


function renderBoard(){

    const board =
        $("board");

    /*
     * 保留中央。
     */
    const center =
        board.querySelector(".center");

    board.innerHTML = "";

    board.appendChild(center);

    const players =
        currentState.players;

    const boardSpaces =
        currentState.board || [];

    boardSpaces.forEach(space => {

        const position =
            Number(space.position);

        if(position === 0){
            // 正常處理
        }

        const grid =
            boardGridPosition(position);

        const div =
            document.createElement("div");

        div.className =
            "board-space";

        div.style.gridRow =
            grid.row;

        div.style.gridColumn =
            grid.col;

        const propertyOwner =
            getPropertyOwner(position);

        if(propertyOwner){
            div.classList.add(
                "property-owned"
            );
        }

        if(
            players.some(
                p =>
                    Number(p.position) === position
            )
        ){
            div.classList.add(
                "current-space"
            );
        }

        let colorBar = "";

        if(space.color_group){

            colorBar = `
                <div
                    class="color-bar"
                    style="background:${COLOR_MAP[space.color_group] || "#777"}"
                ></div>
            `;
        }

        let icon = "";

        if(space.type === "railroad"){
            icon = "🚂";
        }else if(space.type === "utility"){
            icon = "💡";
        }else if(space.type === "chance"){
            icon = "❓";
        }else if(space.type === "community_chest"){
            icon = "📦";
        }else if(space.type === "tax"){
            icon = "💷";
        }else if(space.type === "jail"){
            icon = "🔒";
        }else if(space.type === "go_to_jail"){
            icon = "🚔";
        }else if(space.type === "free_parking"){
            icon = "🅿️";
        }else if(space.type === "go"){
            icon = "➡️";
        }

        const tokens =
            players
                .filter(
                    p =>
                        Number(p.position) === position
                )
                .map(
                    p => {

                        const cls =
                            `token-${Math.min(
                                4,
                                Math.max(
                                    1,
                                    Number(p.player_number) || 1
                                )
                            )}`;

                        const initial =
                            (p.name || "?")
                                .charAt(0)
                                .toUpperCase();

                        return `
                            <span
                                class="token ${cls}"
                                title="${escapeHtml(p.name)}"
                            >
                                ${escapeHtml(initial)}
                            </span>
                        `;
                    }
                )
                .join("");

        div.innerHTML = `
            ${colorBar}

            <div style="font-size:10px;">
                ${icon}
            </div>

            <div style="line-height:1.15;">
                ${escapeHtml(space.name)}
            </div>

            ${
                space.type === "property"
                    ? `
                        <div class="space-price">
                            £${space.price}
                        </div>
                    `
                    : ""
            }

            <div class="tokens">
                ${tokens}
            </div>

            ${
                propertyOwner
                    ? `
                        <div
                            style="
                                margin-top:2px;
                                color:#14895c;
                                font-size:7px;
                            "
                        >
                            ${escapeHtml(propertyOwner.name)}
                        </div>
                    `
                    : ""
            }
        `;

        board.appendChild(div);
    });
}


/* =========================================================
   PROPERTY OWNERSHIP
========================================================= */

function getPropertyOwner(position){

    const events =
        currentState.events || [];

    /*
     * 你的 SQL 使用 game_events
     * 的 property_purchase 代表地產所有權。
     *
     * 因此這裡不依賴 players 表增加 owner_id，
     * 完全跟你的 SQL 一致。
     */
    const purchase =
        events
            .filter(
                e =>
                    e.event_type ===
                    "property_purchase"
            )
            .find(
                e =>
                    Number(
                        e.data &&
                        e.data.position
                    ) === Number(position)
            );

    if(!purchase){
        return null;
    }

    return currentState.players.find(
        p => p.id === purchase.player_id
    ) || null;
}


/* =========================================================
   CURRENT SPACE
========================================================= */

function renderSpaceCard(space, me){

    const card =
        $("spaceCard");

    const buyButton =
        $("buyPropertyBtn");

    clearError("gameActionError");

    if(!space || !me){

        card.classList.add("hidden");
        buyButton.classList.add("hidden");

        return;
    }

    card.classList.remove("hidden");

    $("spaceName").textContent =
        space.name;

    let meta = "";

    if(space.type === "property"){

        const owner =
            getPropertyOwner(
                Number(space.position)
            );

        meta +=
            `地產 · 價格 £${space.price} · 租金 £${space.rent}`;

        if(owner){

            meta +=
                `<br>👤 擁有者：${escapeHtml(owner.name)}`;

            buyButton.classList.add(
                "hidden"
            );

        }else{

            meta +=
                `<br>目前無人擁有`;

            /*
             * 只有「目前回合玩家」
             * 且人在這個地產時才顯示。
             */
            const isMyTurn =
                currentState.game
                    .current_player_id ===
                currentPlayerId;

            if(
                isMyTurn &&
                Number(me.money) >=
                    Number(space.price)
            ){

                buyButton.classList.remove(
                    "hidden"
                );

            }else{

                buyButton.classList.add(
                    "hidden"
                );
            }
        }

    }else{

        meta =
            escapeHtml(
                space.description || ""
            );

        buyButton.classList.add(
            "hidden"
        );
    }

    $("spaceMeta").innerHTML =
        meta;
}


/* =========================================================
   BUY PROPERTY
========================================================= */

async function buyProperty(){

    clearError("gameActionError");

    if(!currentGameId || !currentPlayerId){
        return;
    }

    const game =
        currentState.game;

    /*
     * 前端先檢查一次。
     * 最終權限仍由 SQL RPC 判斷。
     */
    if(
        game.current_player_id !==
        currentPlayerId
    ){

        showError(
            "gameActionError",
            "現在不是你的回合。"
        );

        return;
    }

    try{

        setLoading(true,"購買地產中…");

        const result =
            await callRpc(
                "buy_property",
                {
                    p_game_id: currentGameId,
                    p_player_id: currentPlayerId
                }
            );

        await refreshGameState();

        toast(
            `成功購買 ${result.property}`
        );

    }catch(error){

        console.error(error);

        showError(
            "gameActionError",
            getErrorMessage(error)
        );

    }finally{

        setLoading(false);
    }
}


/* =========================================================
   ROLL DICE
========================================================= */

async function rollDice(){

    clearError("gameActionError");

    if(!currentGameId || !currentPlayerId){

        showError(
            "gameActionError",
            "找不到你的玩家身份，請重新加入房間。"
        );

        return;
    }

    const game =
        currentState.game;

    /*
     * 最重要的前端判斷：
     *
     * 不是比較 player_number。
     * 不是判斷「我是房主」。
     *
     * 而是直接比較：
     *
     * games.current_player_id
     * ===
     * 我自己的 player_id
     */
    if(
        game.current_player_id !==
        currentPlayerId
    ){

        showError(
            "gameActionError",
            "現在不是你的回合，請等待其他玩家。"
        );

        return;
    }

    try{

        setLoading(true,"骰子擲出中…");

        /*
         * 這裡一定傳「自己的 ID」。
         */
        const result =
            await callRpc(
                "roll_dice",
                {
                    p_game_id: currentGameId,
                    p_player_id: currentPlayerId
                }
            );

        /*
         * RPC 已在 Supabase database transaction
         * 中更新：
         *
         * dice_1
         * dice_2
         * players.position
         * players.money
         * games.current_player_id
         * games.turn_number
         * game_events
         *
         * 然後透過 Realtime 同步給所有玩家。
         */
        await refreshGameState();

        toast(
            `你擲出 ${result.dice1} + ${result.dice2} = ${result.total}`
        );

    }catch(error){

        console.error(error);

        showError(
            "gameActionError",
            getErrorMessage(error)
        );

    }finally{

        setLoading(false);
    }
}


/* =========================================================
   EVENTS
========================================================= */

function renderEvents(){

    const events =
        currentState.events || [];

    const players =
        currentState.players;

    const list =
        $("gameEvents");

    list.innerHTML = "";

    if(events.length === 0){

        list.innerHTML =
            `<div class="subtitle">目前還沒有遊戲紀錄。</div>`;

        return;
    }

    events.forEach(event => {

        const player =
            players.find(
                p => p.id === event.player_id
            );

        const div =
            document.createElement("div");

        div.className =
            "event";

        const time =
            event.created_at
                ? new Date(
                    event.created_at
                ).toLocaleTimeString(
                    "zh-TW",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )
                : "";

        div.innerHTML = `
            <strong>
                ${escapeHtml(
                    event.message || event.event_type
                )}
            </strong>

            ${
                time
                    ? `
                        <span
                            style="
                                float:right;
                                color:#718199;
                            "
                        >
                            ${time}
                        </span>
                    `
                    : ""
            }
        `;

        list.appendChild(div);
    });
}


/* =========================================================
   LEAVE
========================================================= */

async function leaveRoom(){

    if(realtimeChannel){

        try{
            await supabase.removeChannel(
                realtimeChannel
            );
        }catch(e){
            console.warn(e);
        }

        realtimeChannel = null;
    }

    clearSession();

    $("homeName").value = "";
    $("homeRoomCode").value = "";

    showScreen("home");

    toast("已離開房間");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =========================================================
   SUPABASE CONNECTION TEST
========================================================= */

async function testConnection(){

    try{

        /*
         * board_spaces 是公開 SELECT。
         * 用它測試 Supabase URL / key。
         */
        const {
            error
        } = await supabase
            .from("board_spaces")
            .select("position")
            .limit(1);

        if(error){
            throw error;
        }

        setConnectionStatus(
            true,
            "Supabase 已連線"
        );

    }catch(error){

        console.error(
            "Supabase connection error:",
            error
        );

        setConnectionStatus(
            false,
            "Supabase 連線失敗"
        );
    }
}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession(){

    loadSession();

    /*
     * 沒有完整身份就不要直接進遊戲。
     */
    if(
        !currentGameId ||
        !currentPlayerId
    ){
        showScreen("home");
        return;
    }

    try{

        setLoading(
            true,
            "恢復遊戲狀態中…"
        );

        await subscribeRealtime();

        await refreshGameState();

        if(
            !currentState ||
            !currentState.game
        ){

            clearSession();

            showScreen("home");

            return;
        }

        /*
         * 確認這個 player_id
         * 真的存在於目前 game。
         */
        const me =
            currentState.players.find(
                p => p.id === currentPlayerId
            );

        if(!me){

            clearSession();

            showScreen("home");

            showError(
                "homeError",
                "這個玩家身份已不存在，請重新加入房間。"
            );

            return;
        }

        if(
            currentState.game.status ===
            "waiting"
        ){

            showScreen("lobby");

        }else{

            showScreen("game");
        }

    }catch(error){

        console.error(
            "restore session error:",
            error
        );

        clearSession();

        showScreen("home");

    }finally{

        setLoading(false);
    }
}


/* =========================================================
   VISIBILITY REFRESH
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if(
            !document.hidden &&
            currentGameId
        ){

            await refreshGameState();
        }
    }
);

   START
========================================================= */

(async function init(){

    await testConnection();

    await restoreSession();

})();
