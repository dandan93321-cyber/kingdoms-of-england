<script>

/* =========================================================

/* =========================================================

const PLAYER_COLORS = [

/* =========================================================

/* =========================================================
   MODULE 24：UTILITY FUNCTIONS
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}


function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(el => el.classList.remove("active"));

    $(id).classList.add("active");
}


function showMessage(message, error = false) {

    const el = $("roomMessage");

    el.innerHTML =
        `<div style="color:${error ? "#ff8d8d" : "#8df0a7"}">
            ${escapeHtml(message)}
        </div>`;
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   MODULE 25：CONNECTION
   ========================================================= */

function setConnection(text) {
    $("connectionStatus").textContent = text;
}


/* =========================================================
   MODULE 26：CREATE / JOIN ROOM
   ========================================================= */

async function joinOrCreateRoom() {

    const roomCode =
        $("roomCodeInput").value.trim();

    const name =
        $("playerNameInput").value.trim();

    if (!roomCode) {
        showMessage("請輸入房間代碼", true);
        return;
    }

    if (!name) {
        showMessage("請輸入玩家名稱", true);
        return;
    }

    try {

        setConnection("連線中...");

        let result =
            await supabaseClient.rpc(
                "join_room",
                {
                    p_room_code: roomCode,
                    p_name: name
                }
            );


        /*
         * 如果房間不存在，就建立房間後再加入。
         */

        if (result.error) {

            const createResult =
                await supabaseClient.rpc(
                    "create_room",
                    {
                        p_room_code: roomCode
                    }
                );

            if (createResult.error) {
                throw createResult.error;
            }

            result =
                await supabaseClient.rpc(
                    "join_room",
                    {
                        p_room_code: roomCode,
                        p_name: name
                    }
                );
        }

        if (result.error) {
            throw result.error;
        }

        const data = result.data;

        me = data;

        await loadGame(data.game_id);

        subscribeRealtime(data.game_id);

        showScreen("gameScreen");

        setConnection("已連線");

    } catch (error) {

        console.error(error);

        setConnection("連線失敗");

        showMessage(
            error.message || "加入房間失敗",
            true
        );
    }
}


/* =========================================================
   MODULE 27：LOAD GAME STATE
   ========================================================= */

async function loadGame(gameId) {

    const { data, error } =
        await supabaseClient.rpc(
            "get_game_state",
            {
                p_game_id: gameId
            }
        );

    if (error) {
        throw error;
    }

    if (!data) {
        throw new Error("沒有取得遊戲資料");
    }

    game = data.game;

    players = data.players || [];

    boardSpaces = data.board || [];

    room = {
        id: players[0]?.room_id || null
    };

    renderBoard();

    renderPlayers();

    updateTurnUI();

    await loadEvents();

}


/* =========================================================
   MODULE 28：REALTIME
   ========================================================= */

function subscribeRealtime(gameId) {

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(realtimeChannel);
    }


    realtimeChannel =
        supabaseClient
            .channel("monopoly-game-" + gameId)


            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "games",
                    filter: `id=eq.${gameId}`
                },
                async () => {

                    await loadGame(gameId);

                }
            )


            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players",
                    filter: `game_id=eq.${gameId}`
                },
                async () => {

                    await loadGame(gameId);

                }
            )


            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "game_events",
                    filter: `game_id=eq.${gameId}`
                },
                async () => {

                    await loadEvents();

                }
            )


            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                    if (
                        status === "SUBSCRIBED"
                    ) {
                        setConnection("Realtime 已連線");
                    }
                }
            );
}


/* =========================================================
   MODULE 29：BOARD RENDER
   ========================================================= */

function renderBoard() {

    const board = $("board");

    board.innerHTML = `

        <div class="center">

            <div class="center-title">
                MONOPOLY
            </div>

            <div class="center-sub">
                UK EDITION
            </div>

        </div>
    `;


    const spaces =
        boardSpaces.length
            ? boardSpaces
            : FALLBACK_BOARD.map(
                (x, i) => ({
                    position: i,
                    name: x[0],
                    type: x[1],
                    price: 0,
                    color_group: null
                })
            );


    spaces.forEach(space => {

        const el =
            document.createElement("div");

        el.className = "space";

        el.dataset.position =
            space.position;


        const coord =
            getBoardCoordinate(
                space.position
            );

        el.style.gridColumn =
            coord.column;

        el.style.gridRow =
            coord.row;


        const color =
            getColorGroup(
                space.color_group
            );


        el.innerHTML = `

            <div
                class="space-color"
                style="background:${color}"
            ></div>

            <div class="space-icon">
                ${getSpaceIcon(space.type)}
            </div>

            <div class="space-name">
                ${escapeHtml(space.name)}
            </div>

            ${
                space.price > 0
                ?
                `<div class="space-price">
                    £${space.price}
                </div>`
                :
                ""
            }

            <div
                class="pieces"
                data-piece-position="${space.position}"
            ></div>

        `;


        board.appendChild(el);

    });


    renderPieces();
}


/* =========================================================
   MODULE 30：CLASSIC BOARD COORDINATE
   ========================================================= */

function getBoardCoordinate(position) {

    /*
     * 0 = 右下 GO
     * 1~10 = 下方
     * 11~20 = 左方
     * 21~30 = 上方
     * 31~39 = 右方
     */

    if (position === 0) {

        return {
            column: "11",
            row: "11"
        };

    }

    if (position <= 10) {

        return {
            column: String(11 - position),
            row: "11"
        };

    }

    if (position <= 20) {

        return {
            column: "1",
            row: String(11 - (position - 10))
        };

    }

    if (position <= 30) {

        return {
            column: String(position - 20 + 1),
            row: "1"
        };

    }

    return {

        column: "11",

        row:
            String(
                position - 30 + 1
            )

    };

}

/* =========================================================
   MODULE 32：PLAYER PIECES
   ========================================================= */

function renderPieces() {

/* =========================================================
   MODULE 33：PLAYER LIST
   ========================================================= */

function renderPlayers() {

    const list =
        $("playersList");

    list.innerHTML = "";


    players.forEach(
        (player, index) => {

            const div =
                document.createElement("div");

            div.className =

                    class="player-dot"

                ></div>

                <div class="player-info">

                    <div class="player-name">

                        ${
                            player.id === me?.player_id
                            ? "（你）"
                            : ""
                        }

                    </div>

                    <div class="player-money">

                    </div>

/* =========================================================
   MODULE 34：TURN UI
   ========================================================= */

function updateTurnUI() {

    if (!game) return;


    const current =
        players.find(
            p =>
                p.id ===
                game.current_player_id
        );


    if (!current) {

        $("turnBanner").textContent =
            "等待玩家";

        return;
    }


    const myTurn =
        current.id === me?.player_id;


    $("turnBanner").textContent =
        myTurn
            ? "🎲 現在是你的回合"
            : `等待 ${current.name}...`;


    $("rollButton").disabled =
        !myTurn ||
        hasRolledThisTurn ||
        actionRequired;


    $("endTurnButton").disabled =
        !myTurn ||
        !hasRolledThisTurn ||
        actionRequired;


    if (
        game.dice_1
        &&
        game.dice_2
    ) {

        $("dice1").textContent =
            game.dice_1;

        $("dice2").textContent =
            game.dice_2;

    }


}


/* =========================================================
   MODULE 35：ROLL DICE
   ========================================================= */

async function rollDice() {

    if (!me || !game) return;


    if (
        game.current_player_id
        !== me.player_id
    ) {

        alert("現在不是你的回合");

        return;
    }


    if (hasRolledThisTurn) {

        alert(
            "本回合已經擲過骰子，請先處理落點並結束回合。"
        );

        return;
    }


    try {

        $("rollButton").disabled =
            true;


        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "roll_dice",
                {
                    p_game_id: game.id,
                    p_player_id: me.player_id
                }
            );


        if (error) {
            throw error;
        }


        hasRolledThisTurn = true;

        actionRequired = true;


        $("dice1").textContent =
            data.dice1;

        $("dice2").textContent =
            data.dice2;


        await loadGame(game.id);


        /*
         * 等資料更新後，再處理落點。
         */

        await handleLanding(data);


    } catch(error) {

        console.error(error);

        alert(
            error.message ||
            "擲骰子失敗"
        );


        hasRolledThisTurn =
            false;

        actionRequired =
            false;

        updateTurnUI();

    }

}


/* =========================================================
   MODULE 36：LANDING LOGIC
   ========================================================= */

async function handleLanding(result) {

    const type =
        result.space_type;


    /*
     * 地產
     */

    if (type === "property") {

        const space =
            boardSpaces.find(
                s =>
                    s.position ===
                    result.new_position
            );


        if (!space) {

            actionRequired = false;

            updateTurnUI();

            return;
        }


        /*
         * 判斷是否已經有人買
         */

        const owner =
            await getPropertyOwner(
                result.new_position
            );


        if (
            !owner &&
            space.price > 0
        ) {

            showPropertyPurchase(
                space
            );

            return;

        }


        /*
         * 如果有主人，付租金。
         */

        if (
            owner &&
            owner.id !== me.player_id
        ) {

            await payRent(
                space,
                owner
            );

            return;

        }


        /*
         * 自己的地產
         */

        actionRequired =
            false;

        updateTurnUI();

        return;
    }


    /*
     * Chance
     */

    if (type === "chance") {

        drawCard(
            "chance"
        );

        return;
    }


    /*
     * Community Chest
     */

    if (type === "community_chest") {

        drawCard(
            "community_chest"
        );

        return;
    }


    /*
     * 稅
     */

    if (type === "tax") {

        await payTax(result);

        return;
    }


    /*
     * 其他格子
     */

    actionRequired =
        false;

    updateTurnUI();

}


/* =========================================================
   MODULE 37：PROPERTY OWNER
   ========================================================= */

async function getPropertyOwner(position) {

    const { data, error } =
        await supabaseClient
            .from("game_events")
            .select("*")
            .eq("game_id", game.id)
            .eq(
                "event_type",
                "property_purchase"
            );


    if (error) {

        console.error(error);

        return null;
    }


    /*
     * 找最後一次購買這個位置的人
     */

    const purchases =
        (data || [])
            .filter(
                event =>
                    Number(
                        event.data?.position
                    ) === position
            )
            .sort(
                (a,b) =>
                    new Date(b.created_at)
                    -
                    new Date(a.created_at)
            );


    if (!purchases.length) {
        return null;
    }


    return players.find(
        p =>
            p.id ===
            purchases[0].player_id
    ) || null;
}


/* =========================================================
   MODULE 38：BUY PROPERTY UI
   ========================================================= */

function showPropertyPurchase(space) {

    actionRequired = true;

    updateTurnUI();


    showModal(

        `
        <div class="event-card">

            <div class="event-card-title">
                🏠 ${escapeHtml(space.name)}
            </div>

            <div class="event-card-text">

                這塊地產目前沒有人購買。

                <br><br>

                價格：
                <strong>£${space.price}</strong>

                <br><br>

                要購買這塊地產嗎？

            </div>

        </div>
        `,

        [

            {
                text: "購買地產",
                className: "primary-btn",
                action: async () => {

                    await buyProperty(
                        space
                    );

                }
            },

            {
                text: "暫不購買",
                className: "secondary-btn",
                action: () => {

                    closeModal();

                    actionRequired =
                        false;

                    updateTurnUI();

                }
            }

        ]

    );
}


/* =========================================================
   MODULE 39：BUY PROPERTY RPC
   ========================================================= */

async function buyProperty(space) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "buy_property",
                {
                    p_game_id: game.id,
                    p_player_id: me.player_id
                }
            );


        if (error) {
            throw error;
        }


        closeModal();


        actionRequired =
            false;


        await loadGame(
            game.id
        );


        updateTurnUI();


        alert(
            `你購買了 ${space.name}！`
        );


    } catch(error) {

        console.error(error);

        alert(
            error.message ||
            "購買失敗"
        );

    }

}


/* =========================================================
   MODULE 40：PAY RENT
   ========================================================= */

async function payRent(space, owner) {

    /*
     * 這裡目前只提示租金。
     *
     * 你目前的 SQL schema 沒有
     * 「property owner」欄位，
     * 因此正式版本建議增加
     * property_ownership table。
     */

    showModal(

        `
        <div class="event-card">

            <div class="event-card-title">
                💰 支付租金
            </div>

            <div class="event-card-text">

                ${escapeHtml(space.name)}
                屬於
                <strong>${escapeHtml(owner.name)}</strong>

                <br><br>

                租金：
                <strong>£${space.rent}</strong>

            </div>

        </div>
        `,

        [

            {
                text: "確認",
                className: "primary-btn",
                action: () => {

                    closeModal();

                    actionRequired =
                        false;

                    updateTurnUI();

                }
            }

        ]

    );

}


/* =========================================================
   MODULE 41：TAX
   ========================================================= */

async function payTax(result) {

    const amount =
        result.space === "Income Tax"
            ? 200
            : 100;


    showModal(

        `
        <div class="event-card">

            <div class="event-card-title">
                💷 稅務
            </div>

            <div class="event-card-text">

                你需要支付：

                <br><br>

                <strong>£${amount}</strong>

            </div>

        </div>
        `,

        [

            {
                text: "確認支付",
                className: "primary-btn",
                action: async () => {

                    closeModal();

                    actionRequired =
                        false;

                    updateTurnUI();

                }
            }

        ]

    );

}


/* =========================================================
   MODULE 42：DRAW CARD
   ========================================================= */

function drawCard(type) {

    const cards =
        type === "chance"
            ? CHANCE_CARDS
            : COMMUNITY_CHEST_CARDS;


    const card =
        cards[
            Math.floor(
                Math.random()
                *
                cards.length
            )
        ];


    showModal(

        `
        <div class="event-card">

            <div class="event-card-title">

                ${
                    type === "chance"
                        ? "❓ 機會卡"
                        : "🎁 福利卡"
                }

            </div>

            <h3>
                ${escapeHtml(card.title)}
            </h3>

            <div class="event-card-text">

                ${escapeHtml(card.text)}

            </div>

        </div>
        `,

        [

            {
                text: "領取 / 執行卡片",
                className: "primary-btn",
                action: async () => {

                    closeModal();

                    await executeCard(
                        card
                    );

                }
            }

        ]

    );

}


/* =========================================================
   MODULE 43：CARD EFFECT
   ========================================================= */

async function executeCard(card) {

    try {

        if (card.type === "money") {

            /*
             * 注意：
             * 目前 SQL 沒有通用 adjust_money RPC。
             * 所以正式版本應增加 server-side RPC。
             */

            alert(
                card.money > 0
                    ? `你獲得 £${card.money}`
                    : `你支付 £${Math.abs(card.money)}`
            );

        }


        if (card.type === "goto") {

            /*
             * 正式版本應透過 RPC 修改 position。
             */

            alert(
                `前往 ${card.position}`
            );

        }


        if (card.type === "jail") {

            alert(
                "你被送進監獄。"
            );

        }


        actionRequired =
            false;

        updateTurnUI();


    } catch(error) {

        console.error(error);

        alert(
            error.message ||
            "卡片執行失敗"
        );

    }

}


/* =========================================================
   MODULE 44：END TURN
   ========================================================= */

async function endTurn() {

    if (!me || !game) return;


    if (
        game.current_player_id
        !== me.player_id
    ) {

        alert(
            "現在不是你的回合"
        );

        return;
    }


    if (!hasRolledThisTurn) {

        alert(
            "請先擲骰子"
        );

        return;
    }


    /*
     * 非常重要：
     *
     * 你目前提供的 Supabase SQL
     * 沒有 end_turn RPC。
     *
     * 因此不能安全地直接從瀏覽器
     * 修改 current_player_id。
     *
     * 這也是之前出現
     * 「永遠第一個玩家能骰」
     * 的核心問題之一。
     */

    alert(
        "目前資料庫版本需要加入 end_turn RPC，才能安全切換下一位玩家。"
    );

}


/* =========================================================
   MODULE 45：EVENT LOG
   ========================================================= */

async function loadEvents() {

    if (!game) return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("game_events")
            .select("*")
            .eq(
                "game_id",
                game.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(50);


    if (error) {

        console.error(error);

        return;
    }


    const log =
        $("eventLog");

    log.innerHTML = "";


    (data || [])
        .forEach(event => {

            const div =
                document.createElement("div");

            div.className =
                "log-item";


            div.textContent =
                event.message ||
                event.event_type;


            log.appendChild(div);

        });

}


/* =========================================================
   MODULE 46：MODAL
   ========================================================= */

function showModal(
    content,
    buttons = []
) {

    $("modalContent").innerHTML =
        content;


    const actions =
        $("modalActions");

    actions.innerHTML = "";


    buttons.forEach(
        button => {

            const el =
                document.createElement("button");

            el.textContent =
                button.text;

            el.className =
                button.className ||
                "secondary-btn";


            el.onclick =
                button.action;


            actions.appendChild(el);

        }
    );


    $("actionModal")
        .classList.add("show");

}


function closeModal() {

    $("actionModal")
        .classList.remove("show");

}


/* =========================================================
   MODULE 47：START GAME
   ========================================================= */

async function startGame() {

    if (!game) return;


    try {

        const {
            error
        } =
            await supabaseClient.rpc(
                "start_game",
                {
                    p_game_id: game.id
                }
            );


        if (error) {
            throw error;
        }


        await loadGame(
            game.id
        );


    } catch(error) {

        console.error(error);

        alert(
            error.message ||
            "開始遊戲失敗"
        );

    }

}

        setConnection(
            "Supabase 已載入"
        );

    } catch(error) {

        console.error(error);

        setConnection(

        );

initialize();
