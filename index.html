<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>UK Monopoly - Supabase</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #06111f;
    --panel: #0d1b2d;
    --panel2: #15263a;
    --border: #29405a;
    --text: #f4f7fb;
    --muted: #9aaabd;
    --green: #20d47a;
    --green2: #10b968;
    --red: #ff5d6c;
    --gold: #f4c95d;
    --blue: #4fa3ff;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #142c47 0%, #071321 48%, #030a12 100%);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .45;
}

/* =====================================================
   HEADER
===================================================== */

header {
    height: 78px;
    background: rgba(3, 10, 19, .92);
    border-bottom: 1px solid #1d3045;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(14px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 800;
}

.logo-box {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: linear-gradient(135deg, #21d87b, #0ca85f);
    color: #032014;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    font-weight: 900;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
}

.dot.online {
    background: var(--green);
    box-shadow: 0 0 12px rgba(32,212,122,.7);
}

/* =====================================================
   LAYOUT
===================================================== */

main {
    width: min(1250px, 94%);
    margin: 28px auto 60px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* =====================================================
   LOGIN
===================================================== */

.login-card {
    width: min(650px, 100%);
    margin: 10vh auto 0;
    padding: 38px;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: rgba(13,27,45,.92);
    box-shadow: 0 30px 90px rgba(0,0,0,.38);
}

.login-card h1 {
    font-size: 38px;
    margin: 0 0 8px;
}

.login-card .subtitle {
    color: var(--muted);
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 28px;
}

.notice {
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid #65562b;
    background: rgba(100,80,20,.16);
    color: #f3d889;
    margin-bottom: 22px;
    line-height: 1.5;
}

label {
    display: block;
    color: var(--muted);
    margin: 18px 0 8px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 16px 17px;
    border-radius: 14px;
    border: 1px solid #30465e;
    background: #17283b;
    color: white;
    outline: none;
}

input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(32,212,122,.12);
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 22px;
}

.btn {
    border: 0;
    border-radius: 14px;
    padding: 15px 18px;
    font-weight: 800;
    color: white;
    background: #24364b;
    border: 1px solid #38506a;
}

.btn.primary {
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: #042115;
    border: 0;
}

.btn.danger {
    background: #5b2730;
    border-color: #793b45;
}

.btn.gold {
    background: #69521d;
    border-color: #856b2a;
}

.btn:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

/* =====================================================
   ROOM
===================================================== */

.room-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.room-code {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
}

.room-status {
    color: var(--muted);
}

.players-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.player-card {
    background: rgba(13,27,45,.95);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
}

.player-card.current {
    border-color: var(--green);
    box-shadow: 0 0 0 1px rgba(32,212,122,.15);
}

.player-number {
    color: var(--muted);
    font-size: 13px;
}

.player-name {
    font-size: 20px;
    font-weight: 800;
    margin: 7px 0;
}

.player-money {
    color: #7cf3ae;
    font-weight: 700;
}

.waiting-box {
    margin-top: 20px;
    padding: 22px;
    background: rgba(13,27,45,.92);
    border: 1px solid var(--border);
    border-radius: 20px;
}

/* =====================================================
   GAME
===================================================== */

.game-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 20px;
}

.game-board-wrap {
    background: rgba(8,19,32,.88);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px;
}

.board {
    width: min(780px, 100%);
    margin: auto;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    grid-template-rows: repeat(11, 1fr);
    gap: 3px;
    background: #081421;
}

.space {
    position: relative;
    min-width: 0;
    min-height: 0;
    background: #edf2f5;
    color: #101820;
    border-radius: 4px;
    padding: 3px;
    overflow: hidden;
    font-size: clamp(6px, 1vw, 11px);
}

.space.center {
    background: #102337;
    color: white;
    grid-column: 2 / 11;
    grid-row: 2 / 11;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.center-title {
    font-size: clamp(20px, 5vw, 52px);
    font-weight: 900;
    letter-spacing: 2px;
    transform: rotate(-35deg);
}

.space-name {
    font-weight: 800;
    line-height: 1.05;
}

.space-price {
    font-size: .85em;
    margin-top: 3px;
}

.color-strip {
    height: 12%;
    min-height: 4px;
    margin: -3px -3px 3px;
}

.tokens {
    position: absolute;
    right: 2px;
    bottom: 2px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 2px;
}

.token {
    width: clamp(13px, 2vw, 22px);
    height: clamp(13px, 2vw, 22px);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1bd477;
    color: #03170d;
    border: 2px solid white;
    font-size: clamp(7px, 1vw, 11px);
    font-weight: 900;
}

.token.t1 { background: #ff5d6c; }
.token.t2 { background: #4fa3ff; }
.token.t3 { background: #f4c95d; }
.token.t4 { background: #b987ff; }

/* =====================================================
   SIDE PANEL
===================================================== */

.side-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.panel {
    background: rgba(13,27,45,.94);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
}

.panel-title {
    font-weight: 800;
    font-size: 17px;
    margin-bottom: 13px;
}

.turn-box {
    text-align: center;
    padding: 10px;
}

.turn-player {
    font-size: 23px;
    font-weight: 900;
    color: var(--green);
}

.dice {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0;
}

.die {
    width: 58px;
    height: 58px;
    border-radius: 13px;
    background: #f4f7fb;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 900;
}

.money-big {
    text-align: center;
    font-size: 28px;
    color: #77efaa;
    font-weight: 900;
}

.my-position {
    color: var(--muted);
    text-align: center;
    margin-top: 5px;
}

.side-actions {
    display: grid;
    gap: 9px;
}

.event-list {
    max-height: 260px;
    overflow-y: auto;
}

.event {
    padding: 9px 0;
    border-bottom: 1px solid #203247;
    font-size: 13px;
    line-height: 1.4;
}

.event:last-child {
    border-bottom: 0;
}

.event-time {
    color: #687b90;
    font-size: 11px;
}

/* =====================================================
   PROPERTY
===================================================== */

.property-list {
    display: grid;
    gap: 7px;
}

.property-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: #14263a;
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 13px;
}

.owner {
    color: #7cf3ae;
    font-weight: 700;
}

/* =====================================================
   TOAST
===================================================== */

#toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: #15283d;
    border: 1px solid #38516c;
    border-radius: 14px;
    padding: 13px 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 999;
    max-width: 90%;
    text-align: center;
}

#toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

#toast.error {
    border-color: #8b3b47;
    background: #3b1c23;
}

.hidden {
    display: none !important;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {
    header {
        height: 68px;
        padding: 0 15px;
    }

    .logo {
        font-size: 18px;
    }

    .logo-box {
        width: 36px;
        height: 36px;
    }

    main {
        width: 96%;
        margin-top: 16px;
    }

    .game-layout {
        grid-template-columns: 1fr;
    }

    .side-panel {
        order: 2;
    }

    .players-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .login-card {
        margin-top: 6vh;
        padding: 25px;
    }

    .login-card h1 {
        font-size: 31px;
    }
}

@media (max-width: 500px) {
    .connection span {
        display: none;
    }

    .players-grid {
        grid-template-columns: 1fr 1fr;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .room-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .game-board-wrap {
        padding: 7px;
        border-radius: 16px;
    }

    .board {
        gap: 2px;
    }

    .space {
        padding: 2px;
    }

    .color-strip {
        height: 9%;
        min-height: 3px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-box">M</div>
        <div>UK MONOPOLY</div>
    </div>

    <div class="connection">
        <div id="connectionDot" class="dot"></div>
        <span id="connectionText">連線中...</span>
    </div>
</header>

<main>

<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<section id="loginScreen" class="screen active">

    <div class="login-card">

        <h1>UK Monopoly</h1>

        <div class="subtitle">
            Supabase 多人即時版。<br>
            房間、玩家、骰子、回合與遊戲狀態由 Supabase 控制。
        </div>

        <div class="notice">
            已連接 Supabase。<br>
            建立房間後，其他玩家使用相同房間代碼加入。
        </div>

        <label for="playerName">玩家名稱</label>
        <input
            id="playerName"
            maxlength="20"
            autocomplete="off"
            placeholder="例如：David"
        >

        <label for="roomCode">房間代碼</label>
        <input
            id="roomCode"
            maxlength="20"
            autocomplete="off"
            placeholder="例如：TEST1"
        >

        <div class="actions">

            <button
                id="createBtn"
                class="btn primary"
                onclick="createRoom()">
                建立房間
            </button>

            <button
                id="joinBtn"
                class="btn"
                onclick="joinRoom()">
                加入房間
            </button>

        </div>

        <div id="loginMessage"
             style="margin-top:16px;color:#ff737f;">
        </div>

    </div>

</section>


<!-- =====================================================
     ROOM SCREEN
===================================================== -->

<section id="roomScreen" class="screen">

    <div class="room-top">

        <div>
            <div class="room-status">房間代碼</div>
            <div id="roomCodeDisplay" class="room-code">----</div>
        </div>

        <button
            class="btn"
            onclick="copyRoomCode()">
            複製房間代碼
        </button>

    </div>

    <div class="panel">

        <div class="panel-title">
            房間玩家
        </div>

        <div id="playersGrid" class="players-grid"></div>

    </div>

    <div class="waiting-box">

        <div id="roomStatusText">
            等待其他玩家加入...
        </div>

        <div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;">

            <button
                id="manualStartBtn"
                class="btn primary"
                onclick="startGame()">
                開始遊戲
            </button>

            <button
                class="btn danger"
                onclick="leaveRoom()">
                離開房間
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section id="gameScreen" class="screen">

    <div class="game-layout">

        <div class="game-board-wrap">

            <div id="board" class="board"></div>

        </div>


        <aside class="side-panel">

            <!-- TURN -->

            <div class="panel">

                <div class="panel-title">
                    🎲 回合
                </div>

                <div class="turn-box">

                    <div class="turn-player"
                         id="turnPlayer">
                        -
                    </div>

                    <div id="turnNumber"
                         style="color:#8295aa;margin-top:4px;">
                        第 0 回合
                    </div>

                    <div class="dice">

                        <div id="dice1" class="die">?</div>
                        <div id="dice2" class="die">?</div>

                    </div>

                    <button
                        id="rollBtn"
                        class="btn primary"
                        style="width:100%;"
                        onclick="rollDice()">
                        🎲 擲骰子
                    </button>

                </div>

            </div>


            <!-- MY PLAYER -->

            <div class="panel">

                <div class="panel-title">
                    👤 我的玩家
                </div>

                <div id="myName"
                     style="font-size:21px;font-weight:800;text-align:center;">
                    -
                </div>

                <div id="myMoney"
                     class="money-big">
                    £0
                </div>

                <div id="myPosition"
                     class="my-position">
                    -
                </div>

            </div>


            <!-- ACTIONS -->

            <div class="panel">

                <div class="panel-title">
                    操作
                </div>

                <div class="side-actions">

                    <button
                        id="buyBtn"
                        class="btn gold"
                        onclick="buyProperty()"
                        disabled>
                        🏠 購買地產
                    </button>

                    <button
                        class="btn"
                        onclick="startGame()">
                        ▶ 開始 / 繼續遊戲
                    </button>

                    <button
                        class="btn danger"
                        onclick="leaveRoom()">
                        離開
                    </button>

                </div>

            </div>


            <!-- PROPERTIES -->

            <div class="panel">

                <div class="panel-title">
                    🏠 地產
                </div>

                <div id="propertyList"
                     class="property-list">
                    尚無地產
                </div>

            </div>


            <!-- EVENTS -->

            <div class="panel">

                <div class="panel-title">
                    📜 遊戲紀錄
                </div>

                <div id="eventList"
                     class="event-list">
                </div>

            </div>

        </aside>

    </div>

</section>

</main>


<div id="toast"></div>


<script type="module">

/* =====================================================
   SUPABASE CONFIG
===================================================== */

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://aeqhrcdlmpqncddridaj.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_mpr9262EO73p6B6KHBhc7A_l-TBVzPc";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let roomId = null;
let gameId = null;
let playerId = null;
let roomCode = null;

let gameState = null;

let realtimeChannel = null;


/* =====================================================
   DOM
===================================================== */

const $ = id => document.getElementById(id);


/* =====================================================
   INIT
===================================================== */

window.addEventListener("load", async () => {

    $("connectionDot").classList.remove("online");
    $("connectionText").textContent = "連線中...";

    try {

        const { error } =
            await supabase
                .from("board_spaces")
                .select("position")
                .limit(1);

        if (error) {
            throw error;
        }

        $("connectionDot").classList.add("online");
        $("connectionText").textContent =
            "Supabase 已連線";

    } catch (error) {

        console.error(error);

        $("connectionText").textContent =
            "Supabase 連線失敗";

        showToast(
            "Supabase 連線失敗，請檢查 Project URL / Publishable Key",
            true
        );
    }

});


/* =====================================================
   SCREEN
===================================================== */

function showScreen(name) {

    document.querySelectorAll(".screen")
        .forEach(el => el.classList.remove("active"));

    $(name + "Screen")
        .classList.add("active");
}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function showToast(message, error = false) {

    const el = $("toast");

    el.textContent = message;

    el.classList.toggle("error", error);
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        el.classList.remove("show");
    }, 3000);
}


/* =====================================================
   ERROR
===================================================== */

function errorMessage(error) {

    if (!error) {
        return "發生未知錯誤";
    }

    return error.message ||
           error.details ||
           error.hint ||
           String(error);
}


/* =====================================================
   CREATE ROOM
===================================================== */

window.createRoom = async function() {

    const name =
        $("playerName").value.trim();

    let code =
        $("roomCode").value.trim().toUpperCase();

    if (!name) {
        showLoginError("請輸入玩家名稱");
        return;
    }

    if (!code) {
        code = randomRoomCode();
        $("roomCode").value = code;
    }

    setLoginBusy(true);

    try {

        const { data, error } =
            await supabase.rpc(
                "create_room",
                {
                    p_room_code: code
                }
            );

        if (error) {
            throw error;
        }

        roomId = data.room_id;
        gameId = data.game_id;
        roomCode = data.room_code;

        /*
         * create_room 只建立 room/game，
         * 所以建立房間的人還需要自己 join_room。
         */

        const { data: player, error: joinError } =
            await supabase.rpc(
                "join_room",
                {
                    p_room_code: roomCode,
                    p_name: name
                }
            );

        if (joinError) {
            throw joinError;
        }

        playerId = player.player_id;

        await enterRoom();

        showToast("房間建立成功");

    } catch (error) {

        console.error(error);

        showLoginError(
            errorMessage(error)
        );

    } finally {

        setLoginBusy(false);

    }
};


/* =====================================================
   JOIN ROOM
===================================================== */

window.joinRoom = async function() {

    const name =
        $("playerName").value.trim();

    const code =
        $("roomCode").value.trim().toUpperCase();

    if (!name) {
        showLoginError("請輸入玩家名稱");
        return;
    }

    if (!code) {
        showLoginError("請輸入房間代碼");
        return;
    }

    setLoginBusy(true);

    try {

        const { data, error } =
            await supabase.rpc(
                "join_room",
                {
                    p_room_code: code,
                    p_name: name
                }
            );

        if (error) {
            throw error;
        }

        roomId = data.room_id;
        gameId = data.game_id;
        playerId = data.player_id;
        roomCode = code;

        await enterRoom();

        showToast("成功加入房間");

    } catch (error) {

        console.error(error);

        showLoginError(
            errorMessage(error)
        );

    } finally {

        setLoginBusy(false);

    }
};


/* =====================================================
   ENTER ROOM
===================================================== */

async function enterRoom() {

    $("roomCodeDisplay").textContent =
        roomCode;

    showScreen("room");

    subscribeRealtime();

    await loadGameState();

}


/* =====================================================
   LOAD GAME STATE
===================================================== */

async function loadGameState() {

    if (!gameId) return;

    const { data, error } =
        await supabase.rpc(
            "get_game_state",
            {
                p_game_id: gameId
            }
        );

    if (error) {

        console.error(error);

        showToast(
            errorMessage(error),
            true
        );

        return;
    }

    gameState = data;

    renderAll();
}


/* =====================================================
   REALTIME
===================================================== */

function subscribeRealtime() {

    if (realtimeChannel) {

        supabase.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;
    }

    realtimeChannel =
        supabase
            .channel(
                "monopoly-" + gameId
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "games",
                    filter: "id=eq." + gameId
                },
                async () => {

                    await loadGameState();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "players",
                    filter: "game_id=eq." + gameId
                },
                async () => {

                    await loadGameState();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "game_events",
                    filter: "game_id=eq." + gameId
                },
                async () => {

                    await loadGameState();

                }
            )

            .subscribe(status => {

                console.log(
                    "Realtime:",
                    status
                );

            });
}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll() {

    if (!gameState) return;

    renderRoom();

    renderBoard();

    renderGameInfo();

    renderProperties();

    renderEvents();

    const status =
        gameState.game?.status;

    if (
        status === "playing" ||
        status === "finished"
    ) {
        showScreen("game");
    } else {
        showScreen("room");
    }
}


/* =====================================================
   RENDER ROOM
===================================================== */

function renderRoom() {

    const players =
        gameState.players || [];

    const game =
        gameState.game || {};

    $("roomCodeDisplay").textContent =
        roomCode || "----";

    $("playersGrid").innerHTML =
        players.map(player => {

            const current =
                game.current_player_id === player.id;

            return `
                <div class="player-card ${current ? "current" : ""}">
                    <div class="player-number">
                        PLAYER ${player.player_number}
                    </div>

                    <div class="player-name">
                        ${escapeHtml(player.name)}
                        ${current ? " 🎲" : ""}
                    </div>

                    <div class="player-money">
                        £${player.money}
                    </div>

                    <div style="color:#8194a8;font-size:13px;margin-top:5px;">
                        位置：${player.position}
                        ${player.is_in_jail ? " · 監獄" : ""}
                    </div>
                </div>
            `;

        }).join("");


    if (game.status === "playing") {

        $("roomStatusText").textContent =
            "遊戲進行中";

    } else {

        $("roomStatusText").textContent =
            `目前 ${players.length} / 4 名玩家。可以等待其他玩家，或手動開始遊戲。`;
    }

}


/* =====================================================
   START GAME
===================================================== */

window.startGame = async function() {

    if (!gameId) {
        return;
    }

    try {

        const { error } =
            await supabase.rpc(
                "start_game",
                {
                    p_game_id: gameId
                }
            );

        if (error) {
            throw error;
        }

        await loadGameState();

        showToast("遊戲開始");

    } catch (error) {

        console.error(error);

        showToast(
            errorMessage(error),
            true
        );
    }
};


/* =====================================================
   RENDER GAME INFO
===================================================== */

function renderGameInfo() {

    const game =
        gameState.game || {};

    const players =
        gameState.players || [];

    const me =
        players.find(
            p => p.id === playerId
        );

    const current =
        players.find(
            p => p.id === game.current_player_id
        );

    $("turnPlayer").textContent =
        current
            ? current.name
            : "-";

    $("turnNumber").textContent =
        `第 ${game.turn_number || 0} 回合`;

    $("dice1").textContent =
        game.dice_1 || "?";

    $("dice2").textContent =
        game.dice_2 || "?";


    if (me) {

        $("myName").textContent =
            me.name;

        $("myMoney").textContent =
            `£${me.money}`;

        const space =
            gameState.board.find(
                b => b.position === me.position
            );

        $("myPosition").textContent =
            `位置 ${me.position} · ${space ? space.name : ""}`;

    }


    const myTurn =
        game.status === "playing" &&
        game.current_player_id === playerId;

    $("rollBtn").disabled =
        !myTurn;

    updateBuyButton(me, myTurn);

}


/* =====================================================
   BOARD
===================================================== */

function boardCoordinate(position) {

    /*
     * Monopoly 40 格排列。
     * position 0 = 左下 GO
     * 順時針排列。
     */

    if (position === 0) {
        return [11, 11];
    }

    if (position >= 1 && position <= 10) {
        return [
            11,
            11 - position
        ];
    }

    if (position >= 11 && position <= 20) {
        return [
            11 - (position - 10),
            1
        ];
    }

    if (position >= 21 && position <= 30) {
        return [
            1,
            position - 20
        ];
    }

    if (position >= 31 && position <= 39) {
        return [
            position - 30,
            11
        ];
    }

    return [1,1];
}


function renderBoard() {

    const board =
        $("board");

    const spaces =
        gameState.board || [];

    board.innerHTML = "";

    /*
     * 建立中心區域
     */

    const center =
        document.createElement("div");

    center.className =
        "space center";

    center.innerHTML =
        `<div class="center-title">UK<br>MONOPOLY</div>`;

    board.appendChild(center);


    /*
     * 建立 40 格
     */

    spaces.forEach(space => {

        const [row, col] =
            boardCoordinate(space.position);

        const el =
            document.createElement("div");

        el.className =
            "space";

        el.style.gridRow =
            row;

        el.style.gridColumn =
            col;


        const owner =
            getPropertyOwner(
                space.position
            );

        const color =
            colorForGroup(
                space.color_group
            );


        el.innerHTML = `

            ${
                space.color_group
                ? `<div class="color-strip"
                        style="background:${color}">
                   </div>`
                : ""
            }

            <div class="space-name">
                ${escapeHtml(space.name)}
            </div>

            ${
                space.price
                ? `<div class="space-price">
                        £${space.price}
                   </div>`
                : ""
            }

            ${
                owner
                ? `<div style="
                        color:#078d4e;
                        font-weight:900;
                        font-size:.82em;
                        margin-top:2px;">
                        ${escapeHtml(owner.name)}
                   </div>`
                : ""
            }

            <div class="tokens"
                 id="tokens-${space.position}">
            </div>
        `;

        board.appendChild(el);

    });


    /*
     * 玩家棋子
     */

    (gameState.players || [])
        .forEach(player => {

            const tokenBox =
                document.getElementById(
                    "tokens-" + player.position
                );

            if (!tokenBox) return;

            const token =
                document.createElement("div");

            token.className =
                "token t" +
                player.player_number;

            token.textContent =
                player.player_number;

            token.title =
                player.name;

            tokenBox.appendChild(token);

        });

}


/* =====================================================
   COLOR GROUP
===================================================== */

function colorForGroup(group) {

    const colors = {

        brown: "#8b5a2b",

        light_blue: "#75c9e8",

        pink: "#df77b7",

        orange: "#f39a3d",

        red: "#e84d55",

        yellow: "#f1d44e",

        green: "#48ad65",

        dark_blue: "#4169c1"

    };

    return colors[group] || "#777";
}


/* =====================================================
   PROPERTY OWNER
===================================================== */

function getPropertyOwner(position) {

    if (!gameState || !gameState.events) {
        /*
         * get_game_state 原 SQL 沒有回傳 events。
         * 所以 owner 在 render 前由 events cache 提供。
         */
    }

    const purchase =
        propertyPurchases.find(
            e =>
                Number(e.data?.position) ===
                Number(position)
        );

    if (!purchase) {
        return null;
    }

    return (gameState.players || [])
        .find(p => p.id === purchase.player_id)
        || null;
}


/* =====================================================
   PROPERTY CACHE
===================================================== */

let propertyPurchases = [];


async function loadPropertyPurchases() {

    if (!gameId) return;

    const { data, error } =
        await supabase
            .from("game_events")
            .select(
                "id,player_id,event_type,message,data,created_at"
            )
            .eq("game_id", gameId)
            .eq("event_type", "property_purchase")
            .order("id", {
                ascending: true
            });

    if (error) {

        console.error(error);

        return;
    }

    propertyPurchases =
        data || [];
}


/* =====================================================
   RENDER PROPERTIES
===================================================== */

function renderProperties() {

    /*
     * 先從已經載入的 purchase event
     * 建立地產所有權。
     */

    const purchases =
        propertyPurchases || [];

    if (!purchases.length) {

        $("propertyList").innerHTML =
            `<div style="color:#71859b;">
                尚無玩家購買地產
             </div>`;

        return;
    }

    $("propertyList").innerHTML =
        purchases.map(event => {

            const position =
                Number(event.data?.position);

            const space =
                gameState.board.find(
                    b => b.position === position
                );

            const owner =
                gameState.players.find(
                    p => p.id === event.player_id
                );

            if (!space) return "";

            return `
                <div class="property-item">

                    <span>
                        ${escapeHtml(space.name)}
                    </span>

                    <span class="owner">
                        ${owner
                            ? escapeHtml(owner.name)
                            : "未知"}
                    </span>

                </div>
            `;

        }).join("");
}


/* =====================================================
   RENDER EVENTS
===================================================== */

async function renderEvents() {

    if (!gameId) return;

    const { data, error } =
        await supabase
            .from("game_events")
            .select(
                "id,player_id,event_type,message,data,created_at"
            )
            .eq("game_id", gameId)
            .order("id", {
                ascending: false
            })
            .limit(50);

    if (error) {

        console.error(error);

        return;
    }

    const events =
        data || [];

    /*
     * 同步地產 ownership cache
     */

    propertyPurchases =
        events
            .filter(
                e =>
                    e.event_type ===
                    "property_purchase"
            )
            .reverse();


    /*
     * 重新繪製棋盤與地產
     */

    renderBoard();

    renderProperties();


    $("eventList").innerHTML =
        events.map(event => {

            const time =
                new Date(
                    event.created_at
                ).toLocaleTimeString(
                    "zh-TW",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            return `
                <div class="event">

                    <div>
                        ${escapeHtml(
                            event.message || event.event_type
                        )}
                    </div>

                    <div class="event-time">
                        ${time}
                    </div>

                </div>
            `;

        }).join("");
}


/* =====================================================
   BUY BUTTON
===================================================== */

function updateBuyButton(
    player,
    myTurn
) {

    const btn =
        $("buyBtn");

    if (!player || !myTurn) {

        btn.disabled = true;

        return;
    }

    const space =
        gameState.board.find(
            b => b.position === player.position
        );

    if (!space) {

        btn.disabled = true;

        return;
    }

    const alreadyOwned =
        getPropertyOwner(
            space.position
        );

    btn.disabled =
        space.type !== "property" ||
        !!alreadyOwned ||
        player.money < space.price;

}


/* =====================================================
   ROLL DICE
===================================================== */

window.rollDice = async function() {

    if (!gameId || !playerId) {
        return;
    }

    const game =
        gameState?.game;

    if (
        !game ||
        game.current_player_id !== playerId
    ) {

        showToast(
            "現在不是你的回合",
            true
        );

        return;
    }

    $("rollBtn").disabled = true;

    try {

        const { data, error } =
            await supabase.rpc(
                "roll_dice",
                {
                    p_game_id: gameId,
                    p_player_id: playerId
                }
            );

        if (error) {
            throw error;
        }

        $("dice1").textContent =
            data.dice1;

        $("dice2").textContent =
            data.dice2;

        showToast(
            `你擲出 ${data.dice1} + ${data.dice2} = ${data.total}`
        );

        await loadGameState();

    } catch (error) {

        console.error(error);

        showToast(
            errorMessage(error),
            true
        );

        await loadGameState();

    }

};


/* =====================================================
   BUY PROPERTY
===================================================== */

window.buyProperty = async function() {

    if (!gameId || !playerId) {
        return;
    }

    try {

        const { data, error } =
            await supabase.rpc(
                "buy_property",
                {
                    p_game_id: gameId,
                    p_player_id: playerId
                }
            );

        if (error) {
            throw error;
        }

        showToast(
            `成功購買 ${data.property}，支付 £${data.price}`
        );

        await loadGameState();

    } catch (error) {

        console.error(error);

        showToast(
            errorMessage(error),
            true
        );

    }

};


/* =====================================================
   COPY ROOM CODE
===================================================== */

window.copyRoomCode = async function() {

    try {

        await navigator.clipboard.writeText(
            roomCode
        );

        showToast(
            "房間代碼已複製"
        );

    } catch {

        showToast(
            `房間代碼：${roomCode}`
        );
    }
};


/* =====================================================
   LEAVE
===================================================== */

window.leaveRoom = async function() {

    if (
        !confirm(
            "確定要離開目前房間嗎？"
        )
    ) {
        return;
    }

    if (realtimeChannel) {

        await supabase.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;
    }

    roomId = null;
    gameId = null;
    playerId = null;
    roomCode = null;
    gameState = null;
    propertyPurchases = [];

    showScreen("login");

    $("loginMessage").textContent = "";

};


/* =====================================================
   LOGIN UI
===================================================== */

function setLoginBusy(busy) {

    $("createBtn").disabled = busy;
    $("joinBtn").disabled = busy;

    if (busy) {

        $("loginMessage").style.color =
            "#9aaabd";

        $("loginMessage").textContent =
            "連線中，請稍候...";

    }
}


function showLoginError(message) {

    $("loginMessage").style.color =
        "#ff737f";

    $("loginMessage").textContent =
        message;
}


/* =====================================================
   RANDOM ROOM CODE
===================================================== */

function randomRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 5; i++) {

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];
    }

    return result;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   REFRESH PROPERTY EVENTS
===================================================== */

setInterval(async () => {

    if (gameId) {

        await loadPropertyPurchases();

        renderBoard();
        renderProperties();

    }

}, 5000);


/* =====================================================
   EXPOSE DEBUG
===================================================== */

window.monopoly = {
    supabase,
    getState: () => gameState,
    getGameId: () => gameId,
    getPlayerId: () => playerId
};
